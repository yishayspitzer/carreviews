<!DOCTYPE html>
<html lang="yi" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>CarReviews — טעלעפאן אדמין</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#0b1f3a;--navy2:#122c52;--blue:#2563eb;--teal:#0891b2;--gold:#f59e0b;--green:#16a34a;--red:#dc2626;--orange:#ea580c;--purple:#7c3aed;
  --bg:#e6ebf3;--card:#fff;--line:#b9c4d4;--line2:#dde3ec;--text:#0f172a;--muted:#475569;--shadow:0 4px 18px rgba(15,23,42,.12);--r:14px}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Rubik,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:15px}
button,input,select,textarea{font-family:inherit;font-size:15px}
.hidden{display:none!important}
.ltr{direction:ltr;unicode-bidi:plaintext;display:inline-block}
svg.ic{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.2em;flex:none}

/* ---------- login ---------- */
#loginView{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
  background:radial-gradient(circle at 20% 20%,#1e3a8a 0,transparent 45%),radial-gradient(circle at 80% 80%,#0e7490 0,transparent 45%),var(--navy)}
.loginCard{width:min(420px,100%);background:#fff;border-radius:20px;padding:34px 30px;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.loginCard .logo{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.mark{width:46px;height:46px;border-radius:13px;background:linear-gradient(135deg,var(--blue),var(--teal));display:flex;align-items:center;justify-content:center;color:#fff;flex:none}
.loginCard h1{font-size:22px;margin:0}
.loginCard .sub{color:var(--muted);font-size:13px;margin:0 0 22px}
label.f{display:block;font-weight:700;font-size:14px;color:#1e293b;margin:12px 0 6px}
.in{width:100%;padding:11px 13px;border:1.5px solid #94a3b8;border-radius:10px;background:#fff;outline:none;transition:.15s;color:var(--text)}
.in:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.18)}
input.in.ltr{display:block;text-align:left}
textarea.in{resize:vertical;max-width:100%;min-height:84px;line-height:1.5}
.pwrow{display:flex;direction:ltr;align-items:stretch;border:1.5px solid #94a3b8;border-radius:10px;background:#fff;overflow:hidden}
.pwrow:focus-within{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.18)}
.pwrow input{flex:1;min-width:0;border:0;outline:0;padding:11px 13px;background:transparent;text-align:left;direction:ltr;color:var(--text)}
.pwrow button.eye{flex:none;width:48px;border:0;border-inline-start:1px solid #cbd5e1;background:#f1f5f9;color:#334155;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;margin:0;border-radius:0;box-shadow:none}
.pwrow button.eye:hover{background:#e2e8f0;transform:none;filter:none}
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 18px;border:0;border-radius:10px;cursor:pointer;font-weight:700;font-size:15px;background:var(--blue);color:#fff;transition:.15s;white-space:nowrap;box-shadow:0 2px 6px rgba(15,23,42,.15)}
.btn:hover{filter:brightness(1.08);transform:translateY(-1px)}
.btn:disabled{opacity:.6;cursor:default;transform:none}
.btn.sm{padding:9px 14px;font-size:14px}
.btn.green{background:var(--green)} .btn.red{background:var(--red)} .btn.orange{background:var(--orange)} .btn.gray{background:#475569}
.btn.ghost{background:#fff;color:var(--navy);border:1.5px solid #94a3b8;box-shadow:none}
.btn.ghost:hover{background:#f1f5f9}
.btn.ghost.danger{color:var(--red);border-color:#fca5a5}
.btn.full{width:100%;justify-content:center;margin-top:18px;padding:13px}
.err{color:var(--red);font-size:13px;margin-top:10px;min-height:18px}

/* ---------- layout ---------- */
.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
aside{background:linear-gradient(180deg,var(--navy),var(--navy2));color:#fff;padding:22px 16px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:12px;padding:4px 8px 22px;border-bottom:1px solid rgba(255,255,255,.12);margin-bottom:16px}
.brand .mark{width:42px;height:42px}
.brand b{display:block;font-size:17px} .brand small{color:#94a3b8;font-size:12px}
nav button{width:100%;display:flex;align-items:center;gap:11px;padding:12px 12px;border:0;border-radius:10px;background:transparent;color:#cbd5e1;cursor:pointer;text-align:start;font-weight:500;font-size:15px;margin-bottom:4px;transition:.15s}
nav button:hover{background:rgba(255,255,255,.08);color:#fff}
nav button.on{background:rgba(255,255,255,.16);color:#fff;font-weight:700}
nav button .cnt{margin-inline-start:auto;background:var(--gold);color:#1a1a1a;border-radius:999px;font-size:11px;font-weight:800;padding:2px 8px;min-width:22px;text-align:center}
nav button .cnt.red{background:var(--red);color:#fff}
.me{margin-top:auto;padding-top:16px;border-top:1px solid rgba(255,255,255,.12);font-size:13px;color:#94a3b8}
.me .em{color:#fff;font-weight:600;word-break:break-all;display:block;margin-bottom:10px}
.me .btn{width:100%;justify-content:center;background:rgba(255,255,255,.12);box-shadow:none}
main{padding:22px 26px 60px;min-width:0}
.top{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.top h2{margin:0;font-size:26px;font-weight:800} .top p{margin:3px 0 0;color:var(--muted);font-size:14px;font-weight:500}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.search{position:relative;min-width:280px}
.search .ic{position:absolute;inset-inline-start:12px;top:13px;color:#64748b}
.search input{padding-inline-start:38px}
select.in{width:auto;padding:11px 34px 11px 12px;font-weight:600}

/* ---------- cards ---------- */
.card{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);margin-bottom:14px}
.chead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:#f1f5f9;border-bottom:1.5px solid var(--line2);margin:-18px -18px 14px;padding:12px 18px;border-radius:var(--r) var(--r) 0 0}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.g2{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(440px,1fr))}
.g2 .card{margin:0}
@media (max-width:980px){.g2{grid-template-columns:1fr}}
.stat{display:flex;gap:14px;align-items:center;cursor:pointer;transition:.15s}
.stat:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(15,23,42,.16)}
.stat .ico{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:22px;flex:none}
.stat .n{font-size:30px;font-weight:800;line-height:1}
.stat .l{color:var(--muted);font-size:13px;margin-top:4px;font-weight:600}
.bg-blue{background:var(--blue)} .bg-teal{background:var(--teal)} .bg-gold{background:var(--gold)} .bg-green{background:var(--green)} .bg-red{background:var(--red)} .bg-orange{background:var(--orange)} .bg-purple{background:var(--purple)}
.h3{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:800;margin:0 0 12px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 11px;border-radius:999px;font-size:13px;font-weight:700;border:1px solid transparent}
.p-green{background:#dcfce7;color:#166534;border-color:#86efac} .p-red{background:#fee2e2;color:#991b1b;border-color:#fca5a5} .p-orange{background:#ffedd5;color:#9a3412;border-color:#fdba74}
.p-gray{background:#f1f5f9;color:#1e293b;border-color:#cbd5e1} .p-blue{background:#dbeafe;color:#1e40af;border-color:#93c5fd} .p-purple{background:#ede9fe;color:#5b21b6;border-color:#c4b5fd}
.empty{text-align:center;color:var(--muted);padding:40px 10px;font-weight:600}
.empty .big{font-size:40px;margin-bottom:8px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.muted{color:var(--muted);font-size:13px;font-weight:500}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;padding-top:12px;border-top:1.5px solid var(--line2)}
.sep{height:1.5px;background:var(--line2);margin:12px 0}

/* switches */
.sw{display:flex;gap:16px;align-items:flex-start}
.toggle{position:relative;width:56px;height:32px;flex:none;margin-top:2px}
.toggle input{opacity:0;width:0;height:0}
.toggle span{position:absolute;inset:0;background:#94a3b8;border-radius:999px;cursor:pointer;transition:.2s}
.toggle span::before{content:'';position:absolute;width:26px;height:26px;top:3px;inset-inline-start:3px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.toggle input:checked+span{background:var(--green)}
.toggle input:checked+span::before{transform:translateX(-24px)}
.sw b{font-size:17px} .sw .muted{margin-top:6px;line-height:1.7;font-size:14px}

/* phones table */
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:13px;color:#1e293b;text-align:start;padding:10px 12px;border-bottom:2px solid var(--line);font-weight:700;background:#f1f5f9}
.tbl td{padding:13px 12px;border-bottom:1.5px solid var(--line2);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr:hover td{background:#f8fafc}
.num{font-weight:800;font-size:17px}
.editbox{background:#f1f5f9;border:1.5px dashed #94a3b8;border-radius:10px;padding:12px}
@media (max-width:860px){.tbl thead{display:none}.tbl td{display:block;border:0;padding:4px 0}.tbl tr{display:block;border-bottom:1.5px solid var(--line);padding:12px 0}}

/* reviews */
.rev{border-inline-start:6px solid var(--blue);padding-top:14px}
.rev.pend{border-inline-start-color:var(--orange)}
.stars{color:var(--gold);letter-spacing:1px;font-size:16px}
.score{display:inline-flex;align-items:center;justify-content:center;width:50px;height:50px;border-radius:13px;color:#fff;font-weight:800;font-size:19px;flex:none}
.rt{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.rt span{background:#f1f5f9;border:1px solid #cbd5e1;border-radius:8px;padding:5px 10px;font-size:13px;font-weight:600;color:#334155}
.rt span b{color:var(--navy);font-size:14px;margin-inline-start:4px}
.cmt{background:#fffbeb;border:1px solid #fde68a;border-inline-start:4px solid var(--gold);padding:9px 12px;border-radius:8px;margin-top:10px;white-space:pre-wrap}
audio{width:100%;margin:8px 0 2px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:700px){.cols{grid-template-columns:1fr}}
.meta{display:flex;flex-direction:column;gap:4px;align-items:flex-end;color:var(--muted);font-size:13px;font-weight:600;text-align:end}

/* toast */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:13px 22px;border-radius:12px;display:none;z-index:99;box-shadow:0 10px 30px rgba(0,0,0,.35);font-weight:700;align-items:center;gap:8px}
#toast.ok{background:var(--green)} #toast.bad{background:var(--red)}

/* v15: recordings */
.rbar{position:relative;height:28px;background:#e2e8f0;border-radius:999px;overflow:hidden;margin:4px 0 14px}
.rbar div{position:absolute;inset-block:0;inset-inline-start:0;background:var(--green)}
.rbar span{position:relative;display:block;text-align:center;line-height:28px;font-weight:800;font-size:13px}
.rtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.rtabs .cnt2{font-size:11px;opacity:.75;font-weight:600}
.clip{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px 0;border-bottom:1.5px solid var(--line2)}
.clip:last-child{border-bottom:0}
.clip.has{background:#f0fdf4;margin:0 -18px;padding:12px 18px}
.clip .yi{font-size:18px;font-weight:800;color:var(--navy)}
.clip .en{font-size:14px;color:#334155;direction:ltr;text-align:left}
.clip .txt{flex:1;min-width:240px}
.clip .btns{display:flex;gap:6px;flex-wrap:wrap}
.btn.rec{background:var(--red);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.6}}
input[type=range]{width:100%;accent-color:var(--blue)}
#tsBox{display:flex;justify-content:center;margin-top:16px;min-height:65px}

@media (max-width:900px){
  .app{grid-template-columns:1fr}
  aside{position:static;height:auto;padding:14px}
  .brand{padding-bottom:12px;margin-bottom:10px}
  nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
  nav button{width:auto;white-space:nowrap;margin:0}
  .me{display:none}
  main{padding:16px}
  .search{min-width:0;flex:1}
}
</style>
</head>
<body>
<div id="toast"></div>

<div id="loginView">
  <div class="loginCard">
    <div class="logo"><div class="mark"><svg class="ic" viewBox="0 0 24 24" style="width:26px;height:26px"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.79 19.79 0 0 1 2.12 4.18 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></svg></div>

    <input id="email" type="email" class="in ltr" autocomplete="username">

    <div id="tsBox"></div>

</div>

<div id="appView" class="app hidden">
  <aside>
    <div class="brand"><div class="mark"><svg class="ic" viewBox="0 0 24 24" style="width:22px;height:22px"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.79 19.79 0 0 1 2.12 4.18 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></svg></div>
      <div><b>CarReviews</b><small>טעלעפאן אדמין</small></div></div>
    <nav id="nav"></nav>
    <div class="me"><span class="em ltr" id="meEmail"></span><button class="btn sm" onclick="logout()">ארויסלאגין</button></div>
  </aside>
  <main>
    <div class="top">
      <div><h2 id="pageTitle"></h2><p id="pageSub"></p></div>
      <div class="tools" id="tools"></div>
    </div>
    <div id="content"></div>
  </main>
</div>

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate = d => { if(!d) return '—'; try{ return new Date(d).toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}); }catch(e){ return d; } };
const fmtPhone = p => { let d=String(p||'').replace(/\D/g,''); if(d.length===11&&d[0]==='1') d=d.slice(1); return d.length===10 ? d.slice(0,3)+'-'+d.slice(3,6)+'-'+d.slice(6) : String(p||''); };
const normPhone = p => { const d=String(p||'').replace(/\D/g,''); if(d.length===10) return '+1'+d; if(d.length===11&&d[0]==='1') return '+'+d; return d?'+'+d:''; };
const isToday = d => d && new Date(d).toDateString()===new Date().toDateString();
const STATUS = { new:['נייע','p-blue'], typed:['אפגעשריבן','p-purple'], published:['פובליצירט','p-green'], discarded:['אפגעווארפן','p-red'], approved:['באשטעטיגט','p-green'], rejected:['אפגעווארפן','p-red'] };
const TAGN = { polite:'העפלעך',clean:'ריין',fair_price:'ריכטיגער פרייז',safe:'זיכער',great_service:'גוטער סערוויס',rude:'גראב',dirty:'שמוציג',overcharged:'צו טייער',unsafe:'נישט זיכער',no_answer:'שווער צו דערגרייכן' };
function errMsg(e){
  const m=(e&&e.message)||'';
  if(m.includes('HAS_REVIEWS')) return 'מען קען נישט: דער נומער האט שוין רעוויוס. נוץ "בלאקירן".';
  if(m.includes('EXISTS')) return 'דער נומער איז שוין דא אין דער ליסטע';
  if(m.includes('not admin')) return 'נישט אדמין';
  return 'טעות: '+m;
}
let toastT;
function toast(m, bad){ const t=$('toast'); t.className=bad?'bad':'ok'; t.innerHTML=ic(bad?'x':'check')+' '+esc(m); t.style.display='flex'; clearTimeout(toastT); toastT=setTimeout(()=>t.style.display='none',3200); }

let companies=[];
let page='dash', phones=[], reviews=[], messages=[], settings={}, editIdx=null, q='', revF='all', msgF='', problems=[];

function togglePw(){
  const p=$('pass'); const show = p.type==='password';
  p.type = show ? 'text' : 'password';
  $('eyeBtn').innerHTML = ic(show ? 'eyeoff' : 'eye').replace('<svg class="ic"','<svg class="ic" style="width:22px;height:22px"');
}

/* ---------- auth ---------- */
async function login(){
  const email=$('email').value.trim(), pass=$('pass').value;
  $('loginMsg').textContent='';
  if(tsSite && !tsTok){ $('loginMsg').textContent='ביטע ווארט ביז דאס קעסטל ווערט ✅ גרין'; return; }
  const { error } = await sb.auth.signInWithPassword({ email, password: pass, options: { captchaToken: tsTok || undefined } });
  tsReset();
  if(error){ $('loginMsg').textContent='טעות: '+error.message; return; }
  init();
}
async function logout(){ await sb.auth.signOut(); location.reload(); }
async function init(){
  const { data:{ session } } = await sb.auth.getSession();
  if(!session){ show(false); return; }
  const { data, error } = await sb.rpc('is_admin');
  if(error || data!==true){ await sb.auth.signOut(); $('loginMsg').textContent='דער אקאונט איז נישט אדמין'; show(false); return; }
  $('meEmail').textContent = session.user.email;
  show(true);
  await loadAll();
  go('dash');
}
function show(ok){ $('loginView').classList.toggle('hidden',ok); $('appView').classList.toggle('hidden',!ok); }

/* ---------- data ---------- */
async function loadSettingsData(){ const {data,error}=await sb.rpc('admin_phone_settings'); if(error){toast(error.message,true);return;} settings=data||{}; }
async function loadPhonesData(){ const {data,error}=await sb.rpc('admin_phone_users_list'); if(error){toast(error.message,true);return;} phones=data||[]; }
async function loadReviewsData(){ const {data,error}=await sb.rpc('admin_phone_reviews_list'); if(error){toast(error.message,true);return;} reviews=data||[]; }
async function loadMessagesData(){ const {data,error}=await sb.from('voice_messages').select('*').order('created_at',{ascending:false}).limit(300); if(error){toast(error.message,true);return;} messages=data||[]; }
async function loadProblemsData(){ try{ const {data,error}=await sb.from('admin_messages').select('*').ilike('body','⚠ טעלעפאן%').order('created_at',{ascending:false}).limit(10); problems=error?[]:(data||[]); }catch(e){ problems=[]; } }
async function loadCompaniesData(){ const {data}=await sb.from('companies').select('id,name,phone_code').order('name'); companies=data||[]; }
async function loadAll(){ await Promise.all([loadSettingsData(),loadPhonesData(),loadReviewsData(),loadMessagesData(),loadCompaniesData(),loadProblemsData()]); renderNav(); }
async function refresh(){ await loadAll(); render(); toast('אפדעיטעד'); }

const pendRev = () => reviews.filter(r=>!r.approved).length;
const newMsg = () => messages.filter(m=>m.status==='new').length;
const waitPh = () => phones.filter(p=>!p.allowed&&!p.blocked).length;

/* ---------- nav ---------- */
const PAGES = [
  ['dash','dash','דאשבארד',()=>0],
  ['settings','sw','סוויטשעס',()=>0],
  ['phones','phone','טעלעפאן נומערן',waitPh],
  ['reviews','star','טעלעפאן רעוויוס',pendRev],
  ['messages','mic','הודעות',newMsg],
  ['recs','rec','הקלטות',()=>0],
];
function renderNav(){
  $('nav').innerHTML = PAGES.map(([k,i,l,c])=>{ const n=c(); return `<button class="${page===k?'on':''}" onclick="go('${k}')">${ic(i)} ${l}${n?`<span class="cnt ${k==='reviews'?'red':''}">${n}</span>`:''}</button>`; }).join('');
  document.title = (pendRev()+newMsg()+waitPh() ? `(${pendRev()+newMsg()+waitPh()}) ` : '') + 'CarReviews — טעלעפאן אדמין';
}
function go(p){ page=p; q=''; editIdx=null; renderNav(); render(); window.scrollTo({top:0}); }

/* ---------- render ---------- */
function head(t,s,tools){ $('pageTitle').textContent=t; $('pageSub').textContent=s; $('tools').innerHTML=tools||''; }
const searchBox = ph => `<div class="search">${ic('search')}<input class="in" placeholder="${esc(ph)}" value="${esc(q)}" oninput="q=this.value;renderList()"></div>`;
const refreshBtn = `<button class="btn ghost" onclick="refresh()">${ic('refresh')} אפדעיטן</button>`;
const empty = (t,e) => `<div class="card empty"><div class="big">${e||'🗂️'}</div>${esc(t)}</div>`;

function render(){
  if(page==='dash') return renderDash();
  if(page==='settings') return renderSettings();
  if(page==='phones') return renderPhones();
  if(page==='reviews') return renderReviews();
  if(page==='messages') return renderMessages();
  if(page==='recs') return renderRecs();
}
function renderList(){ if(page==='phones') $('listBox').innerHTML=phonesHtml(); if(page==='reviews') $('listBox').innerHTML=reviewsHtml(); if(page==='messages') $('listBox').innerHTML=messagesHtml(); }

/* dashboard */

  head('דאשבארד','איבערבליק פון דער טעלעפאן סיסטעם', refreshBtn);
  const callsToday = phones.filter(p=>isToday(p.last_call)).length;
  const stat=(n,l,c,p)=>`<div class="card stat" onclick="go('${p}')"><div class="ico ${c}">${ic(p==='phones'?'phone':p==='reviews'?'star':p==='messages'?'mic':'clock')}</div><div><div class="n">${n}</div><div class="l">${l}</div></div></div>`;
  const att = [];
  reviews.filter(r=>!r.approved).slice(0,5).forEach(r=>att.push(`<div class="row between"><div>${ic('star')} <b>${esc(r.company||'?')}</b> <span class="muted ltr">${esc(fmtPhone(r.phone))}</span></div><button class="btn sm green" onclick="setApproved('${r.id}',true)">${ic('check')} באשטעטיג</button></div>`));
  messages.filter(m=>m.status==='new').slice(0,5).forEach(m=>att.push(`<div class="row between"><div>${ic('mic')} נייע הודעה <span class="muted ltr">${esc(fmtPhone(m.from_number))}</span> · ${esc(m.duration_seconds||0)}s</div><button class="btn sm ghost" onclick="go('messages')">עפן</button></div>`));
  phones.filter(p=>!p.allowed&&!p.blocked).slice(0,5).forEach(p=>att.push(`<div class="row between"><div>${ic('phone')} נומער ווארט <b class="ltr">${esc(fmtPhone(p.phone))}</b></div><button class="btn sm green" onclick="setPhone('${esc(p.phone)}',true,false)">דערלויבן</button></div>`));
  const req = String(settings.phone_require_approval??'true')==='true', auto = String(settings.phone_reviews_auto_approve??'false')==='true';
  $('content').innerHTML = `
    <div class="grid">
      ${stat(phones.length,'טעלעפאן נומערן','bg-blue','phones')}
      ${stat(pendRev(),'רעוויוס ווארטן','bg-orange','reviews')}
      ${stat(newMsg(),'נייע הודעות','bg-purple','messages')}
      ${stat(callsToday,'רופן היינט','bg-teal','phones')}
      ${stat(reviews.length,'אלע טעלעפאן רעוויוס','bg-green','reviews')}
    </div>
    <div class="cols" style="margin-top:14px">
      <div class="card"><div class="h3">⚡ דארף אויפמערקזאמקייט</div>${att.length?att.join('<div class="sep"></div>'):'<div class="muted">אלעס איז ריין. קיין זאך ווארט נישט.</div>'}</div>
      <div class="card"><div class="h3">${ic('sw')} איצטיקע סוויטשעס</div>
        <div class="row between" style="margin-bottom:10px"><span>נאר דערלויבטע נומערן</span><span class="pill ${req?'p-green':'p-gray'}">${req?'אן':'אויס'}</span></div>
        <div class="row between"><span>רעוויוס גיין גלייך אויפן זייטל</span><span class="pill ${auto?'p-green':'p-gray'}">${auto?'אן':'אויס'}</span></div>
        <div class="sep"></div>
        <button class="btn ghost sm" onclick="go('settings')">${ic('edit')} ענדערן</button>
      </div>
    </div>
    ${problems.length?`<div class="card" style="border-color:#fca5a5"><div class="h3" style="color:var(--red)">⚠ טעלעפאן פראבלעמען (לעצטע ${problems.length})</div>
      ${problems.map(x=>`<div class="row between"><div>${esc(String(x.body||'').replace('⚠ טעלעפאן: ',''))}</div><span class="muted">${ic('clock')} ${esc(fmtDate(x.created_at))}</span></div>`).join('<div class="sep"></div>')}
    </div>`:''}`;

/* settings */
function renderSettings(){
  head('סוויטשעס','ביידע קענען זײַן אן אדער אויס, יעדער אליין', refreshBtn);
  const req = String(settings.phone_require_approval??'true')==='true', auto = String(settings.phone_reviews_auto_approve??'false')==='true';
  const sw=(id,key,on,title,a,b)=>`<div class="card"><div class="sw"><label class="toggle"><input type="checkbox" id="${id}" ${on?'checked':''} onchange="onSwitch('${key}',this)"><span></span></label>
    <div><b>${title}</b><div class="muted"><b>אן</b> = ${a}<br><b>אויס</b> = ${b}</div></div></div></div>`;
  $('content').innerHTML =
    sw('swRequire','phone_require_approval',req,'נאר נומערן וואס איך האב דערלויבט',
      'נאר נומערן וואס דו האסט דערלויבט קענען רעוויוען. אומבאקאנטע נומערן ווערן געשפייכערט אין דער ליסטע און הערן "נישט גילטיג".',
      'יעדער נייער נומער קען גלייך רעוויוען (עס ווערט אויטאמאטיש געמאכט אן אקאונט). בלאקירטע נומערן קענען אלעמאל נישט.') +
    sw('swAuto','phone_reviews_auto_approve',auto,'טעלעפאן רעוויוס גיין גלייך אויפן זייטל',
      'יעדער רעוויו פון טעלעפאן ווערט גלייך געוויזן אויפן זייטל.',
      'דער רעוויו בלייבט באהאלטן ביז דו באשטעטיגסט אים אין "טעלעפאן רעוויוס".');
}
async function onSwitch(key, el){
  const { error } = await sb.rpc('admin_set_setting',{ p_key:key, p_value: el.checked?'true':'false' });
  if(error){ toast(error.message,true); el.checked=!el.checked; return; }
  settings[key]=el.checked?'true':'false'; toast('געשפייכערט');
}

/* phones */
function renderPhones(){
  head('טעלעפאן נומערן',`${phones.length} נומערן · ${waitPh()} ווארטן · ${phones.filter(p=>p.blocked).length} בלאקירט`, searchBox('זוך נומער אדער נאמען...')+refreshBtn);
  $('content').innerHTML = `
    <div class="card"><div class="h3">${ic('plus')} צולייגן נומער</div>
      <div class="cols">
        <div><label class="f">טעלעפאן נומער</label><input id="newPhone" class="in ltr" placeholder="845-555-1234" onkeydown="if(event.key==='Enter')addPhone()"></div>
        <div><label class="f">נאמען (נאר פאר דיר)</label><input id="newName" class="in" onkeydown="if(event.key==='Enter')addPhone()"></div>
      </div>
      <div class="actions"><button class="btn green" onclick="addPhone()">${ic('check')} צולייגן און דערלויבן</button></div>
    </div>
    <div id="listBox">${phonesHtml()}</div>`;
}
function phonesHtml(){
  const s=q.trim().toLowerCase().replace(/[-\s()]/g,'');
  const list = phones.filter(p=>!s || String(p.phone||'').replace(/\D/g,'').includes(s.replace(/\D/g,'')) || (p.name||'').toLowerCase().includes(q.trim().toLowerCase()));
  if(!list.length) return empty('קיין נומערן נישט געפונען','📱');
  const rows = list.map(p=>{
    const idx = phones.indexOf(p);
    const st = p.blocked ? '<span class="pill p-red">בלאקירט</span>' : p.allowed ? '<span class="pill p-green">דערלויבט</span>' : '<span class="pill p-orange">ווארט</span>';
    const edit = editIdx===idx ? `<tr><td colspan="6"><div class="editbox"><div class="cols">
        <div><label class="f">נומער</label><input id="pp${idx}" class="in ltr" value="${esc(fmtPhone(p.phone))}"></div>
        <div><label class="f">נאמען</label><input id="pn${idx}" class="in" value="${esc(p.name||'')}"></div></div>
        <div class="actions"><button class="btn sm" onclick="editPhone(${idx})">${ic('save')} שפייכערן</button><button class="btn sm ghost" onclick="editIdx=null;renderList()">${ic('x')} אפשטעלן</button></div></div></td></tr>` : '';
    return `<tr>
      <td>${st}</td>
      <td><span class="num ltr">${esc(fmtPhone(p.phone))}</span></td>
      <td><b>${esc(p.name||'')||'<span class="muted">—</span>'}</b></td>
      <td><span class="pill p-gray">${p.n_reviews||0} רעוויוס</span></td>
      <td class="muted">${ic('clock')} ${esc(fmtDate(p.last_call))}</td>
      <td><div class="row" style="gap:6px;justify-content:flex-end">
        <button class="btn sm ghost" onclick="editIdx=${editIdx===idx?'null':idx};renderList()">${ic('edit')} ענדערן</button>
        ${p.allowed&&!p.blocked ? `<button class="btn sm orange" onclick="setPhone('${esc(p.phone)}',false,false)">נעם אוועק</button>` : `<button class="btn sm green" onclick="setPhone('${esc(p.phone)}',true,false)">${ic('check')} דערלויבן</button>`}
        ${p.blocked ? `<button class="btn sm gray" onclick="setPhone('${esc(p.phone)}',${!!p.allowed},false)">אנטבלאקירן</button>` : `<button class="btn sm red" onclick="setPhone('${esc(p.phone)}',false,true)">${ic('ban')} בלאקירן</button>`}
        <button class="btn sm ghost danger" onclick="delPhone('${esc(p.phone)}')">${ic('trash')}</button>
      </div></td></tr>${edit}`;
  }).join('');
  return `<div class="card" style="padding:0;overflow:hidden"><table class="tbl"><thead><tr><th>סטאטוס</th><th>נומער</th><th>נאמען</th><th>רעוויוס</th><th>לעצטער רוף</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`;
}
async function setPhone(phone, allowed, blocked){
  const p = phones.find(x=>x.phone===phone);
  const { error } = await sb.rpc('admin_phone_user_save',{ p_phone:phone, p_name:(p&&p.name)||'', p_allowed:allowed, p_blocked:blocked });
  if(error){ toast(errMsg(error),true); return; }
  toast('געשפייכערט'); await loadPhonesData(); renderNav(); render();
}
async function editPhone(idx){
  const p=phones[idx]; const newPhone=normPhone($('pp'+idx).value), name=$('pn'+idx).value.trim();
  if(newPhone.length<11){ toast('שרייב א פולן נומער (10 ציפערן)',true); return; }
  const { error } = await sb.rpc('admin_phone_user_update',{ p_old:p.phone, p_new:newPhone, p_name:name });
  if(error){ toast(errMsg(error),true); return; }
  editIdx=null; toast('געשפייכערט'); await loadPhonesData(); render();
}
async function delPhone(phone){
  if(!confirm('זיכער אויסמעקן דעם נומער '+fmtPhone(phone)+'?')) return;
  const { error } = await sb.rpc('admin_phone_user_delete',{ p_phone:phone });
  if(error){ toast(errMsg(error),true); return; }
  toast('אויסגעמעקט'); await loadPhonesData(); renderNav(); render();
}
async function addPhone(){
  const phone=normPhone($('newPhone').value), name=$('newName').value.trim();
  if(phone.length<11){ toast('שרייב א פולן נומער (10 ציפערן)',true); return; }
  const { error } = await sb.rpc('admin_phone_user_save',{ p_phone:phone, p_name:name, p_allowed:true, p_blocked:false });
  if(error){ toast(errMsg(error),true); return; }
  toast('צוגעלייגט'); await loadPhonesData(); renderNav(); render();
}

/* reviews */
let revPh='', msgPh='';
function phOpts(arr,cur){
  const m={}; arr.forEach(x=>{const p=fmtPhone(x); if(p) m[p]=(m[p]||0)+1;});
  return '<option value="">כל הנומערן</option>'+Object.keys(m).sort().map(p=>`<option value="${esc(p)}" ${cur===p?'selected':''}>${esc(p)} (${m[p]})</option>`).join('');
}
function renderReviews(){
  head('טעלעפאן רעוויוס',`${reviews.length} רעוויוס · ${pendRev()} ווארטן אויף באשטעטיגונג`,
    searchBox('זוך קאמפאני אדער נומער...')+`<select class="in" onchange="revPh=this.value;renderList()">${phOpts(reviews.map(r=>r.phone),revPh)}</select><select class="in" onchange="revF=this.value;renderList()">
      <option value="all" ${revF==='all'?'selected':''}>אלע</option><option value="pending" ${revF==='pending'?'selected':''}>ווארטן</option><option value="approved" ${revF==='approved'?'selected':''}>אויפן זייטל</option></select>`+refreshBtn);
  $('content').innerHTML = `<div id="listBox">${reviewsHtml()}</div>`;
}
function reviewsHtml(){
  const s=q.trim().toLowerCase();
  const list = reviews.filter(r => (!revPh||fmtPhone(r.phone)===revPh) && (revF==='all'||(revF==='pending'&&!r.approved)||(revF==='approved'&&r.approved)) &&
    (!s || (r.company||'').toLowerCase().includes(s) || String(r.phone||'').replace(/\D/g,'').includes(s.replace(/\D/g,'')||'§')));
  if(!list.length) return empty('קיין רעוויוס נישטא','⭐');
  return '<div class="g2">'+list.map(r=>{
    const vals=[r.punctuality,r.service,r.cleanliness,r.driving,r.driver_service].filter(v=>v!=null);
    const avg = vals.length ? vals.reduce((a,b)=>a+b,0)/vals.length : 0;
    const tone = avg>=4?'bg-green':avg>=3?'bg-gold':'bg-red';
    const stars = '★'.repeat(Math.round(avg))+'☆'.repeat(5-Math.round(avg));
    const rt=[['אנקום',r.punctuality],['סערוויס',r.service],['רייניקייט',r.cleanliness],['פארן',r.driving],['דרייווער',r.driver_service]].filter(x=>x[1]!=null).map(x=>`<span>${x[0]}<b>${x[1]}</b></span>`).join('');
    const ride=[r.trip_from&&r.trip_to?`${esc(r.trip_from)} → ${esc(r.trip_to)}`:'', r.price_paid!=null?'$'+esc(r.price_paid):'', esc(r.trip_date||'')].filter(Boolean).join(' · ');
    return `<div class="card rev ${r.approved?'':'pend'}">
      <div class="row between" style="align-items:flex-start">
        <div class="row" style="gap:12px">${avg?`<span class="score ${tone}">${avg.toFixed(1)}</span>`:''}<div><b style="font-size:18px">${esc(r.company||'?')}</b><div class="row" style="gap:6px;margin-top:4px">${avg?`<span class="stars">${stars}</span>`:''}${r.approved?'<span class="pill p-green">אויפן זייטל</span>':'<span class="pill p-orange">ווארט</span>'}</div></div></div>
        <div class="meta"><span>${ic('clock')} ${esc(fmtDate(r.created_at))}</span><span class="ltr">${ic('phone')} ${esc(fmtPhone(r.phone))||'?'}</span></div>
      </div>

        <button class="btn ghost danger" onclick="delReview('${r.id}')">${ic('trash')} מעק אויס</button>
      </div></div>`;
  }).join('')+'</div>';
}

async function saveMsg(id){
  const { error } = await sb.from('voice_messages').update({ reviewer_name:$('mn'+id).value, typed_text:$('mt'+id).value, admin_notes:$('mo'+id).value, status:$('ms'+id).value }).eq('id',id);

async function publishMsg(id){

async function delMsg(id,path){

  if(!confirm('זיכער אויסמעקן די הודעה?'+warn)) return;
  const { error } = await sb.from('voice_messages').delete().eq('id',id);

  if(path) await sb.storage.from('voice-messages').remove([path]);
  toast('אויסגעמעקט'); await loadMessagesData(); renderNav(); render();
}

/* ---------- v15: hotline recordings ---------- */
const CLIP_BUCKET='ivr-audio';
const RG={ main:'הויפט אנזאגן', piece:'שטיקלעך זאצן', words:'ווערטער', dates:'טעג און חדשים', numbers:'נומערן', areas:'געגנטן', places:'ערטער', companies:'נעמען פון קאמפאניס' };
let rFiles=null, rSet={}, rGrp='main', rFilter='missing', rRec=null, rUpKey=null;
async function loadRecs(){
  const m={};
  for(let off=0; off<10000; off+=1000){
    const { data, error } = await sb.storage.from(CLIP_BUCKET).list('',{ limit:1000, offset:off, sortBy:{ column:'name', order:'asc' } });
    if(error){ toast(error.message,true); break; }
    (data||[]).forEach(f=>{ const mm=/^(.+)\.(wav|mp3)$/i.exec(f.name); if(mm) m[mm[1]]=f.name; });
    if(!data || data.length<1000) break;
  }
  rFiles=m;
  const { data } = await sb.rpc('cr_get_settings');
  rSet={}; (data||[]).forEach(x=>rSet[x.key]=x.value);
}
function allClips(){
  const cos=companies.filter(c=>c.phone_code).sort((a,b)=>a.phone_code-b.phone_code)
    .map(c=>({ k:'co_'+c.phone_code, g:'companies', en:`company code ${c.phone_code}`, yi:c.name, note:'' }));
  return (typeof IVR_CLIPS!=='undefined' ? IVR_CLIPS : []).concat(cos);
}
async function renderRecs(){
  head('הקלטות','אידישע הקלטות פארן טעלעפאן', `<button class="btn ghost" onclick="rFiles=null;renderRecs()">${ic('refresh')} אפדעיטן</button>`);
  if(!rFiles){ $('content').innerHTML='<div class="card empty">…</div>'; await loadRecs(); if(page!=='recs') return; }
  const clips=allClips(), f=rFiles, done=clips.filter(c=>f[c.k]).length;
  const yiOn=rSet.ivr_yiddish!=='false', sp=parseInt(rSet.ivr_speed,10)||112;
  const gAll=g=>clips.filter(c=>c.g===g).length, gDone=g=>clips.filter(c=>c.g===g&&f[c.k]).length;
  const groups=[...new Set(clips.map(c=>c.g))];
  $('pageSub').textContent=`${done} פון ${clips.length} אויפגענומען`;
  $('content').innerHTML=`
    <div class="card"><div class="h3">${ic('sw')} איינשטעלונגען</div>
      <div class="sw" style="margin-bottom:14px"><label class="toggle"><input type="checkbox" id="rYi" ${yiOn?'checked':''}><span></span></label>
        <div><b>שפיל די אידישע הקלטות</b><div class="muted"><b>אן</b> = וואו עס איז דא הקלטות, הערט מען אידיש<br><b>אויס</b> = אלעס אויף ענגליש, ווי פריער</div></div></div>
      <label class="f">גיכקייט פונעם ענגלישן קול: <span id="rSpV">${sp}%</span> <span class="muted">(100% = נארמאל)</span></label>
      <input type="range" id="rSp" min="80" max="150" step="1" value="${sp}" oninput="$('rSpV').textContent=this.value+'%'">
      <label class="f">ראבאט-שוץ – Cloudflare Turnstile "Site Key"</label>
      <input id="rTs" class="in ltr" value="${esc(rSet.turnstile_site_key||'')}" placeholder="0x4AAAAAAA…">
      <div class="actions"><button class="btn green" onclick="saveRecSet()">${ic('save')} שפייכערן</button></div>
    </div>
    <div class="card">
      <div class="muted" style="margin-bottom:10px;line-height:1.7">דרוקט <b>"נעם אויף"</b>, רעדט, דרוקט <b>"שטעל אפ"</b> – עס ווערט גלייך געשפייכערט. ביז <b>אלע</b> הקלטות פון א זאץ זענען דא, זאגט דער טעלעפאן יענעם זאץ אויף ענגליש. ענדערונגען קומען אן צום טעלעפאן אין א מינוט ארום.</div>
      <div class="rbar"><div style="width:${clips.length?done/clips.length*100:0}%"></div><span>${done} / ${clips.length} אויפגענומען</span></div>
      <div class="rtabs">${groups.map(g=>`<button class="btn sm ${g===rGrp?'':'ghost'}" onclick="rGrp='${g}';renderRecs()">${esc(RG[g]||g)} <span class="cnt2">${gDone(g)}/${gAll(g)}</span></button>`).join('')}</div>
      <div class="rtabs"><button class="btn sm ${rFilter==='missing'?'':'ghost'}" onclick="rFilter='missing';renderRecs()">נאר וואס פעלט</button>
        <button class="btn sm ${rFilter==='all'?'':'ghost'}" onclick="rFilter='all';renderRecs()">אלע</button></div>
      <div id="rList">${recList(clips)}</div>
    </div>`;
}
function recList(clips){
  let list=clips.filter(c=>c.g===rGrp);
  if(rFilter==='missing') list=list.filter(c=>!rFiles[c.k]);
  if(!list.length) return '<div class="empty"><div class="big">✅</div>אלעס איז אויפגענומען</div>';
  return list.map(c=>{ const has=!!rFiles[c.k], on=rRec&&rRec.key===c.k; return `<div class="clip ${has?'has':''}">
    <div class="txt">${c.yi?`<div class="yi">${esc(c.yi)}</div>`:''}<div class="en">${esc(c.en)}</div>
      ${c.note?`<div class="muted">${esc(c.note)}</div>`:''}<div class="muted ltr">${esc(c.k)}.wav ${has?'✅':''}</div></div>
    <div class="btns">
      <button class="btn sm ${on?'rec':'orange'}" onclick="recToggle('${c.k}')">${ic(on?'stop':'rec')} ${on?'שטעל אפ':'נעם אויף'}</button>
      <button class="btn sm ghost" onclick="rUpKey='${c.k}';rFileIn.click()">${ic('upload')} פייל</button>
      ${has?`<button class="btn sm ghost" onclick="recPlay('${c.k}')">${ic('play')} הער</button>
      <button class="btn sm ghost danger" onclick="recDel('${c.k}')">${ic('trash')}</button>`:''}
    </div></div>`; }).join('');
}
async function saveRecSet(){
  const pairs=[['ivr_yiddish',$('rYi').checked?'true':'false'],['ivr_speed',$('rSp').value],['turnstile_site_key',$('rTs').value.trim()]];
  for(const [k,val] of pairs){
    const { error } = await sb.rpc('cr_set_setting',{ k, v:val });
    if(error){ toast(error.message,true); return; }
    rSet[k]=val;
  }
  toast('געשפייכערט');
}
const rFileIn=document.createElement('input'); rFileIn.type='file'; rFileIn.accept='audio/*'; rFileIn.className='hidden';
document.body.appendChild(rFileIn);
rFileIn.onchange=async()=>{ const f=rFileIn.files[0]; rFileIn.value=''; if(f&&rUpKey) await recSave(rUpKey,f); };
function recPlay(k){ new Audio(sb.storage.from(CLIP_BUCKET).getPublicUrl(rFiles[k]).data.publicUrl+'?t='+Date.now()).play(); }
async function recDel(k){
  if(!confirm('אויסמעקן די הקלטה?')) return;
  const { error } = await sb.storage.from(CLIP_BUCKET).remove([rFiles[k]]);
  if(error){ toast(error.message,true); return; }
  delete rFiles[k]; toast('אויסגעמעקט'); renderRecs();
}
async function recToggle(k){
  if(rRec){ const r=rRec; rRec=null; r.mr.stop(); r.stream.getTracks().forEach(t=>t.stop()); if(r.key!==k) renderRecs(); return; }
  let stream;
  try{ stream=await navigator.mediaDevices.getUserMedia({ audio:{ echoCancellation:true, noiseSuppression:true } }); }
  catch(e){ toast('דער מיקראפאן איז נישט צוטריטלעך',true); return; }
  const mr=new MediaRecorder(stream), chunks=[];
  mr.ondataavailable=e=>e.data.size&&chunks.push(e.data);
  mr.onstop=()=>recSave(k,new Blob(chunks,{ type:mr.mimeType||'audio/webm' }));
  mr.start(); rRec={ key:k, mr, stream }; renderRecs();
}
// any recording/file -> 8 kHz mono 16-bit WAV (what the phone plays); silence cut, volume evened
async function toWav(blob){
  const AC=window.AudioContext||window.webkitAudioContext, ac=new AC();
  const buf=await ac.decodeAudioData(await blob.arrayBuffer()); ac.close();
  const RATE=8000, len=Math.max(1,Math.ceil(buf.duration*RATE));
  const off=new OfflineAudioContext(1,len,RATE), src=off.createBufferSource();
  src.buffer=buf; src.connect(off.destination); src.start();
  let d=(await off.startRendering()).getChannelData(0);
  let peak=0; for(let i=0;i<d.length;i++) peak=Math.max(peak,Math.abs(d[i]));
  const th=Math.max(0.015,peak*0.05); let a=0, b=d.length-1;
  while(a<b && Math.abs(d[a])<th) a++;
  while(b>a && Math.abs(d[b])<th) b--;
  d=d.subarray(Math.max(0,a-(RATE*0.06|0)),Math.min(d.length,b+(RATE*0.12|0)));
  const gain=peak>0?Math.min(6,0.9/peak):1, dv=new DataView(new ArrayBuffer(44+d.length*2));
  const w=(o,s)=>{ for(let i=0;i<s.length;i++) dv.setUint8(o+i,s.charCodeAt(i)); };
  w(0,'RIFF'); dv.setUint32(4,36+d.length*2,true); w(8,'WAVE'); w(12,'fmt ');
  dv.setUint32(16,16,true); dv.setUint16(20,1,true); dv.setUint16(22,1,true);
  dv.setUint32(24,RATE,true); dv.setUint32(28,RATE*2,true); dv.setUint16(32,2,true); dv.setUint16(34,16,true);
  w(36,'data'); dv.setUint32(40,d.length*2,true);
  for(let i=0;i<d.length;i++) dv.setInt16(44+i*2,Math.max(-1,Math.min(1,d[i]*gain))*0x7fff,true);
  return new Blob([dv],{ type:'audio/wav' });
}
async function recSave(k,blob){
  toast('שפייכערט…');
  try{
    const wav=await toWav(blob), old=rFiles[k];
    if(old && old!==k+'.wav') await sb.storage.from(CLIP_BUCKET).remove([old]);
    const { error } = await sb.storage.from(CLIP_BUCKET).upload(k+'.wav',wav,{ contentType:'audio/wav', upsert:true });
    if(error) throw error;
    rFiles[k]=k+'.wav'; toast('געשפייכערט');
  }catch(e){ toast(e.message||String(e),true); }
  if(page==='recs') renderRecs();
}

document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&editIdx!==null){ editIdx=null; renderList(); } });
init();

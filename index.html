<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CarReviews</title>
  <link rel="icon" id="favicon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root { --navy:#0b1f3a; --navy2:#122c52; --blue:#2563eb; --teal:#0891b2; --gold:#f59e0b; --green:#16a34a; --red:#dc2626; --amber:#f59e0b; --purple:#7c3aed;
            --bg:#e6ebf3; --line:#b9c4d4; --line2:#dde3ec; --soft:#f1f5f9; --text:#0f172a; --muted:#475569;
            --shadow:0 4px 18px rgba(15,23,42,.12); --top:linear-gradient(90deg,#0b1f3a,#1e3a8a 55%,#0e7490); }
    * { box-sizing:border-box; }
    html { scroll-padding-top:84px; }
    body { font-family:Rubik,-apple-system,"Segoe UI",Arial,sans-serif; margin:0; padding:0 0 60px; color:var(--text); background:var(--bg); min-height:100vh; font-size:15px; }
    .wrap { max-width:1040px; margin:0 auto; padding:0 16px; }
    svg.ic { width:1.1em; height:1.1em; vertical-align:-0.15em; fill:none; stroke:currentColor; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; flex:none; }
    button svg, .chip svg { pointer-events:none; }

    .ltr, .contact span.em, #userbar .em, input[type=email], input[type=tel] { direction:ltr; unicode-bidi:plaintext; }
    input[type=email]::placeholder, input[type=tel]::placeholder { direction:rtl; }
    .em { unicode-bidi:isolate; direction:ltr; display:inline-block; }
    a.tel { color:var(--navy); font-weight:700; text-decoration:none; border-bottom:1px dotted var(--navy); }

    .topbar { position:sticky; top:0; z-index:60; background:var(--top); color:#fff; box-shadow:0 6px 20px rgba(11,31,58,.35); }
    .topbar .wrap { display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; padding-top:10px; padding-bottom:10px; }
    .tbrand { display:flex; align-items:center; gap:10px; font-weight:900; font-size:20px; letter-spacing:.2px; }
    .tbrand .mark { width:38px; height:38px; border-radius:11px; background:linear-gradient(135deg,var(--blue),var(--teal)); display:flex; align-items:center; justify-content:center; box-shadow:0 4px 10px rgba(0,0,0,.25); }
    .tbrand span b { color:#fbbf24; }
    .topbar select { background:#fff; color:var(--text); }
    #userbar { display:flex; align-items:center; gap:10px; flex-wrap:wrap; font-size:14px; }
    #userbar .em { font-weight:600; opacity:.95; }
    #langSel { width:auto; margin:0; padding:8px 10px; border:0; border-radius:9px; font-weight:600; }
    #calBtn { background:rgba(255,255,255,.14); border:1.5px solid rgba(255,255,255,.45); font-size:15px; padding:8px 14px; border-radius:10px; }
    #calBtn:hover { background:rgba(255,255,255,.24); }
    #logoutBtn { background:rgba(255,255,255,.14); border:1.5px solid rgba(255,255,255,.45); padding:7px 14px; }

    .hero { display:flex; justify-content:center; margin:14px auto 6px; }
    .logoCard { background:#fff; border-radius:18px; padding:6px 18px; box-shadow:var(--shadow); border:1.5px solid var(--line); border-top:5px solid var(--gold); width:100%; }
    .logoBox { max-width:380px; margin:0 auto; }
    .logoBox img { display:block; width:100%; height:auto; mix-blend-mode:multiply; }

    .card { background:#fff; border:1.5px solid var(--line); border-radius:16px; padding:18px; margin:14px 0; box-shadow:var(--shadow); }
    .card.co { border-inline-start:6px solid var(--navy); padding:14px 18px; margin:14px 0; }
    .box { max-width:430px; margin:10px auto 30px; }
    input, textarea, select { width:100%; padding:11px 13px; margin:6px 0; border:1.5px solid #94a3b8; border-radius:10px; font-family:inherit; font-size:15px; background:#fff; color:var(--text); }
    input:focus, textarea:focus, select:focus { outline:none; border-color:var(--blue); box-shadow:0 0 0 3px rgba(37,99,235,.18); }
    input[type=checkbox] { width:20px; height:20px; margin:0; padding:0; accent-color:var(--navy); flex:none; }
    textarea { resize:vertical; max-width:100%; min-height:70px; }
    select:required:invalid { color:#64748b; }
    select:required:invalid option { color:var(--text); }
    ::placeholder { color:#64748b; opacity:1; }
    .plabel { display:block; font-weight:700; font-size:13px; color:var(--navy); margin:0 0 2px; }
    .pwwrap { position:relative; }
    .pwwrap input { padding-inline-end:84px; }
    .pwwrap button { position:absolute; inset-inline-end:6px; top:12px; padding:5px 12px; font-size:12px; background:#e2e8f0; color:var(--navy); box-shadow:none; }

    .pricewrap { direction:ltr; display:flex; align-items:center; border:1.5px solid #94a3b8; border-radius:10px; background:#fff; margin:6px 0; padding-left:12px; }
    .pricewrap:focus-within { border-color:var(--blue); box-shadow:0 0 0 3px rgba(37,99,235,.18); }
    .pricewrap .dol { font-weight:800; color:var(--navy); font-size:18px; }
    .pricewrap input { border:0; margin:0; outline:none !important; background:transparent; box-shadow:none !important; }
    .rtcheck { display:flex; align-items:center; gap:10px; cursor:pointer; font-weight:700; color:var(--navy); margin-top:8px; padding:9px 12px; background:#fff; border:1.5px solid #94a3b8; border-radius:10px; }
    .rtbadge { background:#dbeafe; color:#1e40af; border:1px solid #93c5fd; border-radius:999px; padding:2px 10px; font-size:12px; font-weight:800; }

    button { padding:10px 17px; border:0; border-radius:10px; background:var(--navy); color:#fff; cursor:pointer; font-size:15px; font-weight:700; display:inline-flex; align-items:center; gap:7px; font-family:inherit; box-shadow:0 2px 6px rgba(15,23,42,.15); transition:.15s; }
    button:hover { filter:brightness(1.1); transform:translateY(-1px); }
    button:disabled { opacity:.6; cursor:default; transform:none; }
    button.link { background:none; color:var(--blue); text-decoration:underline; padding:4px; font-weight:600; box-shadow:none; }
    button.gold { background:var(--gold); color:#1a1a1a; }
    button.green { background:var(--green); }
    button.danger { background:var(--red); }
    button.ghost { background:#fff; color:var(--navy); border:1.5px solid #94a3b8; box-shadow:none; }
    button.ghost:hover { background:var(--soft); }
    button.small { padding:7px 13px; font-size:13px; margin-top:6px; }

    .msg { padding:10px 14px; border-radius:10px; margin:8px 0; display:none; font-weight:600; }
    .err { background:#fee2e2; color:#991b1b; border:1px solid #fca5a5; }
    .ok  { background:#dcfce7; color:#166534; border:1px solid #86efac; }
    .banner { background:#fee2e2; color:#991b1b; border:1.5px solid #fca5a5; border-radius:12px; padding:12px 16px; margin:12px 0; font-weight:700; }
    .note { background:#dbeafe; border:1.5px solid #93c5fd; color:#1e3a8a; border-radius:10px; padding:10px 14px; margin:8px 0; font-size:14px; font-weight:500; }
    .note.warn { background:#fef3c7; border-color:#fcd34d; color:#78350f; }
    .hidden { display:none !important; }
    .row { display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; }
    .toolbar { margin:14px 0 6px; }
    .toolbar .btns { display:flex; gap:8px; flex-wrap:wrap; }
    h2 { margin:10px 0; color:var(--navy); font-size:26px; font-weight:900; }
    h4 { margin:0 0 8px; color:var(--navy); font-size:16px; display:flex; align-items:center; gap:8px; font-weight:800; }
    .fileline { font-size:13px; color:var(--muted); margin:6px 0 2px; font-weight:600; }
    #ver { text-align:center; color:#64748b; font-size:12px; margin-top:28px; font-weight:600; }

    .filters { display:flex; gap:10px; margin:8px 0 4px; flex-wrap:wrap; }
    .filters .sw { position:relative; flex:2 1 260px; }
    .filters .sw svg { position:absolute; inset-inline-start:13px; top:20px; color:#64748b; }
    .filters .sw input { padding-inline-start:40px; margin:6px 0; }
    .filters select { flex:1 1 160px; font-weight:600; }

    /* ---------- company card ---------- */
    .chead { display:flex; justify-content:space-between; gap:12px; align-items:center; flex-wrap:wrap; }
    .cinfo { display:flex; align-items:center; gap:14px; min-width:0; flex:1 1 300px; }
    .clogo { width:60px; height:60px; object-fit:contain; border-radius:12px; border:1.5px solid var(--line2); background:#fff; flex:none; }
    .cname { font-weight:900; color:var(--navy); font-size:21px; line-height:1.25; }
    .codeBadge { display:inline-block; background:#0b1f3a; color:#fbbf24; border-radius:8px; padding:2px 10px; font-size:15px; font-weight:900; margin-inline-start:10px; vertical-align:middle; letter-spacing:1px; }
    .meta { color:var(--muted); font-size:14px; margin-top:3px; font-weight:500; }
    .contact { display:flex; flex-wrap:wrap; gap:8px 18px; color:var(--muted); font-size:14px; margin-top:6px; align-items:center; font-weight:500; }
    .contact span { display:inline-flex; align-items:center; gap:6px; }
    .score { display:flex; flex-direction:row; align-items:center; gap:10px; flex:0 0 auto; background:#fff; border:1.5px solid var(--line2); border-radius:14px; padding:6px 14px; box-shadow:0 2px 8px rgba(15,23,42,.08); }
    .score .big { font-size:28px; font-weight:900; line-height:1; }
    .score .cnt { font-size:12px; color:var(--muted); font-weight:600; }
    .score .scol { display:flex; flex-direction:column; align-items:flex-start; gap:1px; }
    .good { color:var(--green); } .mid { color:#b45309; } .bad { color:var(--red); }
    .bg-good { background:var(--green); } .bg-mid { background:var(--amber); } .bg-bad { background:var(--red); }
    .stars { color:var(--gold); letter-spacing:1px; font-size:16px; }
    .pill { display:inline-flex; align-items:center; gap:6px; padding:4px 11px; border-radius:999px; font-size:13px; font-weight:700; background:#dcfce7; color:#166534; border:1px solid #86efac; margin-top:4px; }
    .pill.low { background:#fee2e2; color:#991b1b; border-color:#fca5a5; }

    .callbtn { display:inline-flex; align-items:center; gap:7px; background:var(--green); color:#fff !important; text-decoration:none; font-weight:800; padding:9px 16px; border-radius:999px; direction:ltr; box-shadow:0 3px 8px rgba(22,163,74,.35); font-size:15px; }
    .callbtn:hover { filter:brightness(1.1); }
    .callbtn.sm { padding:4px 11px; font-size:12px; margin-inline-start:6px; }
    .urow.idle { background:#fef3c7; border-radius:10px; padding-inline:10px; }
    .ustat { display:inline-flex; align-items:center; gap:4px; font-size:12px; font-weight:700; background:#e2e8f0; color:var(--navy); border-radius:999px; padding:2px 10px; margin-inline-end:4px; }
    .ustat.warn { background:#fde68a; color:#78350f; }

    .tabs { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
    .tabs button { background:#fff; color:var(--c); border:2px solid var(--c); padding:10px 16px; box-shadow:none; font-size:15px; }
    .tabs button.on { background:var(--c); color:#fff; }
    .tabs button .n { background:rgba(0,0,0,.1); border-radius:10px; padding:1px 8px; font-size:12px; font-weight:800; }
    .tabs button.on .n { background:rgba(255,255,255,.3); }
    .tabs button[data-open] { --c:#1e3a8a; }
    .tabs button[data-prices] { --c:#0e7490; }
    .tabs button[data-comments] { --c:#6d28d9; }
    .tabs button[data-write] { --c:#15803d; }
    .more { display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; padding-top:8px; border-top:1.5px solid var(--line2); }
    .more button { font-size:15px; padding:9px 16px; background:#fff; color:var(--c); border:1.5px solid var(--c); box-shadow:none; }
    .more button[data-sendlogo] { --c:#be185d; }
    .more button[data-edco] { --c:#c2410c; }
    .more button.gold { background:var(--gold); color:#1a1a1a; border:0; }
    .more button.danger { background:var(--red); color:#fff; border:0; }

    .detail { margin-top:16px; border-top:2px solid var(--line2); padding-top:14px; }
    .dhead { display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:12px; }
    .dhead h4 { margin:0; font-size:18px; }
    .dhead button { margin:0; }
    .sect { background:var(--soft); border:1.5px solid var(--line2); border-radius:14px; padding:14px; margin:12px 0; }
    .sect.white { background:#fff; }
    .sect.ride { background:#eff6ff; border-color:#bfdbfe; }
    .sect.sug { background:#fef3c7; border:1.5px dashed var(--gold); }
    .cols { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
    @media (max-width:640px) { .cols { grid-template-columns:1fr; } }
    .detail .sect > .cols { grid-template-columns:1fr; gap:10px; }
    .detail .sect > .cols > div { background:#fff; border:1.5px solid var(--line2); border-radius:12px; padding:12px 14px; }
    .detail .sect.white > .cols { grid-template-columns:1fr 1fr; gap:14px; }
    .detail .sect.white > .cols > div { background:none; border:0; padding:0; }
    @media (max-width:640px) { .detail .sect.white > .cols { grid-template-columns:1fr; } }
    .grp { font-weight:800; color:var(--navy); font-size:13px; text-transform:uppercase; letter-spacing:.6px; margin:0 0 8px; display:flex; align-items:center; gap:8px; }
    .bar { display:grid; grid-template-columns:26px minmax(110px,170px) 1fr 52px; align-items:center; gap:10px; padding:8px 0; font-size:15px; font-weight:700; }
    .bar .track { height:14px; background:#cbd5e1; border-radius:8px; overflow:hidden; }
    .bar .fill { height:100%; border-radius:8px; }
    .bar .val { font-weight:900; font-size:17px; text-align:end; }
    .bar > span:first-child svg { width:1.3em; height:1.3em; }
    @media (max-width:640px) { .bar { grid-template-columns:24px 1fr 80px 40px; gap:6px; font-size:14px; } }

    .field { border:1.5px solid #cbd5e1; background:#fff; border-radius:12px; padding:12px 14px; margin:10px 0; }
    .optbox { border:2px dashed #94a3b8; border-radius:12px; padding:12px 14px; margin:12px 0; background:#fff; }

    .catrow { display:flex; justify-content:space-between; align-items:flex-end; padding:2px 0; gap:8px; font-size:14px; }
    .catrow .lbl { display:flex; align-items:center; gap:8px; font-weight:700; padding-bottom:4px; }
    .pick { direction:ltr; display:flex; }
    .pick .st { cursor:pointer; display:inline-flex; flex-direction:column; align-items:center; padding:0 3px; user-select:none; }
    .pick .st .sn { font-style:normal; font-size:13px; font-weight:800; color:#475569; line-height:1; margin-bottom:2px; }
    .pick .st .sg { font-size:30px; line-height:1; color:#cbd5e1; }
    .pick .st.on .sg { color:var(--gold); }
    .pick .st.on .sn { color:var(--navy); }
    .opt { font-size:12px; color:#64748b; font-weight:500; }
    .hintline { font-size:13px; color:#475569; margin:4px 0 0; font-weight:500; }

    .ptq { font-weight:800; font-size:15px; color:var(--navy); margin:2px 0 8px; display:flex; align-items:center; gap:8px; }
    .ptopts { display:grid; gap:8px; }
    .optcard { display:flex; align-items:center; justify-content:flex-start; gap:10px; width:100%; background:#fff; color:var(--text); border:2px solid #94a3b8; border-radius:12px; padding:12px 14px; font-weight:600; text-align:start; box-shadow:none; }
    .optcard::before { content:''; flex:none; width:18px; height:18px; border-radius:50%; border:2px solid #64748b; background:#fff; }
    .optcard:hover { border-color:var(--navy); background:#eff6ff; filter:none; transform:none; }
    .optcard.on { background:var(--navy); border-color:var(--navy); color:#fff; }
    .optcard.on::before { border-color:#fff; background:radial-gradient(circle,#fff 0 4px,var(--navy) 5px); }
    .optcard.yes.on { background:var(--green); border-color:var(--green); }
    .optcard.yes.on::before { background:radial-gradient(circle,#fff 0 4px,var(--green) 5px); }
    .optcard.no.on { background:var(--red); border-color:var(--red); }
    .optcard.no.on::before { background:radial-gradient(circle,#fff 0 4px,var(--red) 5px); }
    .recbtns { display:grid; grid-template-columns:1fr 1fr; gap:8px; }

    .chips { display:flex; flex-wrap:wrap; gap:8px; margin:6px 0; }
    .chip { padding:9px 15px; border-radius:14px; font-size:13px; background:#fff; border:2px solid #94a3b8; color:#334155; cursor:pointer; font-weight:700; display:inline-flex; align-items:center; gap:5px; }
    .chip.pos { border-color:var(--green); color:#15803d; }
    .chip.neg { border-color:var(--red); color:#b91c1c; }
    .chip.pos.on { background:var(--green); color:#fff; }
    .chip.neg.on { background:var(--red); color:#fff; }
    .chip.static { cursor:default; padding:4px 11px; border-width:1.5px; }
    .two { display:flex; gap:10px; flex-wrap:wrap; }
    .two > * { flex:1 1 150px; }
    .placebox { flex:1 1 150px; }
    .placebox select, .placebox input { margin-bottom:0; }
    .placebox input { margin-top:6px; }

    .datebtn { width:100%; justify-content:flex-start; background:#fff; color:#64748b; border:1.5px solid #94a3b8; padding:11px 13px; margin:6px 0 0; font-weight:500; font-size:15px; text-align:start; box-shadow:none; }
    .datebtn.has { color:var(--text); font-weight:700; }

    .rev { background:#fff; border:1.5px solid var(--line); border-radius:12px; padding:14px 16px; margin:10px 0; }
    .rev .rh { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
    .badge { color:#fff; font-weight:900; border-radius:9px; padding:5px 11px; font-size:16px; }
    .rev .mini { display:flex; flex-wrap:wrap; gap:6px 14px; font-size:13px; color:var(--muted); margin-top:8px; font-weight:500; }
    .rev .mini b { color:var(--text); }
    .rev .mini span { display:inline-flex; align-items:center; gap:5px; }
    .rev details { margin-top:8px; }
    .rev summary { cursor:pointer; font-size:13px; color:var(--blue); font-weight:600; }
    .cmt { background:#fffbeb; border:1px solid #fde68a; border-inline-start:4px solid var(--gold); padding:9px 12px; border-radius:8px; margin-top:10px; white-space:pre-wrap; word-break:break-word; }
    .yn { font-weight:800; font-size:13px; display:inline-flex; align-items:center; gap:4px; }
    .ridebox { background:#eff6ff; border:1.5px solid #bfdbfe; border-radius:10px; padding:9px 12px; margin-top:10px; font-size:14px; display:flex; flex-wrap:wrap; gap:6px 14px; align-items:center; font-weight:500; }
    .ridebox span { display:inline-flex; align-items:center; gap:6px; }
    .price { background:var(--navy); color:#fff; border-radius:8px; padding:3px 12px; font-weight:900; direction:ltr; white-space:nowrap; }
    .showmore { text-align:center; margin-top:12px; }
    .flag { background:#fef3c7; color:#78350f; border:1px solid #fcd34d; border-radius:6px; padding:2px 9px; font-size:12px; font-weight:800; display:inline-block; margin:2px 0; }

    .rtgrid { display:grid; grid-template-columns:repeat(auto-fill, minmax(220px, 1fr)); gap:12px; margin-bottom:6px; }
    .rt { background:#fff; border:1.5px solid #bfdbfe; border-radius:14px; padding:14px; }
    .rt-route { font-weight:800; color:var(--navy); font-size:14px; display:flex; align-items:center; gap:6px; }
    .rt-price { font-size:30px; font-weight:900; color:#0e7490; margin-top:4px; margin-bottom:10px; direction:ltr; }
    .rt-sub { font-size:12px; color:var(--muted); margin-top:2px; font-weight:600; }
    .prow { display:flex; justify-content:space-between; align-items:center; gap:10px; padding:10px 0; border-bottom:1.5px solid var(--line2); font-size:14px; }
    .prow:last-child { border-bottom:0; }
    .pr-route { font-weight:700; color:var(--text); }
    .pr-meta { font-size:12px; color:var(--muted); margin-top:2px; font-weight:500; }

    .author { background:#fef3c7; border:1.5px dashed var(--gold); border-radius:10px; padding:8px 12px; margin-top:10px; font-size:13px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-weight:500; }
    .tagban { background:var(--red); color:#fff; border-radius:6px; padding:2px 9px; font-size:12px; font-weight:800; }
    .sugrow { display:flex; align-items:center; gap:12px; padding:8px 0; border-bottom:1px solid #fcd34d; flex-wrap:wrap; }
    .sugrow:last-child { border-bottom:0; }
    .sugrow img { width:90px; height:56px; object-fit:contain; background:#fff; border:1px solid var(--line2); border-radius:8px; }
    .sugrow .sbtns { display:flex; gap:6px; margin-inline-start:auto; }

    .reqitem { padding:12px 0; border-bottom:1.5px solid #fcd34d; }
    .reqitem:last-child { border-bottom:0; }
    .reqitem .kv { display:flex; flex-wrap:wrap; gap:4px 14px; font-size:14px; margin:6px 0; }
    .reqitem .old { color:#64748b; text-decoration:line-through; }
    .tagkind { background:var(--navy); color:#fff; border-radius:6px; padding:2px 9px; font-size:12px; font-weight:800; }
    .prof { display:flex; flex-wrap:wrap; gap:4px 16px; font-size:14px; margin:6px 0; align-items:center; }
    .prof span { display:inline-flex; align-items:center; gap:6px; }

    const hf = (d, o) => { try { return new Intl.DateTimeFormat('he-u-ca-hebrew', o).format(d); } catch (e) { return ''; } };
    const hDay = d => {
      try { return Number(new Intl.DateTimeFormat('en-u-ca-hebrew', { day: 'numeric' }).formatToParts(d).find(x => x.type === 'day').value); }
      catch (e) { return 1; }
    };
    const hYearNum = d => {
      try {
        const p = new Intl.DateTimeFormat('en-u-ca-hebrew', { year: 'numeric' }).formatToParts(d)
          .find(x => x.type === 'year' || x.type === 'relatedYear');
        if (p) return Number(String(p.value).replace(/\D/g, ''));
      } catch (e) {}
      return Number((hf(d, { year: 'numeric' }).match(/\d+/) || [5787])[0]);
    };
    function gem(n) {
      const hund = [[400,'ת'],[300,'ש'],[200,'ר'],[100,'ק']];
      const tens = [[90,'צ'],[80,'פ'],[70,'ע'],[60,'ס'],[50,'נ'],[40,'מ'],[30,'ל'],[20,'כ'],[10,'י']];
      const ones = ['','א','ב','ג','ד','ה','ו','ז','ח','ט'];
      let s = '';
      for (const [v, l] of hund) { while (n >= v) { s += l; n -= v; } }
      if (n === 15) { s += 'טו'; n = 0; }
      else if (n === 16) { s += 'טז'; n = 0; }
      for (const [v, l] of tens) { if (n >= v) { s += l; n -= v; } }
      s += ones[n];
      if (!s) return '';
      return s.length === 1 ? s + '׳' : s.slice(0, -1) + '״' + s.slice(-1);
    }
    const gemYear = d => gem(hYearNum(d) % 1000);

    const MONTHS = [
      ['אדר א','adar1','אדר ראשון'], ['אדר ב','adar2','אדר שני'], ['תשרי','tishri','תשרי'],
      ['חשו','cheshvan','חשוון'], ['מרחשו','cheshvan','חשוון'], ['כסלו','kislev','כסלו'], ['טבת','tevet','טבת'],
      ['שבט','shvat','שבט'], ['אדר','adar','אדר'], ['ניסן','nisan','ניסן'], ['אייר','iyar','אייר'],
      ['סיו','sivan','סיוון'], ['תמוז','tamuz','תמוז'], ['אב','av','מנחם אב'], ['אלול','elul','אלול']
    ];
    function monthInfo(d) {
      const n = hf(d, { month: 'long' }).replace(/[׳״'"]/g, '').trim();
      for (const [pre, key, name] of MONTHS) if (n.startsWith(pre)) return { key, name };
      return { key: n, name: n };
    }
    const hMonth = d => hf(d, { month: 'long', year: 'numeric' });

    const WD_YI = ['זונטאג','מאנטאג','דינסטאג','מיטוואך','דאנערשטאג','פרייטאג','שבת קודש'];
    const WD_HE = ['יום ראשון','יום שני','יום שלישי','יום רביעי','יום חמישי','יום שישי','שבת קודש'];
    const wdName = d => (lang === 'yi' ? WD_YI : WD_HE)[d.getDay()];
    const WD_HDR = () => lang === 'yi' ? WD_YI : ['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];

    const hebStr = d => `${wdName(d)}, ${gem(hDay(d))} ${monthInfo(d).name} ${gemYear(d)}`;
    const hebFromStr = s => s ? hebStr(new Date(s + 'T12:00:00')) : '';
    const noon = d => { const x = new Date(d); x.setHours(12, 0, 0, 0); return x; };
    const isoOf = x => x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0') + '-' + String(x.getDate()).padStart(2, '0');
    const dateLabel = iso => {
      const dt = new Date(iso + 'T12:00:00');
      return hebStr(dt) + ' · ' + dt.toLocaleDateString(dl(), { day: 'numeric', month: 'short', year: 'numeric' });
    };

    function dayMark(x) {
      const hd = hDay(x), key = monthInfo(x).key, dow = x.getDay();
      let hol = '';
      switch (key) {
        case 'tishri':
          if (hd <= 2) hol = 'ר״ה';
          else if ((hd === 3 && dow !== 6) || (hd === 4 && dow === 0)) hol = 'צום';
          else if (hd === 10) hol = 'יוה״כ';
          else if (hd === 15 || hd === 16) hol = 'סוכות';
          else if (hd >= 17 && hd <= 20) hol = 'חוה״מ';
          else if (hd === 21) hol = 'הו״ר';
          else if (hd === 22) hol = 'שמ״ע';
          else if (hd === 23) hol = 'שמח״ת';
          break;
        case 'kislev': if (hd >= 25) hol = 'חנוכה'; break;
        case 'tevet':
          if (hd <= 2) hol = 'חנוכה';
          else if (hd === 3) { const p = new Date(x); p.setDate(p.getDate() - 3); if (hDay(p) === 29) hol = 'חנוכה'; }
          else if (hd === 10) hol = 'צום';
          break;
        case 'shvat': if (hd === 15) hol = 'ט״ו'; break;
        case 'adar': case 'adar2':
          if ((hd === 13 && dow !== 6) || (hd === 11 && dow === 4)) hol = 'תענית';
          else if (hd === 14) hol = 'פורים';
          else if (hd === 15) hol = 'שושן';
          break;
        case 'nisan':
          if (hd === 15 || hd === 16) hol = 'פסח';
          else if (hd >= 17 && hd <= 20) hol = 'חוה״מ';
          else if (hd === 21) hol = 'שביעי';
          else if (hd === 22) hol = 'אחרון';
          break;
        case 'iyar': if (hd === 18) hol = 'ל״ג'; break;
        case 'sivan': if (hd === 6 || hd === 7) hol = 'שבועות'; break;
        case 'tamuz': if ((hd === 17 && dow !== 6) || (hd === 18 && dow === 0)) hol = 'צום'; break;
        case 'av': if ((hd === 9 && dow !== 6) || (hd === 10 && dow === 0)) hol = 'ת״ב'; break;
      }
      const rc = (hd === 30 || (hd === 1 && key !== 'tishri')) ? 'ר״ח' : '';
      return [rc, hol].filter(Boolean).join(' ');
    }

    let calAnchor = noon(new Date()), calFirst = null, calLast = null;
    let pickMode = false;

    function renderCal() {
      const a = noon(calAnchor);
      const first = new Date(a); first.setDate(a.getDate() - (hDay(a) - 1));
      const label = hMonth(first);
      const days = [];
      const d = new Date(first);
      while (hMonth(d) === label && days.length < 31) { days.push(new Date(d)); d.setDate(d.getDate() + 1); }
      calFirst = first; calLast = days[days.length - 1];
      const now = new Date();
      const todayStr = now.toDateString();
      const selIso = pickMode && $('revDate') ? $('revDate').value : '';

      let html = WD_HDR().map((w, i) => `<div class="cw ${i === 6 ? 'sat' : ''}">${w}</div>`).join('');
      for (let i = 0; i < first.getDay(); i++) html += '<div class="cd blank"></div>';
      days.forEach((x, idx) => {
        const iso = isoOf(x);
        const future = x > now && x.toDateString() !== todayStr;
        const mk = dayMark(x);
        const g = (idx === 0 || x.getDate() === 1)
          ? x.getDate() + ' ' + x.toLocaleDateString(dl(), { month: 'short' })
          : String(x.getDate());
        html += `<div class="cd ${x.getDay() === 6 ? 'sat' : ''} ${x.toDateString() === todayStr ? 'today' : ''} ${iso === selIso ? 'sel' : ''} ${pickMode && future ? 'fut' : ''}" ${pickMode && !future ? `data-day="${iso}"` : ''}>
          <b>${esc(gem(hDay(x)))}</b><small>${esc(g)}</small>${mk ? `<i class="hl">${esc(mk)}</i>` : ''}</div>`;
      });
      $('calBody').innerHTML = `<div class="calGrid">${html}</div>`;
      $('calTitle').textContent = monthInfo(first).name + ' ' + gemYear(first);
      const o = { month: 'short', year: 'numeric' };
      $('calSub').textContent = calFirst.toLocaleDateString(dl(), o) + ' – ' + calLast.toLocaleDateString(dl(), o);
      $('calHint').textContent = t_('calPick');
      $('calHint').classList.toggle('hidden', !pickMode);
      $('calTodayBtn').textContent = pickMode ? t_('calPickToday') : t_('calToday');
    }

    async function uploadLogo(file) {
      if (!file) return null;
      if (file.size > 2 * 1024 * 1024) throw new Error(t_('logoTooBig'));
      const ext = (file.name.split('.').pop() || 'png').toLowerCase().replace(/[^a-z0-9]/g, '');
      const path = Date.now() + '-' + Math.random().toString(36).slice(2, 8) + '.' + ext;
      const { error } = await sb.storage.from('logos').upload(path, file, { contentType: file.type });
      if (error) throw error;
      return sb.storage.from('logos').getPublicUrl(path).data.publicUrl;
    }

        sb.from('reviews').select('id,user_id,company_id,created_at,punctuality,service,cleanliness,driving,recommend,comment')
      ]);
      if (!p.error && p.data) pendRevs = p.data;
      if (!a.error && a.data) adminRevs = a.data;
      computeFlags();

    function computeFlags() {
      flagMap = {};
      const add = (id, k) => { (flagMap[id] = flagMap[id] || []).push(k); };
      const byUser = {}, byComp = {}, byText = {};
      adminRevs.forEach(r => {
        (byUser[r.user_id] = byUser[r.user_id] || []).push(r);
        (byComp[r.company_id] = byComp[r.company_id] || []).push(r);
        const tx = (r.comment || '').trim().toLowerCase();
        if (tx.length >= 15) (byText[tx] = byText[tx] || []).push(r);
      });
      const H = 3600 * 1000;
      adminRevs.forEach(r => {
        const t0 = new Date(r.created_at).getTime();
        if ([r.punctuality, r.service, r.cleanliness, r.driving].every(v => v === 5) && r.recommend === true) add(r.id, 'perfect');
        if (byUser[r.user_id].filter(x => Math.abs(new Date(x.created_at).getTime() - t0) <= 24 * H).length >= 3) add(r.id, 'burst');
        if (byComp[r.company_id].filter(x => Math.abs(new Date(x.created_at).getTime() - t0) <= 48 * H).length >= 4) add(r.id, 'cluster');
        const tx = (r.comment || '').trim().toLowerCase();
        if (tx.length >= 15 && byText[tx].length > 1) add(r.id, 'dupe');
      });
    }
    const flagHtml = id => (flagMap[id] || []).map(k => `<span class="flag">⚠ ${esc(t_('sig_' + k))}</span>`).join(' ');

        return `<div class="field" data-field="punctuality">

          <div class="ptopts">${PUNCT.map(([v, key]) =>
            `<button type="button" class="ptbtn optcard ${draft.punctuality === v ? 'on' : ''}" data-punct="${v}">${esc(t_(key))}</button>`).join('')}</div>
        </div>`;
      }
      return `<div class="field" data-field="${k}"><div class="catrow"><span class="lbl">${ic(KEY_ICON[k])} ${esc(t_(k))}</span>
        <span class="pick" data-cat="${k}">${[1,2,3,4,5].map(v =>
          `<span class="st ${draft[k] >= v ? 'on' : ''}" data-v="${v}"><i class="sn">${v}</i><span class="sg">★</span></span>`).join('')}</span>
      </div></div>`;
    }

    function syncDraft() {
      if (openMode !== 'write' || !$('revDate') || !$('revFrom')) return;
      draft.trip_date = $('revDate').value;
      draft.tod = $('revTod').value;
      draft.from = readPlace('revFrom') || '';
      draft.to = readPlace('revTo') || '';
      draft.price = $('revPrice').value;
      draft.round = $('revRound') ? $('revRound').checked : false;
      draft.toll = $('revToll') ? $('revToll').checked : false;
      draft.free = $('revFree') ? $('revFree').checked : false;
      draft.hour = $('revHour') ? $('revHour').value : '';
      draft.comment = $('revComment').value;
    }
    function hasAnyAnswer() {
      if (ALL_KEYS.some(k => draft[k])) return true;
      if (draft.rec === true || draft.rec === false) return true;
      if (draft.trip_date || draft.tod || draft.from || draft.to) return true;
      if (String(draft.price || '').trim() !== '') return true;
      if ((draft.tags || []).length) return true;
      if (String(draft.comment || '').trim() !== '') return true;
      return false;
    }

    async function loadDetail(companyId) {
      const el = $('detail');
      if (!el) return;
      el.innerHTML = esc(t_('loading'));
      const { data, error } = await sb.from('reviews').select('*').eq('company_id', companyId).order('created_at', { ascending: false });
      if (error) { el.innerHTML = esc(t_('error')) + ': ' + esc(error.message); return; }
      detailData = data;

      const mine = data.find(r => r.user_id === myUid);
      myReviewId = mine ? mine.id : null;
      if (!Object.keys(draft).length && mine) {
        ALL_KEYS.forEach(k => draft[k] = mine[k]);
        draft.punctuality = normP(mine.punctuality);
        draft.comment = mine.comment || '';
        draft.rec = mine.recommend;
        draft.tags = Array.isArray(mine.tags) ? mine.tags.filter(k => POS_TAGS.includes(k) || NEG_TAGS.includes(k)) : [];
        draft.trip_date = mine.trip_date || '';
        draft.tod = mine.time_of_day || '';
        draft.from = mine.trip_from || '';
        draft.to = mine.trip_to || '';
        draft.round = !!mine.round_trip;
        draft.toll = !!mine.toll_included;
        draft.free = !!mine.first_hour_free;
        draft.hour = (mine.hourly_price !== null && mine.hourly_price !== undefined) ? String(mine.hourly_price) : '';
        draft.price = (mine.price_paid !== null && mine.price_paid !== undefined) ? String(mine.price_paid) : '';
      }
      paintDetail();
    }

    function paintDetail() {
      const el = $('detail');
      if (!el || !openId) return;
      const companyId = openId;
      const data = detailData;
      const pub = data.filter(r => r.approved !== false);
      const mine = data.find(r => r.user_id === myUid);

      const head = title => `<div class="dhead"><h4>${title}</h4><button class="ghost small" data-close="${companyId}">${ic('x')} ${esc(t_('close'))}</button></div>`;

      if (openMode === 'write') {
        if (isBanned) { el.innerHTML = head(esc(t_('writeReview'))) + `<div class="banner">${esc(t_('bannedMsg'))}</div>`; return; }
        if (writeLangBlocked()) { el.innerHTML = head('') + `<div class="banner">${esc(T.en.langBlock)}</div>`; return; }
        langAlertIfNeeded();

        if (!isAdmin && !canReview) {
          el.innerHTML = head(esc(t_('writeReview'))) + `
            <div class="sect white">
              <div class="note warn"><b>${esc(t_('needPermTitle'))}</b><br>${esc(t_('needPermText'))}</div>
              ${myReqPending
                ? `<div class="note">${esc(t_('reqPermWaiting'))}</div>`
                : `<button type="button" data-reqperm="1">${ic('check')} ${esc(t_('reqPermBtn'))}</button>`}
            </div>`;
          return;
        }

        const dTags = draft.tags || [];

        const form = `<div class="cols">${GROUPS.map(([g, gi, keys]) => `
          <div><div class="grp">${ic(gi)} ${esc(t_(g))}</div>
          ${keys.map(k => catRowHtml(k)).join('')}</div>`).join('')}</div>`;

        const recForm = `
          <div class="field" data-field="rec">
            <h4>${esc(t_('recommendQ'))}</h4>
            <div class="recbtns">
              <button type="button" class="recbtn optcard yes ${draft.rec === true ? 'on' : ''}" data-rec="1">${ic('up')} ${esc(t_('yes'))}</button>
              <button type="button" class="recbtn optcard no ${draft.rec === false ? 'on' : ''}" data-rec="0">${ic('down')} ${esc(t_('no'))}</button>
            </div>
          </div>`;

        const rideForm = `
          <div class="sect ride">
            <h4>${ic('car')} ${esc(t_('rideTitle'))}</h4>
            <div class="two">
              <div class="field" data-field="date">
                <span class="plabel">${esc(t_('f_date'))}</span>
                <input id="revDate" type="hidden" value="${esc(draft.trip_date || '')}">
                <button type="button" class="datebtn ${draft.trip_date ? 'has' : ''}" data-pickdate="1">${ic('cal')} <span id="revDateTxt">${draft.trip_date ? esc(dateLabel(draft.trip_date)) : esc(t_('pickDate'))}</span></button>
              </div>
              <div class="field" data-field="tod">
                <label class="plabel" for="revTod">${esc(t_('todPh'))}</label>
                <select id="revTod" required>
                  <option value="" disabled hidden ${draft.tod ? '' : 'selected'}>${esc(t_('pickTod'))}</option>
                  ${TODS.map(k => `<option value="${k}" ${draft.tod === k ? 'selected' : ''}>${esc(t_('tod_' + k))}</option>`).join('')}
                </select>
              </div>
            </div>
            <div class="two">
              <div class="field" data-field="from">${placeSelect('revFrom', draft.from || '', t_('fromPh'))}</div>
              <div class="field" data-field="to">${placeSelect('revTo', draft.to || '', t_('toPh'))}</div>
            </div>
            <div class="field" data-field="price">
              <label class="plabel" for="revPrice">${esc(t_('pricePh'))}</label>
              <div class="pricewrap"><span class="dol">$</span><input id="revPrice" type="number" inputmode="decimal" min="0" step="0.01" placeholder="0.00" value="${esc(draft.price || '')}"></div>
              <label class="rtcheck"><input type="checkbox" id="revToll" ${draft.toll ? 'checked' : ''}> <span>${esc(t_('tollIncl'))}</span></label>
              <label class="rtcheck"><input type="checkbox" id="revRound" ${draft.round ? 'checked' : ''}> <span>${esc(t_('roundTrip'))}</span></label>
              <div id="rtExtra" class="${draft.round ? '' : 'hidden'}">
                <label class="rtcheck"><input type="checkbox" id="revFree" ${draft.free ? 'checked' : ''}> <span>${esc(t_('firstHourFree'))}</span></label>
                <label class="plabel" for="revHour" style="margin-top:8px">${esc(t_('hourlyPrice'))}</label>
                <div class="pricewrap"><span class="dol">$</span><input id="revHour" type="number" inputmode="decimal" min="0" step="0.01" placeholder="0.00" value="${esc(draft.hour || '')}"></div>
              </div>
            </div>
          </div>`;

        const tagForm = `
          <div class="optbox">
            <h4>${esc(t_('tagsTitle'))} <span class="opt">(${esc(t_('optional'))})</span></h4>
            <div class="chips">
              ${POS_TAGS.map(k => `<button type="button" class="chip pos ${dTags.includes(k) ? 'on' : ''}" data-tag="${k}">${esc(t_('tag_' + k))}</button>`).join('')}
            </div>
            <div class="chips">
              ${NEG_TAGS.map(k => `<button type="button" class="chip neg ${dTags.includes(k) ? 'on' : ''}" data-tag="${k}">${esc(t_('tag_' + k))}</button>`).join('')}
            </div>
            <textarea id="revComment" rows="3" placeholder="${esc(t_('otherIssue'))} (${esc(t_('optional'))})">${esc(draft.comment || '')}</textarea>
          </div>`;

        el.innerHTML = head(`${esc(mine ? t_('editReview') : t_('writeReview'))} <span class="opt">${esc(t_('anonymous'))}</span>`) + `
          <div class="sect white">
            <div class="note">${esc(t_('optNote'))}</div>
            <div class="hintline">${esc(t_('starsHint'))}</div>
            <div id="revMsg" class="msg"></div>
            ${form}
            ${recForm}
            ${rideForm}
            ${tagForm}
            <button id="submitReview" data-company="${companyId}">${ic('check')} ${esc(mine ? t_('update') : t_('submit'))}</button>
            ${mine ? `<button id="deleteReview" class="danger" data-company="${companyId}">${esc(t_('delMine'))}</button>` : ''}
          </div>`;
        return;
      }

      if (openMode === 'prices') {
        const priced = pub.filter(hasPrice);
        if (!priced.length) {
          el.innerHTML = head(`${ic('dollar')} ${esc(t_('pricesTitle'))}`) + `<p class="meta">${esc(t_('noPrices'))}</p>`;
          return;
        }
        const groups = {};
        priced.forEach(r => { const k = r.trip_from + '|' + r.trip_to; (groups[k] = groups[k] || []).push(r); });
        const gl = Object.values(groups).sort((a, b) => b.length - a.length);
        const cards = gl.map(arr => {
          const ps = arr.map(r => Number(r.price_paid));
          const avg = ps.reduce((a, b) => a + b, 0) / ps.length;
          const mn = Math.min(...ps), mx = Math.max(...ps);
          return `<div class="rt">
            <div class="rt-route">${ic('pin')} ${esc(routeName(arr[0]))}</div>
            <div class="rt-price">${esc(money(Math.round(avg)))}</div>
            <div class="rt-sub">${arr.length > 1 ? `${esc(t_('avg'))} · ${esc(money(mn))}–${esc(money(mx))} · ` : ''}${arr.length} ${esc(t_('reportsWord'))}</div>
          </div>`;
        }).join('');
        const rows = priced.slice(0, showN).map(r => {
          const bits = [];
          bits.push(r.trip_date ? new Date(r.trip_date + 'T12:00:00').toLocaleDateString(dl()) : new Date(r.created_at).toLocaleDateString(dl()));
          if (r.time_of_day && TODS.includes(r.time_of_day)) bits.push(t_('tod_' + r.time_of_day));
          return `<div class="prow">
            <div><div class="pr-route">${esc(routeName(r))} ${rtBadge(r)}</div><div class="pr-meta">${esc(bits.join(' · '))}</div></div>
            <span class="price">${esc(money(r.price_paid))}</span>
          </div>`;
        }).join('');
        el.innerHTML = head(`${ic('dollar')} ${esc(t_('pricesTitle'))} (${priced.length})`) + `
          <div class="sect ride"><h4>${esc(t_('byRoute'))}</h4><div class="rtgrid">${cards}</div></div>
          <div class="sect white"><h4>${esc(t_('allPriceReports'))}</h4>${rows}${moreBtn(priced.length)}</div>`;
        return;
      }

      if (openMode === 'comments') {
        const withC = pub.filter(r => r.comment && String(r.comment).trim());
        const items = withC.length ? withC.slice(0, showN).map(r => {
          const core = coreOf(r);
          return `<div class="rev">
            <div class="rh">
              ${core > 0 ? `<span class="badge bg-${tone(core)}">${core.toFixed(1)}</span><span class="stars">${stars(core)}</span>` : ''}
              <span class="meta" style="margin:0; margin-inline-start:auto">${new Date(r.created_at).toLocaleDateString(dl())}</span>
            </div>
            <div class="cmt">${esc(r.comment)}</div>
            ${authorHtml(r)}
            ${delRevBtn(r)}
          </div>`;
        }).join('') + moreBtn(withC.length) : `<p class="meta">${esc(t_('noComments'))}</p>`;
        el.innerHTML = head(`${ic('chat')} ${esc(t_('commentsTitle'))} (${withC.length})`) + items;
        return;
      }

      const avgOf = k => {
        const vals = pub.map(r => r[k]).filter(v => v !== null && v !== undefined);
        return { a: vals.length ? vals.reduce((x, y) => x + y, 0) / vals.length : 0, n: vals.length };
      };
      const overview = `<div class="cols">${GROUPS.map(([g, gi, keys]) => `
        <div><div class="grp">${ic(gi)} ${esc(t_(g))}</div>${keys.map(k => { const r = avgOf(k); return barRow(k, r.a, r.n); }).join('')}</div>`).join('')}</div>`;

      const counts = {};
      pub.forEach(r => (r.tags || []).forEach(tg => { if (!LEGACY_TAGS.includes(tg)) counts[tg] = (counts[tg] || 0) + 1; }));
      const tagKeys = Object.keys(counts).sort((a, b) => counts[b] - counts[a]);
      const chipHtml = k => `<span class="chip static ${isPos(k) ? 'pos on' : 'neg on'}">${esc(t_('tag_' + k))} · ${counts[k]}</span>`;
      const posKeys = tagKeys.filter(k => isPos(k)), negKeys = tagKeys.filter(k => !isPos(k));
      const tagSummary = tagKeys.length
        ? `<div class="sect"><h4>${ic('chat')} ${esc(t_('saidTags'))}</h4>
            ${posKeys.length ? `<div class="chips">${posKeys.map(chipHtml).join('')}</div>` : ''}
            ${negKeys.length ? `<div class="chips">${negKeys.map(chipHtml).join('')}</div>` : ''}
          </div>` : '';

      const list = data.length ? data.slice(0, showN).map(r => {
        const core = coreOf(r);
        const rt = (r.tags || []).filter(k => !LEGACY_TAGS.includes(k));
        const chip = k => `<span class="chip static ${isPos(k) ? 'pos on' : 'neg on'}">${esc(t_('tag_' + k))}</span>`;
        const rtags = (rt.filter(isPos).length ? `<div class="chips">${rt.filter(isPos).map(chip).join('')}</div>` : '')
                    + (rt.filter(k => !isPos(k)).length ? `<div class="chips">${rt.filter(k => !isPos(k)).map(chip).join('')}</div>` : '');
        const tripBits = [];
        if (r.trip_date) { tripBits.push(new Date(r.trip_date + 'T12:00:00').toLocaleDateString(dl())); tripBits.push(hebFromStr(r.trip_date)); }
        if (r.time_of_day && TODS.includes(r.time_of_day)) tripBits.push(t_('tod_' + r.time_of_day));
        const recBadge = r.recommend === true ? `<span class="yn good">${ic('up')} ${esc(t_('yes'))}</span>`
                       : r.recommend === false ? `<span class="yn bad">${ic('down')} ${esc(t_('no'))}</span>` : '';
        const mini = ALL_KEYS.filter(k => r[k] !== null && r[k] !== undefined)
          .map(k => {
            const lab = k === 'punctuality' ? punctLabel(r[k]) : null;
            return `<span>${ic(KEY_ICON[k])} ${esc(t_(k))} <b>${esc(lab || r[k])}</b></span>`;
          }).join('');
        return `
        <div class="rev">
          <div class="rh">
            ${core > 0 ? `<span class="badge bg-${tone(core)}">${core.toFixed(1)}</span><span class="stars">${stars(core)}</span>` : ''}
            ${recBadge}
            <span class="meta" style="margin:0; margin-inline-start:auto">${new Date(r.created_at).toLocaleDateString(dl())}</span>
          </div>
          ${(r.approved === false && r.user_id === myUid && !isAdmin) ? `<div class="note warn">${esc(t_('revPending'))}</div>` : ''}
          ${tripBits.length ? `<div class="meta">${ic('cal')} ${esc(t_('trip'))}: ${esc(tripBits.join(' · '))}</div>` : ''}
          ${rideHtml(r)}
          ${rtags}
          ${r.comment ? `<div class="cmt">${esc(r.comment)}</div>` : ''}
          ${mini ? `<details><summary>${esc(t_('detailsWord'))}</summary><div class="mini">${mini}</div></details>` : ''}
          ${authorHtml(r)}
          ${delRevBtn(r)}
        </div>`;
      }).join('') + moreBtn(data.length) : `<p class="meta">${esc(t_('beFirst'))}</p>`;

      el.innerHTML = head(`${esc(t_('allReviews'))} (${data.length})`) + `
        <div class="sect"><h4>${esc(t_('ratingsByCat'))}</h4>${overview}</div>
        ${tagSummary}
        ${list}`;
    }

    document.addEventListener('input', () => { syncDraft(); });
    document.addEventListener('change', (e) => {
      const el = e.target;
      if (el && el.id === 'revRound' && $('rtExtra')) $('rtExtra').classList.toggle('hidden', !el.checked);
      if (el && el.classList && el.classList.contains('placeSel')) {
        const txt = $(el.id + 'Txt');
        if (txt) {
          txt.classList.toggle('hidden', el.value !== '__other');
          if (el.value === '__other') txt.focus();
        }
      }
      syncDraft();
    });

    $('calModal').addEventListener('click', (e) => { if (e.target === $('calModal')) closeCal(); });

    function scrollToCard(id) {
      const card = $('co-' + id);
      if (card) card.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    document.addEventListener('keydown', (e) => {
      if (e.key !== 'Escape') return;
      if ($('calModal').style.display === 'flex') { closeCal(); return; }
      if (!$('msgForm').classList.contains('hidden')) { closeMsg(); return; }
      if (!$('addForm').classList.contains('hidden')) { closeAdd(); return; }
      if (editingId) { editingId = null; renderCompanies(); return; }
      if (openId) { const id = openId; openId = null; draft = {}; renderCompanies(); scrollToCard(id); return; }
      if (usersOpen) { usersOpen = false; renderUsers(); }
    });

    document.addEventListener('click', async (e) => {
      const t = e.target.closest ? (e.target.closest('button, .st, a[data-call]') || e.target) : e.target;
      const ds = t.dataset || {};

      if (ds.call) {
        if (myUid && !isAdmin) sb.from('call_log').insert({ company_id: String(ds.call) }).then(() => {});
        return;
      }
      if (ds.actfilter) { usersFilter = !usersFilter; renderUsers(); return; }
      if (ds.usersclose) { usersOpen = false; renderUsers(); return; }
      if (ds.reqtoggle) { reqOpen = !reqOpen; renderRequests(); return; }
      if (ds.more) { showN += 10; paintDetail(); return; }

      if (ds.reqperm) {
        t.disabled = true;
        const { error } = await sb.from('review_requests').insert({ user_id: myUid, phone: myPhone || null });
        if (error && !/duplicate|unique/i.test(error.message)) { t.disabled = false; return toast(error.message, true, 6000); }
        myReqPending = true;
        paintDetail();
        toast(t_('reqPermSent'), false, 4000);
        return;
      }
      if (ds.permok) {
        t.disabled = true;
        const { error } = await sb.rpc('admin_set_reviewer', { target: ds.permok, allow: true });
        if (error) {
          alert(/COMPANY_ACCOUNT/.test(error.message) ? t_('companyAcct') : error.message);
          t.disabled = false; return;
        }
        await loadCompanies();
        toast(t_('saved'));
        return;
      }
      if (ds.permno) {
        if (!confirm(t_('confirmReject'))) return;
        const { error } = await sb.from('review_requests').delete().eq('user_id', ds.permno);
        if (error) { alert(error.message); return; }
        await sb.rpc('admin_mark_seen', { target: ds.permno });
        await loadCompanies();
        return;
      }
      if (ds.seen) {
        const { error } = await sb.rpc('admin_mark_seen', { target: ds.seen });
        if (error) { alert(error.message); return; }
        await loadCompanies();
        return;
      }

      if (ds.apprev) {
        t.disabled = true;
        const res = await sb.from('reviews').update({ approved: true }).eq('id', ds.apprev).select();
        if (res.error || !res.data || !res.data.length) { alert(res.error ? res.error.message : t_('notSaved')); t.disabled = false; return; }
        await loadCompanies();
        toast(t_('saved'));
        return;
      }
      if (ds.rejrev) {
        if (!confirm(t_('confirmReject'))) return;
        const { error } = await sb.from('reviews').delete().eq('id', ds.rejrev);
        if (error) { alert(error.message); return; }
        await loadCompanies();
        return;
      }

      if (ds.approve) {
        const r = reqList.find(x => x.id === ds.approve);
        if (!r) return;
        t.disabled = true;
        const d = r.data || {};
        const row = { name: d.name, city: d.city || null, description: d.description || null, phone: d.phone || null, email: d.email || null };
        let err = null;
        if (r.kind === 'add') err = (await sb.from('companies').insert(row)).error;
        else err = (await sb.from('companies').update(row).eq('id', r.company_id)).error;
        if (err) { alert(err.message); t.disabled = false; return; }
        await sb.from('change_requests').delete().eq('id', r.id);
        await loadCompanies();
        toast(t_('saved'));
        return;
      }
      if (ds.rejectreq) {
        if (!confirm(t_('confirmReject'))) return;
        const { error } = await sb.from('change_requests').delete().eq('id', ds.rejectreq);
        if (error) { alert(error.message); return; }
        await loadCompanies();
        return;
      }
      if (ds.delmsg) {
        const { error } = await sb.from('admin_messages').delete().eq('id', ds.delmsg);
        if (error) { alert(error.message); return; }
        await loadCompanies();
        return;
      }

      const dayEl = e.target.closest ? e.target.closest('[data-day]') : null;
      if (dayEl && pickMode) { setTripDate(dayEl.dataset.day); closeCal(); return; }
      if (ds.pickdate) { openPick(); return; }

      if (ds.cal) {
        if (ds.cal === 'close') { closeCal(); return; }
        if (ds.cal === 'today') {
          if (pickMode && $('revDate')) { setTripDate(isoOf(new Date())); closeCal(); return; }
          calAnchor = noon(new Date());
        }
        if (ds.cal === 'next') { calAnchor = new Date(calLast); calAnchor.setDate(calAnchor.getDate() + 1); }
        if (ds.cal === 'prev') { calAnchor = new Date(calFirst); calAnchor.setDate(calAnchor.getDate() - 1); }
        renderCal();
        return;
      }

      if (ds.sendlogo) { sugTarget = ds.sendlogo; $('sugFile').click(); return; }
      if (ds.uselogo) {
        const sg = sugList.find(x => x.id === ds.uselogo);
        if (!sg) return;
        const up = await sb.from('companies').update({ logo_url: sg.logo_url }).eq('id', sg.company_id);
        if (up.error) { alert(up.error.message); return; }
        await sb.from('logo_suggestions').delete().eq('id', sg.id);
        await loadCompanies();
        toast(t_('saved'));
        return;
      }
      if (ds.dismisslogo) {
        const { error } = await sb.from('logo_suggestions').delete().eq('id', ds.dismisslogo);
        if (error) { alert(error.message); return; }
        await loadCompanies();
        return;
      }

      if (ds.ban) {
        if (!confirm(t_('confirmBan'))) return;
        const del = confirm(t_('confirmBanDel'));
        const { error } = await sb.rpc('admin_set_ban', { target: ds.ban, ban: true, del_reviews: del });
        if (error) { alert(error.message); return; }
        await loadCompanies();
        toast(t_('banned'));
        return;
      }
      if (ds.unban) {
        if (!confirm(t_('confirmUnban'))) return;
        const { error } = await sb.rpc('admin_set_ban', { target: ds.unban, ban: false, del_reviews: false });
        if (error) { alert(error.message); return; }
        await loadCompanies();
        toast(t_('saved'));
        return;
      }

      if (ds.open || ds.prices || ds.comments || ds.write) {
        const id = ds.open || ds.prices || ds.comments || ds.write;
        const m = ds.open ? 'view' : (ds.prices ? 'prices' : (ds.comments ? 'comments' : 'write'));
        if (openId === id && openMode === m) openId = null;
        else { openId = id; openMode = m; }
        draft = {};
        showN = 8;
        renderCompanies();
        scrollToCard(id);
        return;
      }
      if (ds.close) {
        const id = ds.close;
        openId = null;
        draft = {};
        renderCompanies();
        scrollToCard(id);
        return;
      }

      if (ds.punct) {
        const v = Number(ds.punct);
        draft.punctuality = (draft.punctuality === v) ? undefined : v;
        document.querySelectorAll('.ptbtn').forEach(b => b.classList.toggle('on', Number(b.dataset.punct) === draft.punctuality));
        return;
      }

      if (t.classList && t.classList.contains('st')) {
        const cat = t.parentElement.dataset.cat;
        const v = Number(t.dataset.v);
        draft[cat] = (draft[cat] === v) ? null : v;
        t.parentElement.querySelectorAll('.st').forEach(s => s.classList.toggle('on', Number(s.dataset.v) <= (draft[cat] || 0)));
        return;
      }

      if (ds.rec !== undefined) {
        const val = ds.rec === '1';
        draft.rec = (draft.rec === val) ? undefined : val;
        document.querySelectorAll('.recbtn').forEach(b => b.classList.toggle('on', draft.rec === (b.dataset.rec === '1')));
        return;
      }

      if (ds.tag) {
        draft.tags = draft.tags || [];
        const i = draft.tags.indexOf(ds.tag);
        if (i >= 0) draft.tags.splice(i, 1); else draft.tags.push(ds.tag);
        t.classList.toggle('on', i < 0);
        return;
      }

      if (ds.delrev) {
        if (!confirm(t_('confirmDelAnyRev'))) return;
        const { error } = await sb.from('reviews').delete().eq('id', ds.delrev);
        if (error) { alert(error.message); return; }
        loadCompanies();
        return;
      }

      if (ds.delco) {
        if (!confirm(t_('confirmDelCo'))) return;
        const { error } = await sb.from('companies').delete().eq('id', ds.delco);
        if (error) { alert(error.message); return; }
        if (openId === ds.delco) openId = null;
        loadCompanies();
        return;
      }

      if (ds.edco) { editingId = ds.edco; renderCompanies(); return; }
      if (ds.canceledit) { editingId = null; renderCompanies(); return; }

      if (ds.saveedit) {
        const name = $('eName').value.trim();
        if (!name) return showMsg($('editMsg'), t_('nameRequired'), false, 4000);
        t.disabled = true;
        try {
          const ph = $('ePhone').value.trim();
          const row = {
            name,
            city: readPlace('eCity'),
            description: $('eDesc').value.trim() || null,
            phone: ph ? fmtPhone(ph) : null,
            email: $('eEmail').value.trim() || null
          };
          if (isAdmin) {
            const file = $('eLogoFile') ? $('eLogoFile').files[0] : null;
            if (file) row.logo_url = await uploadLogo(file);
            const { error } = await sb.from('companies').update(row).eq('id', ds.saveedit);
            if (error) throw error;
          } else {
            const { error } = await sb.from('change_requests').insert({ user_id: myUid, kind: 'edit', company_id: ds.saveedit, data: row });
            if (error) throw error;
            toast(t_('reqSent'));
          }
          editingId = null;
          loadCompanies();
        } catch (err) {
          showMsg($('editMsg'), err.message || String(err), false);
          t.disabled = false;
        }
        return;
      }

      if (t.id === 'submitReview') {
        const msg = $('revMsg');
        if (writeLangBlocked()) return toast(T.en.langBlock, true);
        langAlertIfNeeded();
        if (isBanned) return showMsg(msg, t_('bannedMsg'), false, 5000);
        if (!isAdmin && !canReview) return showMsg(msg, t_('noPermNow'), false, 5000);
        syncDraft();
        if (!hasAnyAnswer()) return toast(t_('needOne'), true);

        const fromV = readPlace('revFrom'), toV = readPlace('revTo');
        const priceRaw = $('revPrice').value.trim();
        let price_paid = null;
        if (priceRaw !== '') {
          price_paid = Math.round(Number(priceRaw) * 100) / 100;
          if (!isFinite(price_paid) || price_paid <= 0 || price_paid > 99999) return showMsg(msg, t_('badPrice'), false, 5000);
          if (!fromV || !toV) return toast(t_('priceNeedsRoute'), true, 5000);
        }
        const dv = $('revDate').value;
        if (dv && dv > isoOf(new Date())) return toast(t_('pickDate'), true);

        const isRound = price_paid !== null && $('revRound').checked;
        const hourRaw = $('revHour') ? $('revHour').value.trim() : '';
        const vals = {
          comment: $('revComment').value.trim() || null,
          recommend: (draft.rec === true || draft.rec === false) ? draft.rec : null,
          tags: draft.tags || [],
          trip_date: dv || null,
          time_of_day: $('revTod').value || null,
          trip_from: fromV,
          trip_to: toV,
          price_paid,
          round_trip: isRound,
          toll_included: price_paid !== null ? !!$('revToll').checked : false,
          first_hour_free: isRound ? !!$('revFree').checked : false,
          hourly_price: (isRound && hourRaw !== '' && isFinite(Number(hourRaw))) ? Math.round(Number(hourRaw) * 100) / 100 : null,
          price: null,
          updated_at: new Date().toISOString()
        };
        ALL_KEYS.forEach(k => vals[k] = draft[k] || null);
        t.disabled = true;

        let error = null;
        if (myReviewId) {
          const res = await sb.from('reviews').update(vals).eq('id', myReviewId).eq('user_id', myUid).select();
          error = res.error;
          if (!error && (!res.data || res.data.length === 0)) {
            t.disabled = false;
            return showMsg(msg, t_('notSaved'), false, 6000);
          }
        } else {
          const res = await sb.from('reviews').insert({ ...vals, company_id: t.dataset.company, user_id: myUid });
          error = res.error;
        }
        if (error) { t.disabled = false; return showMsg(msg, error.message, false, 6000); }

        const cid = openId;
        draft = {};
        openId = null;
        await loadCompanies();
        toast(t_('saved'));
        scrollToCard(cid);
        return;
      }

      if (t.id === 'deleteReview') {
        if (!confirm(t_('confirmDelRev'))) return;
        const { error } = await sb.from('reviews').delete()
          .eq('company_id', t.dataset.company).eq('user_id', myUid);
        if (error) return showMsg($('revMsg'), error.message, false, 6000);
        draft = {};
        openId = null;
        await loadCompanies();
        toast(t_('deleted'));
      }
    });

    async function render(session) {
      if (session) {
        myUid = session.user.id;
        myEmail = session.user.email;
        myPhone = (session.user.user_metadata && session.user.user_metadata.phone) || '';
        loggedIn = true;
        $('authView').classList.add('hidden');
        $('mainView').classList.remove('hidden');
        await checkAdmin();
        await checkBanned();
        await loadMyReq();
        applyStaticText();
        loadCompanies();
      } else {
        myUid = null; myEmail = ''; myPhone = ''; loggedIn = false; isAdmin = false; isBanned = false; canReview = false; myReqPending = false; usersOpen = false;
        document.title = 'CarReviews';
        $('authView').classList.remove('hidden');
        $('mainView').classList.add('hidden');
        applyStaticText();
      }
    }

    applyStaticText();

    setInterval(async () => {
      if (!isAdmin || document.hidden) return;
      await Promise.all([loadUsers(), loadPermReqs()]);
      renderRequests();
      renderUsers();
    }, 60000);

    let lastUid;
    function handleSession(session) {
      const uid = session ? session.user.id : null;
      if (uid === lastUid) return;
      lastUid = uid;
      render(session);
    }
    sb.auth.onAuthStateChange((_event, session) => handleSession(session));
    sb.auth.getSession().then(({ data }) => handleSession(data.session));
  </script>
</body>
</html>

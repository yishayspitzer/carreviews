      if (saved && T[saved]) return saved;

    async function uploadLogo(file) {
      if (!file) return null;
      if (file.size > 2 * 1024 * 1024) throw new Error(t_('logoTooBig'));
      const ext = (file.name.split('.').pop() || 'png').toLowerCase().replace(/[^a-z0-9]/g, '');
      const path = Date.now() + '-' + Math.random().toString(36).slice(2, 8) + '.' + ext;
      const { error } = await sb.storage.from('logos').upload(path, file, { contentType: file.type });
      if (error) throw error;
      return sb.storage.from('logos').getPublicUrl(path).data.publicUrl;
    }

    async function checkAdmin() {
      isAdmin = false;
      if (!myUid) return;
      try {
        const { data } = await sb.from('profiles').select('role').eq('id', myUid).maybeSingle();
        isAdmin = !!data && data.role === 'admin';
      } catch (e) { isAdmin = false; }
    }

    $('showPw').onclick = () => {
      const p = $('password');
      p.type = p.type === 'password' ? 'text' : 'password';
      $('showPw').textContent = p.type === 'password' ? t_('show') : t_('hide');
    };

    function showMsg(el, text, ok) {
      if (!el) return alert(text);
      el.textContent = text;
      el.className = 'msg ' + (ok ? 'ok' : 'err');
      el.style.display = 'block';
      try { el.scrollIntoView({ behavior: 'smooth', block: 'center' }); } catch (e) {}
    }

    function setMode(signup) {
      isSignup = signup;
      $('nameWrap').classList.toggle('hidden', !signup);
      $('msg').style.display = 'none';
      applyStaticText();
    }
    $('toggleBtn').onclick = () => setMode(!isSignup);

    $('authBtn').onclick = async () => {
      const email = $('email').value.trim();
      const password = $('password').value;
      if (!email || password.length < 6) return showMsg($('msg'), t_('enterCreds'), false);
      if (isSignup) {
        const full_name = $('fullName').value.trim();
        const { data, error } = await sb.auth.signUp({ email, password, options: { data: { full_name } } });
        if (error) return showMsg($('msg'), error.message, false);
        if (data.session) showMsg($('msg'), t_('created'), true);
        else { showMsg($('msg'), t_('createdConfirm'), true); setMode(false); }
      } else {
        const { error } = await sb.auth.signInWithPassword({ email, password });
        if (error) return showMsg($('msg'), error.message, false);
      }
    };

    async function logout() { openId = null; editingId = null; await sb.auth.signOut(); }

    $('addToggle').onclick = () => $('addForm').classList.toggle('hidden');

    $('saveCompany').onclick = async () => {
      const name = $('cName').value.trim();
      if (!name) return showMsg($('addMsg'), t_('nameRequired'), false);
      const btn = $('saveCompany');
      btn.disabled = true;
      try {
        const logo_url = await uploadLogo($('cLogoFile').files[0]);
        const phoneRaw = $('cPhone').value.trim();
        const row = {
          name,
          city: $('cCity').value.trim() || null,
          description: $('cDesc').value.trim() || null,
          phone: phoneRaw ? fmtPhone(phoneRaw) : null,
          email: $('cEmail').value.trim() || null,
          logo_url
        };
        const { error } = await sb.from('companies').insert(row);
        if (error) throw error;
        ['cName','cCity','cDesc','cPhone','cEmail','cLogoFile'].forEach(id => $(id).value = '');
        $('addMsg').style.display = 'none';
        $('addForm').classList.add('hidden');
        loadCompanies();
      } catch (err) {
        showMsg($('addMsg'), err.message || String(err), false);
      }
      btn.disabled = false;
    };

    $('search').oninput = () => renderCompanies();
    $('sort').onchange = () => renderCompanies();
    $('cityFilter').onchange = () => renderCompanies();

    async function loadCompanies() {
      const box = $('companies');
      const [cRes, sRes, rRes] = await Promise.all([
        sb.from('companies').select('*').order('created_at', { ascending: false }),
        sb.from('company_stats').select('*'),
        sb.from('company_recommend').select('*')
      ]);
      if (cRes.error) { box.innerHTML = '<div class="card">' + esc(t_('error')) + ': ' + esc(cRes.error.message) + '</div>'; return; }
      allCompanies = cRes.data;
      stats = {};
      (sRes.data || []).forEach(s => stats[s.company_id] = s);
      recStats = {};
      (rRes.data || []).forEach(s => recStats[s.company_id] = s);
      renderCompanies();
    }

    function renderCompanies() {
      const box = $('companies');
      const q = $('search').value.trim().toLowerCase();
      const mode = $('sort').value;
      const ov = c => stats[c.id] ? Number(stats[c.id].overall) : 0;
      const cnt = c => stats[c.id] ? stats[c.id].review_count : 0;

      // City filter options
      const cities = [...new Set(allCompanies.map(c => (c.city || '').trim()).filter(Boolean))]
        .sort((a, b) => a.localeCompare(b));
      const citySel = $('cityFilter');
      const curCity = citySel.value;
      citySel.innerHTML = `<option value="">${esc(t_('allCities'))}</option>` +
        cities.map(c => `<option value="${esc(c)}">${esc(c)}</option>`).join('');
      citySel.value = cities.includes(curCity) ? curCity : '';
      const cityQ = citySel.value;

      let list = allCompanies.filter(c =>
        (!q || (c.name || '').toLowerCase().includes(q) ||
               (c.description || '').toLowerCase().includes(q) ||
               (c.city || '').toLowerCase().includes(q)) &&
        (!cityQ || (c.city || '').trim() === cityQ));

      if (mode === 'rating') list.sort((a, b) => ov(b) - ov(a) || cnt(b) - cnt(a));
      else if (mode === 'count') list.sort((a, b) => cnt(b) - cnt(a));
      else if (mode === 'name') list.sort((a, b) => (a.name || '').localeCompare(b.name || ''));
      else list.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

      box.innerHTML = list.length ? list.map(c => {
        if (editingId === c.id) {
          return `
          <div class="card">
            <h4>${esc(t_('editCompany'))}</h4>
            <div id="editMsg" class="msg"></div>
            <input id="eName" type="text" value="${esc(c.name)}" placeholder="${esc(t_('companyName'))}">
            <input id="eCity" type="text" value="${esc(c.city || '')}" placeholder="${esc(t_('cityPh'))}">
            <textarea id="eDesc" rows="3" placeholder="${esc(t_('description'))}">${esc(c.description || '')}</textarea>
            <input id="ePhone" type="text" value="${esc(c.phone || '')}" placeholder="${esc(t_('phone'))}">
            <input id="eEmail" type="email" value="${esc(c.email || '')}" placeholder="${esc(t_('email'))}">
            ${c.logo_url ? `<div class="fileline">${esc(t_('currentLogo'))}</div><img class="clogo" src="${esc(c.logo_url)}" alt="">` : ''}
            <div class="fileline">${esc(c.logo_url ? t_('replaceLogo') : t_('logoOpt'))}</div>
            <input id="eLogoFile" type="file" accept="image/*">
            <button data-saveedit="${c.id}">${esc(t_('save'))}</button>
            <button class="link" data-canceledit="1">${esc(t_('cancel'))}</button>
          </div>`;
        }
        const s = stats[c.id];
        const rc = recStats[c.id];
        const overall = ov(c);
        const recHtml = rc && rc.rec_votes > 0
          ? `<span class="rec">👍 ${Number(rc.rec_pct)}% ${esc(t_('recommendWord'))} (${rc.rec_votes})</span>` : '';
        const rating = s
          ? `<span class="stars big">${stars(overall)}</span><span class="num">${overall.toFixed(1)} (${s.review_count})</span>${recHtml}`
          : `<span class="meta">${esc(t_('noReviewsYet'))}</span>`;
        return `
          <div class="card">
            <div class="row">
              <div class="cinfo">
                ${c.logo_url ? `<img class="clogo" src="${esc(c.logo_url)}" alt="">` : ''}
                <div>
                  <div class="cname">${esc(c.name)}</div>
                  <div>${rating}</div>
                </div>
              </div>
              <div class="actions">
                <button data-open="${c.id}">${esc(openId === c.id ? t_('close') : t_('reviews'))}</button>
                ${isAdmin ? `<button class="gold" data-edco="${c.id}">${esc(t_('edit'))}</button><button class="danger" data-delco="${c.id}">${esc(t_('del'))}</button>` : ''}
              </div>
            </div>
            ${c.description ? `<div class="meta">${esc(c.description)}</div>` : ''}
            <div class="meta">${c.city ? '📍 ' + esc(c.city) + ' &nbsp; ' : ''}${c.phone ? '📞 ' + esc(fmtPhone(c.phone)) + ' &nbsp; ' : ''}${c.email ? '✉️ ' + esc(c.email) : ''}</div>
            ${openId === c.id ? `<div class="detail" id="detail"></div>` : ''}
          </div>`;
      }).join('') : '<p>' + esc(t_('noCompanies')) + '</p>';

      if (openId) loadDetail(openId);
    }

    async function loadDetail(companyId) {
      const el = $('detail');
      if (!el) return;
      el.innerHTML = esc(t_('loading'));
      const { data, error } = await sb.from('reviews').select('*').eq('company_id', companyId).order('created_at', { ascending: false });
      if (error) { el.innerHTML = esc(t_('error')) + ': ' + esc(error.message); return; }

      const mine = data.find(r => r.user_id === myUid);
      myReviewId = mine ? mine.id : null;
      if (!Object.keys(draft).length && mine) {
        CAT_KEYS.forEach(k => draft[k] = mine[k]);
        draft.comment = mine.comment || '';
        draft.rec = mine.recommend;
        draft.tags = Array.isArray(mine.tags) ? mine.tags.slice() : [];
        draft.trip_date = mine.trip_date || '';
        draft.tod = mine.time_of_day || '';
      }
      const dTags = draft.tags || [];

      // Averages grouped
      const avgs = GROUPS.map(([g, keys]) => `
        <div class="grp">${esc(t_(g))}</div>
        ${keys.map(k => {
          const a = data.length ? data.reduce((t, r) => t + r[k], 0) / data.length : 0;
          return `<div class="catrow"><span>${esc(catLabel(k))}</span><span><span class="stars">${stars(a)}</span><span class="num">${data.length ? a.toFixed(1) : '-'}</span></span></div>`;
        }).join('')}`).join('');

      // Tag counts ("what people say")
      const counts = {};
      data.forEach(r => (r.tags || []).forEach(tg => counts[tg] = (counts[tg] || 0) + 1));
      const tagKeys = Object.keys(counts).sort((a, b) => counts[b] - counts[a]);
      const tagSummary = tagKeys.length
        ? `<h4>${esc(t_('saidTags'))}</h4><div class="chips">${tagKeys.map(k =>
            `<span class="chip static ${isPos(k) ? 'pos on' : 'neg on'}">${esc(t_('tag_' + k))} · ${counts[k]}</span>`).join('')}</div>`
        : '';

      // Form: grouped stars
      const form = GROUPS.map(([g, keys]) => `
        <div class="grp">${esc(t_(g))}</div>
        ${keys.map(k => `
          <div class="catrow"><span>${esc(catLabel(k))}</span>
            <span class="pick" data-cat="${k}">${[1,2,3,4,5].map(v => `<span class="st ${draft[k] >= v ? 'on' : ''}" data-v="${v}">★</span>`).join('')}</span>
          </div>`).join('')}`).join('');

      const recForm = `
        <h4>${esc(t_('recommendQ'))}</h4>
        <div class="recbtns">
          <button type="button" class="recbtn yes ${draft.rec === true ? 'on' : ''}" data-rec="1">${esc(t_('yes'))}</button>
          <button type="button" class="recbtn no ${draft.rec === false ? 'on' : ''}" data-rec="0">${esc(t_('no'))}</button>
        </div>`;

      const tagForm = `
        <h4>${esc(t_('tagsTitle'))}</h4>
        <div class="chips">
          ${POS_TAGS.map(k => `<button type="button" class="chip pos ${dTags.includes(k) ? 'on' : ''}" data-tag="${k}">${esc(t_('tag_' + k))}</button>`).join('')}
          ${NEG_TAGS.map(k => `<button type="button" class="chip neg ${dTags.includes(k) ? 'on' : ''}" data-tag="${k}">${esc(t_('tag_' + k))}</button>`).join('')}
        </div>`;

      const today = new Date().toISOString().slice(0, 10);
      const tripForm = `
        <h4>${esc(t_('tripWhen'))}</h4>
        <div class="two">
          <input id="revDate" type="date" max="${today}" value="${esc(draft.trip_date || '')}">
          <select id="revTod">
            <option value="">${esc(t_('todPh'))}</option>
            ${TODS.map(k => `<option value="${k}" ${draft.tod === k ? 'selected' : ''}>${esc(t_('tod_' + k))}</option>`).join('')}
          </select>
        </div>`;

      const list = data.length ? data.map(r => {
        const rtags = (r.tags || []).map(k =>
          `<span class="chip static ${isPos(k) ? 'pos on' : 'neg on'}">${esc(t_('tag_' + k))}</span>`).join('');
        const tripBits = [];
        if (r.trip_date) tripBits.push(new Date(r.trip_date + 'T00:00:00').toLocaleDateString(lang));
        if (r.time_of_day && TODS.includes(r.time_of_day)) tripBits.push(t_('tod_' + r.time_of_day));
        const recBadge = r.recommend === true ? ` <span class="rec">${esc(t_('yes'))}</span>`
                       : r.recommend === false ? ` <span class="meta" style="color:#c0392b;font-weight:bold">${esc(t_('no'))}</span>` : '';
        return `
        <div class="rev">
          <span class="stars">${stars((r.punctuality + r.price + r.service + r.cleanliness + r.driving) / 5)}</span>
          <span class="meta">${new Date(r.created_at).toLocaleDateString(lang)}</span>${recBadge}
          ${tripBits.length ? `<div class="meta">🕒 ${esc(t_('trip'))}: ${esc(tripBits.join(' · '))}</div>` : ''}
          ${rtags ? `<div class="chips">${rtags}</div>` : ''}
          ${r.comment ? `<div><b>${esc(t_('otherIssue'))}:</b> ${esc(r.comment)}</div>` : ''}
          <div class="cats">${GROUPS.map(([g, keys]) => `<b>${esc(t_(g))}</b>: ` + keys.map(k => `${esc(catLabel(k))} ${r[k]}★`).join(' | ')).join('<br>')}</div>
          ${isAdmin && r.user_id !== myUid ? `<button class="danger small" data-delrev="${r.id}">${esc(t_('del'))}</button>` : ''}
        </div>`;
      }).join('') : `<p class="meta">${esc(t_('beFirst'))}</p>`;

      el.innerHTML = `
        <h4>${esc(t_('ratingsByCat'))}</h4>${avgs}
        ${tagSummary}
        <h4>${esc(mine ? t_('editReview') : t_('writeReview'))} ${esc(t_('anonymous'))}</h4>
        <div id="revMsg" class="msg"></div>
        ${form}
        ${recForm}
        ${tagForm}
        ${tripForm}
        <textarea id="revComment" rows="3" placeholder="${esc(t_('otherIssue'))}">${esc(draft.comment || '')}</textarea>
        <button id="submitReview" data-company="${companyId}">${esc(mine ? t_('update') : t_('submit'))}</button>
        ${mine ? `<button id="deleteReview" class="danger" data-company="${companyId}">${esc(t_('delMine'))}</button>` : ''}
        <h4>${esc(t_('allReviews'))} (${data.length})</h4>${list}`;

      if (flash) { showMsg($('revMsg'), flash, true); flash = ''; }
    }

    document.addEventListener('click', async (e) => {
      const t = e.target;
      const ds = t.dataset || {};

      if (ds.open) {
        openId = (openId === ds.open) ? null : ds.open;
        draft = {};
        renderCompanies();
        return;
      }

      if (t.classList && t.classList.contains('st')) {
        const cat = t.parentElement.dataset.cat;
        const v = Number(t.dataset.v);
        draft[cat] = v;
        t.parentElement.querySelectorAll('.st').forEach(s => s.classList.toggle('on', Number(s.dataset.v) <= v));
        return;
      }

      // Recommend Yes / No (click again to clear)
      if (ds.rec !== undefined) {
        const val = ds.rec === '1';
        draft.rec = (draft.rec === val) ? undefined : val;
        document.querySelectorAll('.recbtn').forEach(b => {
          const bv = b.dataset.rec === '1';
          b.classList.toggle('on', draft.rec === bv);
        });
        return;
      }

      // Tag chips
      if (ds.tag) {
        draft.tags = draft.tags || [];
        const i = draft.tags.indexOf(ds.tag);
        if (i >= 0) draft.tags.splice(i, 1); else draft.tags.push(ds.tag);
        t.classList.toggle('on', i < 0);
        return;
      }

      if (ds.delrev) {
        if (!confirm(t_('confirmDelAnyRev'))) return;
        const { error } = await sb.from('reviews').delete().eq('id', ds.delrev);
        if (error) { alert(error.message); return; }
        loadCompanies();
        return;
      }

      if (ds.delco) {
        if (!confirm(t_('confirmDelCo'))) return;
        const { error } = await sb.from('companies').delete().eq('id', ds.delco);
        if (error) { alert(error.message); return; }
        if (openId === ds.delco) openId = null;
        loadCompanies();
        return;
      }

      if (ds.edco) { editingId = ds.edco; renderCompanies(); return; }
      if (ds.canceledit) { editingId = null; renderCompanies(); return; }

      if (ds.saveedit) {
        const name = $('eName').value.trim();
        if (!name) return showMsg($('editMsg'), t_('nameRequired'), false);
        t.disabled = true;
        try {
          const ph = $('ePhone').value.trim();
          const row = {
            name,
            city: $('eCity').value.trim() || null,
            description: $('eDesc').value.trim() || null,
            phone: ph ? fmtPhone(ph) : null,
            email: $('eEmail').value.trim() || null
          };
          const file = $('eLogoFile').files[0];
          if (file) row.logo_url = await uploadLogo(file);
          const { error } = await sb.from('companies').update(row).eq('id', ds.saveedit);
          if (error) throw error;
          editingId = null;
          loadCompanies();
        } catch (err) {
          showMsg($('editMsg'), err.message || String(err), false);
          t.disabled = false;
        }
        return;
      }

      if (t.id === 'submitReview') {
        const msg = $('revMsg');
        if (CAT_KEYS.some(k => !draft[k])) return showMsg(msg, t_('rateAll'), false);
        const vals = {
          comment: $('revComment').value.trim() || null,
          recommend: (draft.rec === true || draft.rec === false) ? draft.rec : null,
          tags: draft.tags || [],
          trip_date: $('revDate').value || null,
          time_of_day: $('revTod').value || null,
          updated_at: new Date().toISOString()
        };
        CAT_KEYS.forEach(k => vals[k] = draft[k]);
        t.disabled = true;

        let error = null;
        if (myReviewId) {
          const res = await sb.from('reviews').update(vals)
            .eq('id', myReviewId).eq('user_id', myUid).select();
          error = res.error;
          if (!error && (!res.data || res.data.length === 0)) {
            t.disabled = false;
            return showMsg(msg, t_('notSaved'), false);
          }
        } else {
          const res = await sb.from('reviews').insert({ ...vals, company_id: t.dataset.company, user_id: myUid });
          error = res.error;
        }
        if (error) { t.disabled = false; return showMsg(msg, error.message, false); }

        draft = {};
        flash = t_('saved');
        loadCompanies();
        return;
      }

      if (t.id === 'deleteReview') {
        if (!confirm(t_('confirmDelRev'))) return;
        const { error } = await sb.from('reviews').delete()
          .eq('company_id', t.dataset.company).eq('user_id', myUid);
        if (error) return showMsg($('revMsg'), error.message, false);
        draft = {};
        loadCompanies();
      }
    });

    async function render(session) {
      if (session) {
        myUid = session.user.id;
        myEmail = session.user.email;
        loggedIn = true;
        $('authView').classList.add('hidden');
        $('mainView').classList.remove('hidden');
        applyStaticText();
        await checkAdmin();
        loadCompanies();
      } else {
        myUid = null;
        myEmail = '';
        loggedIn = false;
        isAdmin = false;
        $('authView').classList.remove('hidden');
        $('mainView').classList.add('hidden');
        applyStaticText();
      }
    }

    applyStaticText();
    sb.auth.onAuthStateChange((_event, session) => { render(session); });
    sb.auth.getSession().then(({ data }) => render(data.session));
  </script>
</body>
</html>

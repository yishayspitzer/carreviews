<html lang="en">

  <style>
    body { font-family: Arial, sans-serif; max-width: 900px; margin: 0 auto; padding: 0 16px 40px; background:#f5f7fa; }
    header { display:flex; justify-content:space-between; align-items:center; padding:16px 0; border-bottom:1px solid #ddd; gap:10px; flex-wrap:wrap; }
    .brand { display:flex; align-items:center; gap:10px; }
    h1 { color:#1a3c6e; margin:0; font-size:28px; }
    h1 span { color:#e8a317; }
    .card { background:#fff; border:1px solid #ddd; border-radius:8px; padding:14px; margin:10px 0; }
    .box { max-width:360px; margin:30px auto; }
    input, textarea, select { width:100%; padding:10px; margin:6px 0; box-sizing:border-box; border:1px solid #ccc; border-radius:6px; font-family:inherit; }
    textarea { resize: vertical; max-width: 100%; min-height: 70px; }
    .pwwrap { position:relative; }
    .pwwrap input { padding-right:80px; }
    .pwwrap button { position:absolute; right:6px; top:11px; padding:4px 10px; font-size:12px; background:#e6ebf3; color:#1a3c6e; }
    button { padding:10px 16px; border:0; border-radius:6px; background:#1a3c6e; color:#fff; cursor:pointer; }
    button.link { background:none; color:#1a3c6e; text-decoration:underline; padding:4px; }
    button.gold { background:#e8a317; }
    button.danger { background:#c0392b; }
    .msg { padding:8px; border-radius:6px; margin:8px 0; display:none; }
    .err { background:#fde8e8; color:#a00; }
    .ok  { background:#e6f7e9; color:#0a6a22; }
    .hidden { display:none; }
    .row { display:flex; justify-content:space-between; align-items:center; gap:10px; }
    .actions { display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end; }
    .cinfo { display:flex; align-items:center; gap:12px; }
    .clogo { width:56px; height:56px; object-fit:contain; border-radius:8px; border:1px solid #eee; background:#fff; }
    .cname { font-weight:bold; color:#1a3c6e; font-size:18px; }
    .meta { color:#555; font-size:14px; margin-top:4px; }
    .stars { color:#e8a317; letter-spacing:2px; font-size:18px; }
    .stars.big { font-size:22px; }
    .num { color:#333; font-size:14px; margin-left:6px; letter-spacing:0; }
    .detail { border-top:1px solid #eee; margin-top:12px; padding-top:12px; }
    .catrow { display:flex; justify-content:space-between; align-items:center; padding:5px 0; gap:8px; }
    .pick .st { cursor:pointer; font-size:26px; color:#ccc; padding:0 2px; user-select:none; }
    .pick .st.on { color:#e8a317; }
    .rev { background:#f8f9fb; border-radius:6px; padding:10px; margin:8px 0; }
    .rev .cats { font-size:13px; color:#555; margin-top:4px; }
    .filters { display:flex; gap:10px; margin:6px 0; }
    .filters input { flex:2; }
    .filters select { flex:1; }
    .fileline { font-size:13px; color:#555; margin:6px 0 2px; }
    #userbar { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
    #langSel { width:auto; margin:0; padding:6px 8px; }
    h4 { margin:14px 0 6px; color:#1a3c6e; }
  </style>
</head>
<body>

      <svg width="48" height="48" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-label="CarReviews logo">

        <option value="en">English</option>

  <div id="authView" class="box card">

    <div id="nameWrap" class="hidden">

    <input id="email" type="email">
    <div class="pwwrap">

      <button id="showPw" type="button"></button>

    <button id="authBtn"></button>
    <p><button id="toggleBtn" class="link"></button></p>

  <div id="mainView" class="hidden">
    <div class="row">
      <h2 id="tCompanies"></h2>

    <div id="addForm" class="card hidden">

    <div class="filters">
      <input id="search" type="text">
      <select id="sort">
        <option value="rating"></option>
        <option value="count"></option>
        <option value="new"></option>
        <option value="name"></option>
      </select>
    </div>

    <div id="companies"></div>
  </div>

  <script>

        show: '👁 Mostrar', hide: '🙈 Ocultar',
        noAccount: '¿No tienes cuenta? Regístrate', haveAccount: '¿Ya tienes cuenta? Inicia sesión',
        enterCreds: 'Ingresa tu correo y una contraseña de 6+ caracteres',
        created: 'Cuenta creada ✅', createdConfirm: 'Cuenta creada. Revisa tu correo para confirmar y luego inicia sesión.',
        companies: 'Empresas', addCompany: '+ Agregar empresa', addTitle: 'Agregar una empresa',
        companyName: 'Nombre de la empresa *', description: 'Descripción', phone: 'Teléfono',
        logoOpt: 'Logo (opcional):', saveCompany: 'Guardar empresa',

        sortRating: 'Mejor calificación', sortCount: 'Más reseñas', sortNew: 'Más recientes', sortName: 'Nombre A–Z',

        save: 'Guardar', cancel: 'Cancelar', nameRequired: 'El nombre de la empresa es obligatorio',
        logoTooBig: 'El logo es demasiado grande (máx. 2 MB)',
        confirmDelCo: '¿Eliminar esta empresa y TODAS sus reseñas? No se puede deshacer.',
        ratingsByCat: 'Calificaciones por categoría', writeReview: 'Escribir una reseña', editReview: 'Editar tu reseña',

        confirmDelRev: '¿Eliminar tu reseña?', rateAll: 'Por favor califica las 5 categorías',
        allReviews: 'Todas las reseñas', beFirst: 'Aún no hay reseñas. ¡Sé el primero!', loading: 'Cargando...', error: 'Error',

    function detectLang() {
      const saved = localStorage.getItem('lang');
      if (saved && T[saved]) return saved;
      const n = (navigator.language || 'en').slice(0, 2).toLowerCase();
      return T[n] ? n : 'en';
    }
    let lang = detectLang();
    const t_ = k => (T[lang] && T[lang][k]) || T.en[k] || k;

    const CAT_KEYS = ['punctuality', 'price', 'service', 'cleanliness', 'driving'];
    const catLabel = k => t_(k);

    let isSignup = false;
    let openId = null;
    let editingId = null;
    let draft = {};
    let myUid = null;
    let myEmail = '';
    let isAdmin = false;
    let loggedIn = false;
    let allCompanies = [];
    let stats = {};

    const $ = id => document.getElementById(id);
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const stars = v => { const n = Math.round(Number(v) || 0); return '★'.repeat(n) + '☆'.repeat(5 - n); };
    const fmtPhone = p => {
      const d = String(p ?? '').replace(/\D/g, '');
      if (d.length === 10) return d.slice(0,3) + '-' + d.slice(3,6) + '-' + d.slice(6);
      if (d.length === 11 && d[0] === '1') return d.slice(1,4) + '-' + d.slice(4,7) + '-' + d.slice(7);
      return String(p ?? '');
    };

    // ---------- Static UI text ----------
    function applyStaticText() {
      document.documentElement.lang = lang;
      $('langSel').value = lang;
      $('authTitle').textContent = isSignup ? t_('signup') : t_('login');
      $('authBtn').textContent = isSignup ? t_('signup') : t_('login');
      $('toggleBtn').textContent = isSignup ? t_('haveAccount') : t_('noAccount');
      $('fullName').placeholder = t_('fullName');
      $('email').placeholder = t_('email');
      $('password').placeholder = t_('password');
      $('showPw').textContent = $('password').type === 'password' ? t_('show') : t_('hide');
      $('tCompanies').textContent = t_('companies');
      $('addToggle').textContent = t_('addCompany');
      $('tAddTitle').textContent = t_('addTitle');
      $('cName').placeholder = t_('companyName');
      $('cDesc').placeholder = t_('description');
      $('cPhone').placeholder = t_('phone');
      $('cEmail').placeholder = t_('email');
      $('tLogoOpt').textContent = t_('logoOpt');
      $('saveCompany').textContent = t_('saveCompany');
      $('search').placeholder = t_('search');
      const opts = $('sort').options;
      opts[0].textContent = t_('sortRating');
      opts[1].textContent = t_('sortCount');
      opts[2].textContent = t_('sortNew');
      opts[3].textContent = t_('sortName');
      if (loggedIn) {
        $('userinfo').innerHTML = `${esc(myEmail)} <button id="logoutBtn">${esc(t_('logout'))}</button>`;
        $('logoutBtn').onclick = logout;
      } else {
        $('userinfo').innerHTML = '';
      }
    }

    $('langSel').onchange = () => {
      lang = $('langSel').value;
      localStorage.setItem('lang', lang);
      applyStaticText();
      if (loggedIn) renderCompanies();
    };

    async function uploadLogo(file) {
      if (!file) return null;
      if (file.size > 2 * 1024 * 1024) throw new Error(t_('logoTooBig'));
      const ext = (file.name.split('.').pop() || 'png').toLowerCase().replace(/[^a-z0-9]/g, '');
      const path = Date.now() + '-' + Math.random().toString(36).slice(2, 8) + '.' + ext;
      const { error } = await sb.storage.from('logos').upload(path, file, { contentType: file.type });
      if (error) throw error;
      return sb.storage.from('logos').getPublicUrl(path).data.publicUrl;
    }

    async function checkAdmin() {
      isAdmin = false;
      if (!myUid) return;
      try {
        const { data } = await sb.from('profiles').select('role').eq('id', myUid).maybeSingle();
        isAdmin = !!data && data.role === 'admin';
      } catch (e) { isAdmin = false; }
    }

    $('showPw').onclick = () => {
      const p = $('password');
      p.type = p.type === 'password' ? 'text' : 'password';
      $('showPw').textContent = p.type === 'password' ? t_('show') : t_('hide');
    };

    function showMsg(el, text, ok) {
      if (!el) return alert(text);
      el.textContent = text;
      el.className = 'msg ' + (ok ? 'ok' : 'err');
      el.style.display = 'block';
    }

    function setMode(signup) {
      isSignup = signup;
      $('nameWrap').classList.toggle('hidden', !signup);
      $('msg').style.display = 'none';
      applyStaticText();
    }
    $('toggleBtn').onclick = () => setMode(!isSignup);

    $('authBtn').onclick = async () => {
      const email = $('email').value.trim();
      const password = $('password').value;
      if (!email || password.length < 6) return showMsg($('msg'), t_('enterCreds'), false);
      if (isSignup) {
        const full_name = $('fullName').value.trim();
        const { data, error } = await sb.auth.signUp({ email, password, options: { data: { full_name } } });
        if (error) return showMsg($('msg'), error.message, false);
        if (data.session) showMsg($('msg'), t_('created'), true);
        else { showMsg($('msg'), t_('createdConfirm'), true); setMode(false); }
      } else {
        const { error } = await sb.auth.signInWithPassword({ email, password });
        if (error) return showMsg($('msg'), error.message, false);
      }
    };

    async function logout() { openId = null; editingId = null; await sb.auth.signOut(); }

    $('addToggle').onclick = () => $('addForm').classList.toggle('hidden');

    $('saveCompany').onclick = async () => {
      const name = $('cName').value.trim();
      if (!name) return showMsg($('addMsg'), t_('nameRequired'), false);
      const btn = $('saveCompany');
      btn.disabled = true;
      try {
        const logo_url = await uploadLogo($('cLogoFile').files[0]);
        const phoneRaw = $('cPhone').value.trim();
        const row = {
          name,
          description: $('cDesc').value.trim() || null,
          phone: phoneRaw ? fmtPhone(phoneRaw) : null,
          email: $('cEmail').value.trim() || null,
          logo_url
        };
        const { error } = await sb.from('companies').insert(row);
        if (error) throw error;
        ['cName','cDesc','cPhone','cEmail','cLogoFile'].forEach(id => $(id).value = '');
        $('addMsg').style.display = 'none';
        $('addForm').classList.add('hidden');
        loadCompanies();
      } catch (err) {
        showMsg($('addMsg'), err.message || String(err), false);
      }
      btn.disabled = false;
    };

    $('search').oninput = () => renderCompanies();
    $('sort').onchange = () => renderCompanies();

    async function loadCompanies() {
      const box = $('companies');
      const [cRes, sRes] = await Promise.all([
        sb.from('companies').select('*').order('created_at', { ascending: false }),
        sb.from('company_stats').select('*')
      ]);
      if (cRes.error) { box.innerHTML = '<div class="card">' + esc(t_('error')) + ': ' + esc(cRes.error.message) + '</div>'; return; }
      allCompanies = cRes.data;
      stats = {};
      (sRes.data || []).forEach(s => stats[s.company_id] = s);
      renderCompanies();
    }

    function renderCompanies() {
      const box = $('companies');
      const q = $('search').value.trim().toLowerCase();
      const mode = $('sort').value;
      const ov = c => stats[c.id] ? Number(stats[c.id].overall) : 0;
      const cnt = c => stats[c.id] ? stats[c.id].review_count : 0;

      let list = allCompanies.filter(c =>
        !q || (c.name || '').toLowerCase().includes(q) || (c.description || '').toLowerCase().includes(q));

      if (mode === 'rating') list.sort((a, b) => ov(b) - ov(a) || cnt(b) - cnt(a));
      else if (mode === 'count') list.sort((a, b) => cnt(b) - cnt(a));
      else if (mode === 'name') list.sort((a, b) => (a.name || '').localeCompare(b.name || ''));
      else list.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

      box.innerHTML = list.length ? list.map(c => {
        if (editingId === c.id) {
          return `
          <div class="card">
            <h4>${esc(t_('editCompany'))}</h4>
            <div id="editMsg" class="msg"></div>
            <input id="eName" type="text" value="${esc(c.name)}" placeholder="${esc(t_('companyName'))}">
            <textarea id="eDesc" rows="3" placeholder="${esc(t_('description'))}">${esc(c.description || '')}</textarea>
            <input id="ePhone" type="text" value="${esc(c.phone || '')}" placeholder="${esc(t_('phone'))}">
            <input id="eEmail" type="email" value="${esc(c.email || '')}" placeholder="${esc(t_('email'))}">
            ${c.logo_url ? `<div class="fileline">${esc(t_('currentLogo'))}</div><img class="clogo" src="${esc(c.logo_url)}" alt="">` : ''}
            <div class="fileline">${esc(c.logo_url ? t_('replaceLogo') : t_('logoOpt'))}</div>
            <input id="eLogoFile" type="file" accept="image/*">
            <button data-saveedit="${c.id}">${esc(t_('save'))}</button>
            <button class="link" data-canceledit="1">${esc(t_('cancel'))}</button>
          </div>`;
        }
        const s = stats[c.id];
        const overall = ov(c);
        const rating = s
          ? `<span class="stars big">${stars(overall)}</span><span class="num">${overall.toFixed(1)} (${s.review_count})</span>`
          : `<span class="meta">${esc(t_('noReviewsYet'))}</span>`;
        return `
          <div class="card">
            <div class="row">
              <div class="cinfo">
                ${c.logo_url ? `<img class="clogo" src="${esc(c.logo_url)}" alt="">` : ''}
                <div>
                  <div class="cname">${esc(c.name)}</div>
                  <div>${rating}</div>
                </div>
              </div>
              <div class="actions">
                <button data-open="${c.id}">${esc(openId === c.id ? t_('close') : t_('reviews'))}</button>
                ${isAdmin ? `<button class="gold" data-edco="${c.id}">${esc(t_('edit'))}</button><button class="danger" data-delco="${c.id}">${esc(t_('del'))}</button>` : ''}
              </div>
            </div>
            ${c.description ? `<div class="meta">${esc(c.description)}</div>` : ''}
            <div class="meta">${c.phone ? '📞 ' + esc(fmtPhone(c.phone)) + ' &nbsp; ' : ''}${c.email ? '✉️ ' + esc(c.email) : ''}</div>
            ${openId === c.id ? `<div class="detail" id="detail"></div>` : ''}
          </div>`;
      }).join('') : '<p>' + esc(t_('noCompanies')) + '</p>';

      if (openId) loadDetail(openId);
    }

    async function loadDetail(companyId) {
      const el = $('detail');
      if (!el) return;
      el.innerHTML = esc(t_('loading'));
      const { data, error } = await sb.from('reviews').select('*').eq('company_id', companyId).order('created_at', { ascending: false });
      if (error) { el.innerHTML = esc(t_('error')) + ': ' + esc(error.message); return; }

      const mine = data.find(r => r.user_id === myUid);
      if (!Object.keys(draft).length && mine) {
        CAT_KEYS.forEach(k => draft[k] = mine[k]);
        draft.comment = mine.comment || '';
      }

      const avgs = CAT_KEYS.map(k => {
        const a = data.length ? data.reduce((t, r) => t + r[k], 0) / data.length : 0;
        return `<div class="catrow"><span>${esc(catLabel(k))}</span><span><span class="stars">${stars(a)}</span><span class="num">${data.length ? a.toFixed(1) : '-'}</span></span></div>`;
      }).join('');

      const form = CAT_KEYS.map(k => `
        <div class="catrow"><span>${esc(catLabel(k))}</span>
          <span class="pick" data-cat="${k}">${[1,2,3,4,5].map(v => `<span class="st ${draft[k] >= v ? 'on' : ''}" data-v="${v}">★</span>`).join('')}</span>
        </div>`).join('');

      const list = data.length ? data.map(r => `
        <div class="rev">
          <span class="stars">${stars((r.punctuality + r.price + r.service + r.cleanliness + r.driving) / 5)}</span>
          <span class="meta">${new Date(r.created_at).toLocaleDateString(lang)}</span>
          ${r.comment ? `<div><b>${esc(t_('otherIssue'))}:</b> ${esc(r.comment)}</div>` : ''}
          <div class="cats">${CAT_KEYS.map(k => `${esc(catLabel(k))}: ${r[k]}★`).join(' &nbsp;|&nbsp; ')}</div>
        </div>`).join('') : `<p class="meta">${esc(t_('beFirst'))}</p>`;

      el.innerHTML = `
        <h4>${esc(t_('ratingsByCat'))}</h4>${avgs}
        <h4>${esc(mine ? t_('editReview') : t_('writeReview'))} ${esc(t_('anonymous'))}</h4>
        <div id="revMsg" class="msg"></div>
        ${form}
        <textarea id="revComment" rows="3" placeholder="${esc(t_('otherIssue'))}">${esc(draft.comment || '')}</textarea>
        <button id="submitReview" data-company="${companyId}">${esc(mine ? t_('update') : t_('submit'))}</button>
        ${mine ? `<button id="deleteReview" class="danger" data-company="${companyId}">${esc(t_('delMine'))}</button>` : ''}
        <h4>${esc(t_('allReviews'))} (${data.length})</h4>${list}`;
    }

    document.addEventListener('click', async (e) => {
      const t = e.target;
      const ds = t.dataset || {};

      if (ds.open) {
        openId = (openId === ds.open) ? null : ds.open;
        draft = {};
        renderCompanies();
        return;
      }

      if (t.classList && t.classList.contains('st')) {
        const cat = t.parentElement.dataset.cat;
        const v = Number(t.dataset.v);
        draft[cat] = v;
        t.parentElement.querySelectorAll('.st').forEach(s => s.classList.toggle('on', Number(s.dataset.v) <= v));
        return;
      }

      if (ds.delco) {
        if (!confirm(t_('confirmDelCo'))) return;
        const { error } = await sb.from('companies').delete().eq('id', ds.delco);
        if (error) { alert(error.message); return; }
        if (openId === ds.delco) openId = null;
        loadCompanies();
        return;
      }

      if (ds.edco) { editingId = ds.edco; renderCompanies(); return; }
      if (ds.canceledit) { editingId = null; renderCompanies(); return; }

      if (ds.saveedit) {
        const name = $('eName').value.trim();
        if (!name) return showMsg($('editMsg'), t_('nameRequired'), false);
        t.disabled = true;
        try {
          const ph = $('ePhone').value.trim();
          const row = {
            name,
            description: $('eDesc').value.trim() || null,
            phone: ph ? fmtPhone(ph) : null,
            email: $('eEmail').value.trim() || null
          };
          const file = $('eLogoFile').files[0];
          if (file) row.logo_url = await uploadLogo(file);
          const { error } = await sb.from('companies').update(row).eq('id', ds.saveedit);
          if (error) throw error;
          editingId = null;
          loadCompanies();
        } catch (err) {
          showMsg($('editMsg'), err.message || String(err), false);
          t.disabled = false;
        }
        return;
      }

      if (t.id === 'submitReview') {
        const msg = $('revMsg');
        if (CAT_KEYS.some(k => !draft[k])) return showMsg(msg, t_('rateAll'), false);
        const row = {
          company_id: t.dataset.company,
          user_id: myUid,
          comment: $('revComment').value.trim() || null,
          updated_at: new Date().toISOString()
        };
        CAT_KEYS.forEach(k => row[k] = draft[k]);
        const { error } = await sb.from('reviews').upsert(row, { onConflict: 'company_id,user_id' });
        if (error) return showMsg(msg, error.message, false);
        draft = {};
        loadCompanies();
        return;
      }

      if (t.id === 'deleteReview') {
        if (!confirm(t_('confirmDelRev'))) return;
        const { error } = await sb.from('reviews').delete()
          .eq('company_id', t.dataset.company).eq('user_id', myUid);
        if (error) return showMsg($('revMsg'), error.message, false);
        draft = {};
        loadCompanies();
      }
    });

    async function render(session) {
      if (session) {
        myUid = session.user.id;
        myEmail = session.user.email;
        loggedIn = true;
        $('authView').classList.add('hidden');
        $('mainView').classList.remove('hidden');
        applyStaticText();
        await checkAdmin();
        loadCompanies();
      } else {
        myUid = null;
        myEmail = '';
        loggedIn = false;
        isAdmin = false;
        $('authView').classList.remove('hidden');
        $('mainView').classList.add('hidden');
        applyStaticText();
      }
    }

    applyStaticText();
    sb.auth.onAuthStateChange((_event, session) => { render(session); });
    sb.auth.getSession().then(({ data }) => render(data.session));
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CarReviews</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M32 4 56 12v18c0 16-10 26-24 30C18 56 8 46 8 30V12z' fill='%231a3c6e'/%3E%3Cpath d='M16 36l4-9c1-2 3-3 5-3h14c2 0 4 1 5 3l4 9v8H16z' fill='%23fff'/%3E%3C/svg%3E">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root { --navy:#1a3c6e; --navy2:#12294d; --gold:#e8a317; --green:#1e8e3e; --red:#c0392b; --amber:#e8a317; --line:#e3e8ef; --soft:#f1f4f9; }
    * { box-sizing:border-box; }
    body {
      font-family: -apple-system, "Segoe UI", Arial, sans-serif; max-width: 940px; margin: 0 auto; padding: 0 16px 60px; color:#1f2a37;
      background:
        radial-gradient(circle at 0% 0%, #cfe0fb 0, transparent 42%),
        radial-gradient(circle at 100% 18%, #ffe6b8 0, transparent 38%),
        radial-gradient(circle at 50% 100%, #d9f0e3 0, transparent 40%),
        linear-gradient(#f4f7fc, #eaf0f9);
      background-attachment: fixed; min-height:100vh;
    }
    svg.ic { width:1em; height:1em; vertical-align:-0.15em; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; flex:none; }
    button svg, .chip svg { pointer-events:none; }

    /* top bar */
    .topbar { display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; background:linear-gradient(90deg,var(--navy2),var(--navy)); color:#fff; padding:8px 14px; border-radius:0 0 14px 14px; box-shadow:0 4px 14px rgba(18,41,77,.25); }
    .topbar select { background:#fff; }
    #userbar { display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-size:14px; }
    #langSel { width:auto; margin:0; padding:6px 8px; }
    #calBtn { background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.35); font-size:15px; padding:7px 14px; }

    /* logo */
    .hero { display:flex; justify-content:center; margin:18px 0 6px; }
    .logoCard { background:#fff; border-radius:20px; padding:8px 14px; box-shadow:0 10px 30px rgba(18,41,77,.15); border-top:5px solid var(--gold); width:100%; }
    .logoBox { width:100%; height:280px; overflow:hidden; display:flex; justify-content:center; }
    .logoBox img { display:block; height:350px; width:auto; max-width:none; margin-top:-38px; mix-blend-mode:multiply; }
    @media (max-width:560px) { .logoBox { height:190px; } .logoBox img { height:238px; margin-top:-26px; } }

    .card { background:#fff; border:1px solid var(--line); border-radius:14px; padding:16px; margin:12px 0; box-shadow:0 2px 8px rgba(16,24,40,.06); }
    .card.co { border-inline-start:5px solid var(--navy); }
    .box { max-width:400px; margin:10px auto 30px; }
    input, textarea, select { width:100%; padding:10px 12px; margin:6px 0; border:1px solid #cdd5df; border-radius:8px; font-family:inherit; font-size:14px; background:#fff; }
    input:focus, textarea:focus, select:focus { outline:2px solid #c7d6ee; border-color:var(--navy); }
    textarea { resize:vertical; max-width:100%; min-height:70px; }
    .pwwrap { position:relative; }
    .pwwrap input { padding-inline-end:84px; }
    .pwwrap button { position:absolute; inset-inline-end:6px; top:11px; padding:4px 10px; font-size:12px; background:#e6ebf3; color:var(--navy); }

    button { padding:9px 16px; border:0; border-radius:8px; background:var(--navy); color:#fff; cursor:pointer; font-size:14px; font-weight:600; display:inline-flex; align-items:center; gap:6px; font-family:inherit; }
    button:hover { filter:brightness(1.12); }
    button:disabled { opacity:.6; cursor:default; }
    button.link { background:none; color:var(--navy); text-decoration:underline; padding:4px; font-weight:500; }
    button.gold { background:var(--gold); }
    button.danger { background:var(--red); }
    button.ghost { background:#fff; color:var(--navy); border:1px solid #cdd5df; }
    button.small { padding:4px 10px; font-size:12px; margin-top:6px; }

    .msg { padding:8px 12px; border-radius:8px; margin:8px 0; display:none; }
    .err { background:#fde8e8; color:#a00; }
    .ok  { background:#e6f7e9; color:#0a6a22; }
    .banner { background:#fde8e8; color:#a00; border:1px solid #f3b9b9; border-radius:10px; padding:10px 14px; margin:10px 0; font-weight:600; }
    .hidden { display:none !important; }
    .row { display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; }
    .toolbar { margin:10px 0 4px; }
    .toolbar .btns { display:flex; gap:8px; flex-wrap:wrap; }
    h2 { margin:10px 0; color:var(--navy); }
    h4 { margin:0 0 8px; color:var(--navy); font-size:15px; display:flex; align-items:center; gap:8px; }
    .fileline { font-size:13px; color:#555; margin:6px 0 2px; }

    .filters { display:flex; gap:10px; margin:6px 0; flex-wrap:wrap; }
    .filters .sw { position:relative; flex:2 1 220px; }
    .filters .sw svg { position:absolute; inset-inline-start:12px; top:19px; color:#8896a8; }
    .filters .sw input { padding-inline-start:36px; margin:6px 0; }
    .filters select { flex:1 1 150px; }

    .chead { display:flex; justify-content:space-between; gap:12px; align-items:flex-start; }
    .cinfo { display:flex; align-items:center; gap:12px; min-width:0; }
    .clogo { width:56px; height:56px; object-fit:contain; border-radius:10px; border:1px solid #eee; background:#fff; }
    .cname { font-weight:700; color:var(--navy); font-size:19px; }
    .meta { color:#5b6776; font-size:14px; margin-top:4px; }
    .contact { display:flex; flex-wrap:wrap; gap:6px 16px; color:#5b6776; font-size:14px; margin-top:8px; }
    .contact span { display:inline-flex; align-items:center; gap:6px; }
    .score { text-align:center; min-width:84px; }
    .score .big { font-size:30px; font-weight:800; line-height:1; }
    .score .cnt { font-size:12px; color:#5b6776; margin-top:2px; }
    .good { color:var(--green); } .mid { color:#c98a00; } .bad { color:var(--red); }
    .bg-good { background:var(--green); } .bg-mid { background:var(--amber); } .bg-bad { background:var(--red); }
    .stars { color:var(--gold); letter-spacing:1px; font-size:15px; }
    .pill { display:inline-flex; align-items:center; gap:6px; padding:4px 10px; border-radius:999px; font-size:13px; font-weight:600; background:#e6f4ea; color:var(--green); margin-top:8px; }
    .pill.low { background:#fde8e8; color:var(--red); }
    .actions { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }

    .detail { margin-top:14px; border-top:1px solid var(--line); padding-top:14px; }
    .dtop { display:flex; justify-content:flex-end; margin-bottom:8px; }
    .sect { background:var(--soft); border-radius:12px; padding:14px; margin:12px 0; }
    .sect.white { background:#fff; border:1px solid var(--line); }
    .cols { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
    @media (max-width:640px) { .cols { grid-template-columns:1fr; } .chead { flex-direction:column; } }
    .grp { font-weight:700; color:var(--navy); font-size:13px; text-transform:uppercase; letter-spacing:.5px; margin:0 0 8px; display:flex; align-items:center; gap:8px; }
    .bar { display:grid; grid-template-columns:22px 1fr 110px 34px; align-items:center; gap:8px; padding:5px 0; font-size:14px; }
    .bar .track { height:8px; background:#dfe5ee; border-radius:6px; overflow:hidden; }
    .bar .fill { height:100%; border-radius:6px; }
    .bar .val { font-weight:700; text-align:end; }
    @media (max-width:640px) { .bar { grid-template-columns:22px 1fr 80px 30px; } }

    .catrow { display:flex; justify-content:space-between; align-items:center; padding:4px 0; gap:8px; font-size:14px; }
    .catrow .lbl { display:flex; align-items:center; gap:8px; }
    .pick { direction:ltr; }
    .pick .st { cursor:pointer; font-size:28px; color:#cfd6df; padding:0 2px; user-select:none; }
    .pick .st.on { color:var(--gold); }
    .opt { font-size:12px; color:#7a8798; font-weight:400; }

    .chips { display:flex; flex-wrap:wrap; gap:6px; margin:6px 0; }
    .chip { padding:6px 12px; border-radius:16px; font-size:13px; background:#fff; border:1px solid #9aa5b3; color:#555; cursor:pointer; font-weight:500; display:inline-flex; align-items:center; gap:5px; }
    .chip.pos { border-color:var(--green); color:var(--green); }
    .chip.neg { border-color:var(--red); color:var(--red); }
    .chip.pos.on { background:var(--green); color:#fff; }
    .chip.neg.on { background:var(--red); color:#fff; }
    .chip.static { cursor:default; padding:3px 10px; }
    .recbtns { display:flex; gap:8px; margin:6px 0; }
    .recbtn { background:#fff; color:#555; border:1px solid #9aa5b3; }
    .recbtn.yes.on { background:var(--green); color:#fff; border-color:var(--green); }
    .recbtn.no.on { background:var(--red); color:#fff; border-color:var(--red); }
    .two { display:flex; gap:10px; flex-wrap:wrap; }
    .two > * { flex:1 1 150px; }
    .heb { color:var(--navy); font-weight:600; font-size:13px; min-height:18px; margin-top:4px; }

    .rev { background:#fff; border:1px solid var(--line); border-radius:10px; padding:12px; margin:8px 0; }
    .rev .rh { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
    .badge { color:#fff; font-weight:800; border-radius:8px; padding:4px 10px; font-size:15px; }
    .rev .mini { display:flex; flex-wrap:wrap; gap:4px 14px; font-size:13px; color:#5b6776; margin-top:8px; }
    .rev .mini b { color:#1f2a37; }
    .rev .mini span { display:inline-flex; align-items:center; gap:5px; }
    .yn { font-weight:700; font-size:13px; display:inline-flex; align-items:center; gap:4px; }
    .author { background:#fff7e0; border:1px dashed var(--gold); border-radius:8px; padding:6px 10px; margin-top:8px; font-size:13px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
    .tagban { background:var(--red); color:#fff; border-radius:6px; padding:1px 8px; font-size:12px; font-weight:700; }

    .urow { display:flex; justify-content:space-between; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--line); flex-wrap:wrap; }
    .urow:last-child { border-bottom:0; }

    #toast { position:fixed; top:16px; left:50%; transform:translateX(-50%); background:var(--green); color:#fff; padding:10px 18px; border-radius:10px; font-weight:600; box-shadow:0 6px 18px rgba(0,0,0,.2); display:none; z-index:80; align-items:center; gap:8px; }

    /* calendar */
    #calModal { position:fixed; inset:0; background:rgba(10,20,40,.55); display:none; align-items:center; justify-content:center; z-index:70; padding:12px; }
    .calBox { background:#fff; border-radius:16px; padding:16px; width:min(420px,100%); box-shadow:0 20px 50px rgba(0,0,0,.35); }
    .calHead { display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:6px; }
    .calTitle { text-align:center; flex:1; }
    .calTitle b { display:block; font-size:19px; color:var(--navy); }
    .calTitle small { color:#5b6776; }
    .calGrid { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; direction:rtl; margin-top:8px; }
    .cw { text-align:center; font-weight:700; color:var(--navy); font-size:13px; padding:4px 0; }
    .cd { text-align:center; border-radius:8px; padding:6px 0; background:var(--soft); }
    .cd b { display:block; font-size:16px; color:#1f2a37; }
    .cd small { color:#7a8798; font-size:11px; }
    .cd.sat { background:#e8eefb; }
    .cd.sat b { color:var(--navy); }
    .cd.today { background:var(--gold); }
    .cd.today b, .cd.today small { color:#fff; }
    .cd.blank { background:none; }
    .cd[data-day] { cursor:pointer; }
    .cd[data-day]:hover { background:#dbe6fb; }
    .cd.fut { opacity:.35; }
  </style>
</head>
<body>
  <div id="toast"></div>

  <div id="calModal">
    <div class="calBox">
      <div class="calHead">
        <button class="ghost small" data-cal="next" style="margin:0">&#9654;</button>
        <div class="calTitle"><b id="calTitle"></b><small id="calSub"></small></div>
        <button class="ghost small" data-cal="prev" style="margin:0">&#9664;</button>
      </div>
      <div id="calBody"></div>
      <div class="row" style="margin-top:12px">
        <button class="ghost small" data-cal="today" id="calTodayBtn"></button>
        <button class="small" data-cal="close" id="calCloseBtn"></button>
      </div>
    </div>
  </div>

  <div class="topbar">
    <button id="calBtn" type="button"></button>
    <div id="userbar">

        <option value="ru">Русский</option>
        <option value="es">Español</option>
      </select>
      <span id="userinfo"></span>
    </div>
  </div>

  <div class="hero"><div class="logoCard"><div class="logoBox"><img src="logo.png" alt="CarReviews"></div></div></div>

  <div id="authView">

      <h2 id="authTitle"></h2>
      <div id="msg" class="msg"></div>
      <div id="nameWrap" class="hidden"><input id="fullName" type="text"></div>

      <button id="authBtn"></button>
      <p><button id="toggleBtn" class="link"></button></p>

    function detectLang() {
      const saved = localStorage.getItem('lang');
      if (saved && T[saved]) return saved;
      const n = (navigator.language || 'en').slice(0, 2).toLowerCase();
      return T[n] ? n : 'en';
    }
    let lang = detectLang();
    const t_ = k => (T[lang] && T[lang][k]) || T.en[k] || k;
    const dl = () => lang === 'yi' ? 'he' : lang;   // locale for dates

    const REQ_KEYS = ['punctuality', 'price', 'service', 'cleanliness', 'driving'];
    const GROUPS = [
      ['grpOffice', 'office', ['punctuality', 'price', 'service']],
      ['grpDriver', 'car', ['driver_service', 'cleanliness', 'driving']]
    ];
    const ALL_KEYS = ['punctuality', 'price', 'service', 'driver_service', 'cleanliness', 'driving'];
    const POS_TAGS = ['on_time', 'polite', 'clean', 'fair_price', 'safe', 'great_service'];
    const NEG_TAGS = ['late', 'rude', 'dirty', 'overcharged', 'unsafe', 'no_answer'];
    const TODS = ['morning', 'afternoon', 'evening', 'night'];
    const isPos = k => POS_TAGS.includes(k);

    let isSignup = false, openId = null, editingId = null, draft = {};
    let myUid = null, myEmail = '', isAdmin = false, isBanned = false, loggedIn = false;
    let allCompanies = [], stats = {}, recStats = {}, myReviewId = null;
    let userMap = {}, usersOpen = false;

    const $ = id => document.getElementById(id);
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const stars = v => { const n = Math.round(Number(v) || 0); return '★'.repeat(n) + '☆'.repeat(5 - n); };
    const tone = v => v >= 4 ? 'good' : v >= 3 ? 'mid' : 'bad';
    const fmtPhone = p => {
      const d = String(p ?? '').replace(/\D/g, '');
      if (d.length === 10) return d.slice(0,3) + '-' + d.slice(3,6) + '-' + d.slice(6);
      if (d.length === 11 && d[0] === '1') return d.slice(1,4) + '-' + d.slice(4,7) + '-' + d.slice(7);
      return String(p ?? '');
    };

    // ---------- Jewish calendar (Intl, no libraries) ----------
    const hf = (d, o) => { try { return new Intl.DateTimeFormat('he-u-ca-hebrew', o).format(d); } catch (e) { return ''; } };
    const hDay = d => {
      try { return Number(new Intl.DateTimeFormat('en-u-ca-hebrew', { day: 'numeric' }).formatToParts(d).find(x => x.type === 'day').value); }
      catch (e) { return 1; }
    };
    const hMonth = d => hf(d, { month: 'long', year: 'numeric' });
    const hebFull = d => hf(d, { day: 'numeric', month: 'long', year: 'numeric' });
    const hebFromStr = s => s ? hebFull(new Date(s + 'T12:00:00')) : '';
    const noon = d => { const x = new Date(d); x.setHours(12, 0, 0, 0); return x; };
    const isoOf = x => x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0') + '-' + String(x.getDate()).padStart(2, '0');

    let calAnchor = noon(new Date()), calFirst = null, calLast = null;
    let pickMode = false;

    function renderCal() {
      const a = noon(calAnchor);
      const first = new Date(a); first.setDate(a.getDate() - (hDay(a) - 1));
      const label = hMonth(first);
      const days = [];
      const d = new Date(first);
      while (hMonth(d) === label && days.length < 31) { days.push(new Date(d)); d.setDate(d.getDate() + 1); }
      calFirst = first; calLast = days[days.length - 1];
      const todayStr = new Date().toDateString();
      const now = new Date();
      const wk = ['א׳','ב׳','ג׳','ד׳','ה׳','ו׳','שבת'];
      let html = wk.map(w => `<div class="cw">${w}</div>`).join('');
      for (let i = 0; i < first.getDay(); i++) html += '<div class="cd blank"></div>';
      days.forEach(x => {
        const future = x > now && x.toDateString() !== todayStr;
        html += `<div class="cd ${x.getDay() === 6 ? 'sat' : ''} ${x.toDateString() === todayStr ? 'today' : ''} ${pickMode && future ? 'fut' : ''}" ${pickMode && !future ? `data-day="${isoOf(x)}"` : ''}>
          <b>${esc(hf(x, { day: 'numeric' }))}</b><small>${x.getDate()}</small></div>`;
      });
      $('calBody').innerHTML = `<div class="calGrid">${html}</div>`;
      $('calTitle').textContent = label;
      const o = { month: 'short', year: 'numeric' };
      $('calSub').textContent = calFirst.toLocaleDateString(dl(), o) + ' – ' + calLast.toLocaleDateString(dl(), o);
    }
    function openCal() { pickMode = false; calAnchor = noon(new Date()); renderCal(); $('calModal').style.display = 'flex'; }
    function openPick() {
      pickMode = true;
      const v = $('revDate') && $('revDate').value;
      calAnchor = v ? noon(new Date(v + 'T12:00:00')) : noon(new Date());
      renderCal();
      $('calModal').style.display = 'flex';
    }

    let toastTimer;
    function toast(text) {
      const el = $('toast');
      el.innerHTML = ic('check') + esc(text);
      el.style.display = 'flex';

    }

    async function uploadLogo(file) {
      if (!file) return null;
      if (file.size > 2 * 1024 * 1024) throw new Error(t_('logoTooBig'));
      const ext = (file.name.split('.').pop() || 'png').toLowerCase().replace(/[^a-z0-9]/g, '');
      const path = Date.now() + '-' + Math.random().toString(36).slice(2, 8) + '.' + ext;
      const { error } = await sb.storage.from('logos').upload(path, file, { contentType: file.type });
      if (error) throw error;
      return sb.storage.from('logos').getPublicUrl(path).data.publicUrl;
    }

    async function checkAdmin() {
      isAdmin = false;
      if (!myUid) return;
      try {
        const { data } = await sb.from('profiles').select('role').eq('id', myUid).maybeSingle();
        isAdmin = !!data && data.role === 'admin';
      } catch (e) { isAdmin = false; }
    }
    async function checkBanned() {
      isBanned = false;
      if (!myUid) return;
      try {
        const { data } = await sb.from('banned_users').select('user_id').eq('user_id', myUid).maybeSingle();
        isBanned = !!data;
      } catch (e) { isBanned = false; }
    }

    $('showPw').onclick = () => {
      const p = $('password');
      p.type = p.type === 'password' ? 'text' : 'password';
      $('showPw').textContent = p.type === 'password' ? t_('show') : t_('hide');
    };

    function showMsg(el, text, ok) {
      if (!el) return alert(text);
      el.textContent = text;
      el.className = 'msg ' + (ok ? 'ok' : 'err');
      el.style.display = 'block';
      try { el.scrollIntoView({ behavior: 'smooth', block: 'center' }); } catch (e) {}
    }

    function setMode(signup) {
      isSignup = signup;
      $('nameWrap').classList.toggle('hidden', !signup);
      $('msg').style.display = 'none';
      applyStaticText();
    }
    $('toggleBtn').onclick = () => setMode(!isSignup);

    $('authBtn').onclick = async () => {
      const email = $('email').value.trim();
      const password = $('password').value;
      if (!email || password.length < 6) return showMsg($('msg'), t_('enterCreds'), false);
      if (isSignup) {
        const full_name = $('fullName').value.trim();
        const { data, error } = await sb.auth.signUp({ email, password, options: { data: { full_name } } });
        if (error) return showMsg($('msg'), error.message, false);
        if (data.session) showMsg($('msg'), t_('created'), true);
        else { showMsg($('msg'), t_('createdConfirm'), true); setMode(false); }
      } else {
        const { error } = await sb.auth.signInWithPassword({ email, password });
        if (error) return showMsg($('msg'), error.message, false);
      }
    };

    async function logout() { openId = null; editingId = null; await sb.auth.signOut(); }

    $('addToggle').onclick = () => $('addForm').classList.toggle('hidden');
    $('usersToggle').onclick = () => { usersOpen = !usersOpen; renderUsers(); };

    $('saveCompany').onclick = async () => {
      const name = $('cName').value.trim();
      if (!name) return showMsg($('addMsg'), t_('nameRequired'), false);
      const btn = $('saveCompany');
      btn.disabled = true;
      try {
        const logo_url = await uploadLogo($('cLogoFile').files[0]);
        const phoneRaw = $('cPhone').value.trim();
        const row = {
          name,
          city: $('cCity').value.trim() || null,
          description: $('cDesc').value.trim() || null,
          phone: phoneRaw ? fmtPhone(phoneRaw) : null,
          email: $('cEmail').value.trim() || null,
          logo_url
        };
        const { error } = await sb.from('companies').insert(row);
        if (error) throw error;
        ['cName','cCity','cDesc','cPhone','cEmail','cLogoFile'].forEach(id => $(id).value = '');
        $('addMsg').style.display = 'none';
        $('addForm').classList.add('hidden');
        loadCompanies();
      } catch (err) {
        showMsg($('addMsg'), err.message || String(err), false);

    };

    $('sort').onchange = () => renderCompanies();
    $('cityFilter').onchange = () => renderCompanies();

    async function loadUsers() {
      userMap = {};

      const { data, error } = await sb.rpc('admin_users');
      if (!error && data) data.forEach(u => userMap[u.id] = u);
    }

    function renderUsers() {
      const box = $('usersPanel');
      box.classList.toggle('hidden', !(isAdmin && usersOpen));
      if (!(isAdmin && usersOpen)) return;
      const list = Object.values(userMap);
      box.innerHTML = `<div class="row"><h4>${ic('users')} ${esc(t_('usersTitle'))} (${list.length})</h4><button class="ghost small" style="margin:0" data-usersclose="1">${ic('x')} ${esc(t_('close'))}</button></div>` +
        (list.length ? list.map(u => `
          <div class="urow">
            <div>${ic('user')} <b>${esc(u.full_name || '—')}</b> <span class="meta">${esc(u.email)}</span>
              ${u.banned ? `<span class="tagban">${esc(t_('banned'))}</span>` : ''}</div>
            ${u.id === myUid ? '' : (u.banned
              ? `<button class="ghost small" data-unban="${u.id}">${esc(t_('unban'))}</button>`
              : `<button class="danger small" data-ban="${u.id}">${ic('ban')} ${esc(t_('ban'))}</button>`)}
          </div>`).join('') : `<p class="meta">${esc(t_('noUsers'))}</p>`);
    }

    async function loadCompanies() {
      const box = $('companies');
      const [cRes, sRes, rRes] = await Promise.all([
        sb.from('companies').select('*').order('created_at', { ascending: false }),
        sb.from('company_stats').select('*'),
        sb.from('company_recommend').select('*'),
        loadUsers()
      ]);
      if (cRes.error) { box.innerHTML = '<div class="card">' + esc(t_('error')) + ': ' + esc(cRes.error.message) + '</div>'; return; }
      allCompanies = cRes.data;
      stats = {}; (sRes.data || []).forEach(s => stats[s.company_id] = s);
      recStats = {}; (rRes.data || []).forEach(s => recStats[s.company_id] = s);
      renderUsers();
      renderCompanies();
    }

    function renderCompanies() {
      const box = $('companies');
      const q = $('search').value.trim().toLowerCase();
      const mode = $('sort').value;
      const ov = c => stats[c.id] ? Number(stats[c.id].overall) : 0;
      const cnt = c => stats[c.id] ? stats[c.id].review_count : 0;

      const cities = [...new Set(allCompanies.map(c => (c.city || '').trim()).filter(Boolean))].sort((a, b) => a.localeCompare(b));
      const citySel = $('cityFilter');
      const curCity = citySel.value;
      citySel.innerHTML = `<option value="">${esc(t_('allCities'))}</option>` + cities.map(c => `<option value="${esc(c)}">${esc(c)}</option>`).join('');
      citySel.value = cities.includes(curCity) ? curCity : '';
      const cityQ = citySel.value;

      let list = allCompanies.filter(c =>
        (!q || (c.name || '').toLowerCase().includes(q) || (c.description || '').toLowerCase().includes(q) || (c.city || '').toLowerCase().includes(q)) &&
        (!cityQ || (c.city || '').trim() === cityQ));

      if (mode === 'rating') list.sort((a, b) => ov(b) - ov(a) || cnt(b) - cnt(a));
      else if (mode === 'count') list.sort((a, b) => cnt(b) - cnt(a));
      else if (mode === 'name') list.sort((a, b) => (a.name || '').localeCompare(b.name || ''));
      else list.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

      box.innerHTML = list.length ? list.map(c => {
        if (editingId === c.id) {
          return `
          <div class="card">
            <h4>${esc(t_('editCompany'))}</h4>
            <div id="editMsg" class="msg"></div>
            <input id="eName" type="text" value="${esc(c.name)}" placeholder="${esc(t_('companyName'))}">
            <input id="eCity" type="text" value="${esc(c.city || '')}" placeholder="${esc(t_('cityPh'))}">
            <textarea id="eDesc" rows="3" placeholder="${esc(t_('description'))}">${esc(c.description || '')}</textarea>
            <input id="ePhone" type="text" value="${esc(c.phone || '')}" placeholder="${esc(t_('phone'))}">
            <input id="eEmail" type="email" value="${esc(c.email || '')}" placeholder="${esc(t_('email'))}">
            ${c.logo_url ? `<div class="fileline">${esc(t_('currentLogo'))}</div><img class="clogo" src="${esc(c.logo_url)}" alt="">` : ''}
            <div class="fileline">${esc(c.logo_url ? t_('replaceLogo') : t_('logoOpt'))}</div>
            <input id="eLogoFile" type="file" accept="image/*">
            <button data-saveedit="${c.id}">${esc(t_('save'))}</button>
            <button class="link" data-canceledit="1">${esc(t_('cancel'))}</button>
          </div>`;
        }
        const s = stats[c.id], rc = recStats[c.id], overall = ov(c);
        const recPill = rc && rc.rec_votes > 0
          ? `<div class="pill ${Number(rc.rec_pct) < 50 ? 'low' : ''}">${ic(Number(rc.rec_pct) < 50 ? 'down' : 'up')} ${Number(rc.rec_pct)}% ${esc(t_('recommendWord'))} (${rc.rec_votes})</div>` : '';
        const scoreBox = s
          ? `<div class="score"><div class="big ${tone(overall)}">${overall.toFixed(1)}</div><div class="stars">${stars(overall)}</div><div class="cnt">${s.review_count} ${esc(t_('reviews'))}</div></div>`
          : `<div class="score"><div class="meta">${esc(t_('noReviewsYet'))}</div></div>`;
        return `
          <div class="card co" id="co-${c.id}">
            <div class="chead">
              <div class="cinfo">
                ${c.logo_url ? `<img class="clogo" src="${esc(c.logo_url)}" alt="">` : ''}
                <div>
                  <div class="cname">${esc(c.name)}</div>
                  ${c.description ? `<div class="meta">${esc(c.description)}</div>` : ''}
                  ${recPill}
                </div>
              </div>
              ${scoreBox}
            </div>
            <div class="contact">
              ${c.city ? `<span>${ic('pin')}${esc(c.city)}</span>` : ''}
              ${c.phone ? `<span>${ic('phone')}${esc(fmtPhone(c.phone))}</span>` : ''}
              ${c.email ? `<span>${ic('mail')}${esc(c.email)}</span>` : ''}
            </div>
            <div class="actions">
              <button data-open="${c.id}">${esc(openId === c.id ? t_('close') : t_('reviews'))}</button>
              ${isAdmin ? `<button class="gold" data-edco="${c.id}">${esc(t_('edit'))}</button><button class="danger" data-delco="${c.id}">${esc(t_('del'))}</button>` : ''}
            </div>
            ${openId === c.id ? `<div class="detail" id="detail"></div>` : ''}
          </div>`;
      }).join('') : '<p>' + esc(t_('noCompanies')) + '</p>';

      if (openId) loadDetail(openId);
    }

    function barRow(k, a, n) {
      const has = n > 0;
      const w = has ? Math.round(a / 5 * 100) : 0;
      return `<div class="bar"><span class="${has ? tone(a) : ''}">${ic(KEY_ICON[k])}</span><span>${esc(t_(k))}</span>
        <span class="track"><span class="fill bg-${has ? tone(a) : 'mid'}" style="display:block;width:${w}%"></span></span>
        <span class="val ${has ? tone(a) : ''}">${has ? a.toFixed(1) : '-'}</span></div>`;
    }

    async function loadDetail(companyId) {
      const el = $('detail');
      if (!el) return;
      el.innerHTML = esc(t_('loading'));
      const { data, error } = await sb.from('reviews').select('*').eq('company_id', companyId).order('created_at', { ascending: false });
      if (error) { el.innerHTML = esc(t_('error')) + ': ' + esc(error.message); return; }

      const mine = data.find(r => r.user_id === myUid);
      myReviewId = mine ? mine.id : null;
      if (!Object.keys(draft).length && mine) {
        ALL_KEYS.forEach(k => draft[k] = mine[k]);
        draft.comment = mine.comment || '';
        draft.rec = mine.recommend;
        draft.tags = Array.isArray(mine.tags) ? mine.tags.slice() : [];
        draft.trip_date = mine.trip_date || '';
        draft.tod = mine.time_of_day || '';
      }
      const dTags = draft.tags || [];

      const avgOf = k => {
        const vals = data.map(r => r[k]).filter(v => v !== null && v !== undefined);
        return { a: vals.length ? vals.reduce((x, y) => x + y, 0) / vals.length : 0, n: vals.length };
      };
      const overview = `<div class="cols">${GROUPS.map(([g, gi, keys]) => `
        <div><div class="grp">${ic(gi)} ${esc(t_(g))}</div>${keys.map(k => { const r = avgOf(k); return barRow(k, r.a, r.n); }).join('')}</div>`).join('')}</div>`;

      const counts = {};
      data.forEach(r => (r.tags || []).forEach(tg => counts[tg] = (counts[tg] || 0) + 1));
      const tagKeys = Object.keys(counts).sort((a, b) => counts[b] - counts[a]);
      const tagSummary = tagKeys.length
        ? `<div class="sect"><h4>${ic('chat')} ${esc(t_('saidTags'))}</h4><div class="chips">${tagKeys.map(k =>
            `<span class="chip static ${isPos(k) ? 'pos on' : 'neg on'}">${esc(t_('tag_' + k))} · ${counts[k]}</span>`).join('')}</div></div>` : '';

      const form = `<div class="cols">${GROUPS.map(([g, gi, keys]) => `
        <div><div class="grp">${ic(gi)} ${esc(t_(g))}</div>
        ${keys.map(k => `
          <div class="catrow"><span class="lbl">${ic(KEY_ICON[k])} ${esc(t_(k))}${REQ_KEYS.includes(k) ? '' : ` <span class="opt">(${esc(t_('optional'))})</span>`}</span>
            <span class="pick" data-cat="${k}">${[1,2,3,4,5].map(v => `<span class="st ${draft[k] >= v ? 'on' : ''}" data-v="${v}">★</span>`).join('')}</span>
          </div>`).join('')}</div>`).join('')}</div>`;

      const recForm = `
        <h4 style="margin-top:14px">${esc(t_('recommendQ'))}</h4>
        <div class="recbtns">
          <button type="button" class="recbtn yes ${draft.rec === true ? 'on' : ''}" data-rec="1">${ic('up')} ${esc(t_('yes'))}</button>
          <button type="button" class="recbtn no ${draft.rec === false ? 'on' : ''}" data-rec="0">${ic('down')} ${esc(t_('no'))}</button>
        </div>`;

      const tagForm = `
        <h4 style="margin-top:14px">${esc(t_('tagsTitle'))} <span class="opt">(${esc(t_('optional'))})</span></h4>
        <div class="chips">
          ${POS_TAGS.map(k => `<button type="button" class="chip pos ${dTags.includes(k) ? 'on' : ''}" data-tag="${k}">${esc(t_('tag_' + k))}</button>`).join('')}
          ${NEG_TAGS.map(k => `<button type="button" class="chip neg ${dTags.includes(k) ? 'on' : ''}" data-tag="${k}">${esc(t_('tag_' + k))}</button>`).join('')}
        </div>`;

      const today = new Date().toISOString().slice(0, 10);
      const tripForm = `
        <h4 style="margin-top:14px">${ic('cal')} ${esc(t_('tripWhen'))} <span class="opt">(${esc(t_('optional'))})</span></h4>
        <div class="two">
          <input id="revDate" type="date" max="${today}" value="${esc(draft.trip_date || '')}">
          <select id="revTod">
            <option value="">${esc(t_('todPh'))}</option>
            ${TODS.map(k => `<option value="${k}" ${draft.tod === k ? 'selected' : ''}>${esc(t_('tod_' + k))}</option>`).join('')}
          </select>
        </div>
        <button type="button" class="ghost small" data-pickdate="1">${ic('cal')} ${esc(t_('pickJewish'))}</button>
        <div class="heb" id="revHeb">${esc(hebFromStr(draft.trip_date))}</div>`;

      const list = data.length ? data.map(r => {
        const core = (r.punctuality + r.price + r.service + r.cleanliness + r.driving) / 5;
        const rtags = (r.tags || []).map(k => `<span class="chip static ${isPos(k) ? 'pos on' : 'neg on'}">${esc(t_('tag_' + k))}</span>`).join('');
        const tripBits = [];
        if (r.trip_date) { tripBits.push(new Date(r.trip_date + 'T12:00:00').toLocaleDateString(dl())); tripBits.push(hebFromStr(r.trip_date)); }
        if (r.time_of_day && TODS.includes(r.time_of_day)) tripBits.push(t_('tod_' + r.time_of_day));
        const recBadge = r.recommend === true ? `<span class="yn good">${ic('up')} ${esc(t_('yes'))}</span>`
                       : r.recommend === false ? `<span class="yn bad">${ic('down')} ${esc(t_('no'))}</span>` : '';
        const mini = ALL_KEYS.filter(k => r[k] !== null && r[k] !== undefined)
          .map(k => `<span>${ic(KEY_ICON[k])} ${esc(t_(k))} <b>${r[k]}</b></span>`).join('');
        let author = '';
        if (isAdmin) {
          const u = userMap[r.user_id];
          const who = u ? `<b>${esc(u.full_name || '—')}</b> <span class="meta" style="margin:0">${esc(u.email)}</span>` : `<span class="meta" style="margin:0">${esc(String(r.user_id).slice(0, 8))}</span>`;
          const isB = u && u.banned;
          author = `<div class="author">${ic('user')} ${esc(t_('by'))}: ${who}
            ${isB ? `<span class="tagban">${esc(t_('banned'))}</span>` : ''}
            ${r.user_id !== myUid ? (isB
              ? `<button class="ghost small" style="margin:0" data-unban="${r.user_id}">${esc(t_('unban'))}</button>`
              : `<button class="danger small" style="margin:0" data-ban="${r.user_id}">${ic('ban')} ${esc(t_('ban'))}</button>`) : ''}
          </div>`;
        }
        return `
        <div class="rev">
          <div class="rh">
            <span class="badge bg-${tone(core)}">${core.toFixed(1)}</span>
            <span class="stars">${stars(core)}</span>
            ${recBadge}
            <span class="meta" style="margin:0; margin-inline-start:auto">${new Date(r.created_at).toLocaleDateString(dl())}</span>
          </div>
          ${tripBits.length ? `<div class="meta">${ic('cal')} ${esc(t_('trip'))}: ${esc(tripBits.join(' · '))}</div>` : ''}
          ${rtags ? `<div class="chips">${rtags}</div>` : ''}
          ${r.comment ? `<div style="margin-top:6px"><b>${esc(t_('otherIssue'))}:</b> ${esc(r.comment)}</div>` : ''}
          <div class="mini">${mini}</div>
          ${author}
          ${isAdmin && r.user_id !== myUid ? `<button class="danger small" data-delrev="${r.id}">${esc(t_('del'))}</button>` : ''}
        </div>`;
      }).join('') : `<p class="meta">${esc(t_('beFirst'))}</p>`;

      const writeBlock = isBanned
        ? `<div class="banner">${esc(t_('bannedMsg'))}</div>`
        : `<div class="sect white">
            <h4>${esc(mine ? t_('editReview') : t_('writeReview'))} ${esc(t_('anonymous'))}</h4>
            <div id="revMsg" class="msg"></div>
            ${form}${recForm}${tagForm}${tripForm}
            <textarea id="revComment" rows="3" placeholder="${esc(t_('otherIssue'))}">${esc(draft.comment || '')}</textarea>
            <button id="submitReview" data-company="${companyId}">${ic('check')} ${esc(mine ? t_('update') : t_('submit'))}</button>
            ${mine ? `<button id="deleteReview" class="danger" data-company="${companyId}">${esc(t_('delMine'))}</button>` : ''}
          </div>`;

      el.innerHTML = `
        <div class="dtop"><button class="ghost small" data-open="${companyId}">${ic('x')} ${esc(t_('close'))}</button></div>
        <div class="sect"><h4>${esc(t_('ratingsByCat'))}</h4>${overview}</div>
        ${tagSummary}
        ${writeBlock}
        <h4>${esc(t_('allReviews'))} (${data.length})</h4>${list}
        <div class="dtop" style="margin-top:10px"><button class="ghost" data-open="${companyId}">${ic('x')} ${esc(t_('close'))}</button></div>`;
    }

    // show Hebrew date next to the trip date input
    document.addEventListener('input', (e) => {
      if (e.target && e.target.id === 'revDate') {
        draft.trip_date = e.target.value;
        $('revHeb').textContent = hebFromStr(e.target.value);
      }
    });

    // close calendar when clicking the dark background
    $('calModal').addEventListener('click', (e) => { if (e.target === $('calModal')) { $('calModal').style.display = 'none'; pickMode = false; } });

    document.addEventListener('click', async (e) => {
      const t = e.target.closest ? (e.target.closest('button, .st') || e.target) : e.target;
      const ds = t.dataset || {};

      if (ds.usersclose) { usersOpen = false; renderUsers(); return; }

      // Jewish calendar as a date picker
      const dayEl = e.target.closest ? e.target.closest('[data-day]') : null;
      if (dayEl && pickMode) {
        const v = dayEl.dataset.day;
        const inp = $('revDate');
        if (inp) { inp.value = v; draft.trip_date = v; $('revHeb').textContent = hebFromStr(v); }
        $('calModal').style.display = 'none';
        pickMode = false;
        return;
      }
      if (ds.pickdate) { openPick(); return; }

      if (ds.cal) {
        if (ds.cal === 'close') { $('calModal').style.display = 'none'; pickMode = false; return; }
        if (ds.cal === 'today') calAnchor = noon(new Date());
        if (ds.cal === 'next') { calAnchor = new Date(calLast); calAnchor.setDate(calAnchor.getDate() + 1); }
        if (ds.cal === 'prev') { calAnchor = new Date(calFirst); calAnchor.setDate(calAnchor.getDate() - 1); }
        renderCal();
        return;
      }

      if (ds.ban) {
        if (!confirm(t_('confirmBan'))) return;
        const del = confirm(t_('confirmBanDel'));
        const { error } = await sb.rpc('admin_set_ban', { target: ds.ban, ban: true, del_reviews: del });
        if (error) { alert(error.message); return; }
        await loadCompanies();
        toast(t_('banned'));
        return;
      }
      if (ds.unban) {
        if (!confirm(t_('confirmUnban'))) return;
        const { error } = await sb.rpc('admin_set_ban', { target: ds.unban, ban: false, del_reviews: false });
        if (error) { alert(error.message); return; }
        await loadCompanies();
        toast(t_('saved'));
        return;
      }

      if (ds.open) {
        const wasOpen = openId === ds.open;
        openId = wasOpen ? null : ds.open;
        draft = {};
        renderCompanies();
        const card = $('co-' + ds.open);
        if (card) card.scrollIntoView({ behavior: 'smooth', block: 'start' });
        return;
      }

      if (t.classList && t.classList.contains('st')) {
        const cat = t.parentElement.dataset.cat;
        const v = Number(t.dataset.v);
        if (!REQ_KEYS.includes(cat) && draft[cat] === v) draft[cat] = null; else draft[cat] = v;
        t.parentElement.querySelectorAll('.st').forEach(s => s.classList.toggle('on', Number(s.dataset.v) <= (draft[cat] || 0)));
        return;
      }

      if (ds.rec !== undefined) {
        const val = ds.rec === '1';
        draft.rec = (draft.rec === val) ? undefined : val;
        document.querySelectorAll('.recbtn').forEach(b => b.classList.toggle('on', draft.rec === (b.dataset.rec === '1')));
        return;
      }

      if (ds.tag) {
        draft.tags = draft.tags || [];
        const i = draft.tags.indexOf(ds.tag);
        if (i >= 0) draft.tags.splice(i, 1); else draft.tags.push(ds.tag);
        t.classList.toggle('on', i < 0);
        return;
      }

      if (ds.delrev) {
        if (!confirm(t_('confirmDelAnyRev'))) return;
        const { error } = await sb.from('reviews').delete().eq('id', ds.delrev);
        if (error) { alert(error.message); return; }
        loadCompanies();
        return;
      }

      if (ds.delco) {
        if (!confirm(t_('confirmDelCo'))) return;
        const { error } = await sb.from('companies').delete().eq('id', ds.delco);
        if (error) { alert(error.message); return; }
        if (openId === ds.delco) openId = null;
        loadCompanies();
        return;
      }

      if (ds.edco) { editingId = ds.edco; renderCompanies(); return; }
      if (ds.canceledit) { editingId = null; renderCompanies(); return; }

      if (ds.saveedit) {
        const name = $('eName').value.trim();
        if (!name) return showMsg($('editMsg'), t_('nameRequired'), false);
        t.disabled = true;
        try {
          const ph = $('ePhone').value.trim();
          const row = {
            name,
            city: $('eCity').value.trim() || null,
            description: $('eDesc').value.trim() || null,
            phone: ph ? fmtPhone(ph) : null,
            email: $('eEmail').value.trim() || null
          };
          const file = $('eLogoFile').files[0];
          if (file) row.logo_url = await uploadLogo(file);
          const { error } = await sb.from('companies').update(row).eq('id', ds.saveedit);
          if (error) throw error;
          editingId = null;
          loadCompanies();
        } catch (err) {
          showMsg($('editMsg'), err.message || String(err), false);
          t.disabled = false;
        }
        return;
      }

      if (t.id === 'submitReview') {
        const msg = $('revMsg');
        if (isBanned) return showMsg(msg, t_('bannedMsg'), false);
        if (REQ_KEYS.some(k => !draft[k])) return showMsg(msg, t_('rateAll'), false);
        const vals = {
          comment: $('revComment').value.trim() || null,
          recommend: (draft.rec === true || draft.rec === false) ? draft.rec : null,
          tags: draft.tags || [],
          trip_date: $('revDate').value || null,
          time_of_day: $('revTod').value || null,
          driver_service: draft.driver_service || null,
          updated_at: new Date().toISOString()
        };
        REQ_KEYS.forEach(k => vals[k] = draft[k]);
        t.disabled = true;

        let error = null;
        if (myReviewId) {
          const res = await sb.from('reviews').update(vals).eq('id', myReviewId).eq('user_id', myUid).select();
          error = res.error;
          if (!error && (!res.data || res.data.length === 0)) {
            t.disabled = false;
            return showMsg(msg, t_('notSaved'), false);
          }
        } else {
          const res = await sb.from('reviews').insert({ ...vals, company_id: t.dataset.company, user_id: myUid });
          error = res.error;
        }
        if (error) { t.disabled = false; return showMsg(msg, error.message, false); }

        const cid = openId;
        draft = {};
        openId = null;
        await loadCompanies();
        toast(t_('saved'));
        const card = $('co-' + cid);
        if (card) card.scrollIntoView({ behavior: 'smooth', block: 'start' });
        return;
      }

      if (t.id === 'deleteReview') {
        if (!confirm(t_('confirmDelRev'))) return;
        const { error } = await sb.from('reviews').delete()
          .eq('company_id', t.dataset.company).eq('user_id', myUid);
        if (error) return showMsg($('revMsg'), error.message, false);
        draft = {};
        openId = null;
        await loadCompanies();
        toast(t_('deleted'));
      }
    });

    async function render(session) {
      if (session) {
        myUid = session.user.id;
        myEmail = session.user.email;
        loggedIn = true;
        $('authView').classList.add('hidden');
        $('mainView').classList.remove('hidden');
        await checkAdmin();
        await checkBanned();
        applyStaticText();
        loadCompanies();
      } else {
        myUid = null; myEmail = ''; loggedIn = false; isAdmin = false; isBanned = false; usersOpen = false;
        $('authView').classList.remove('hidden');
        $('mainView').classList.add('hidden');
        applyStaticText();
      }
    }

    applyStaticText();
    sb.auth.onAuthStateChange((_event, session) => { render(session); });
    sb.auth.getSession().then(({ data }) => render(data.session));
  </script>
</body>
</html>

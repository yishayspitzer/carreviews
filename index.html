<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CarReviews</title>
  <link rel="icon" id="favicon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="style.css?v=13">
</head>
<body>
  <div id="hotlineBar"></div>
  <div id="toast"></div>
  <input type="file" id="sugFile" accept="image/*" class="hidden">

  <div id="calModal">
    <div class="calBox">
      <div class="calHead">
        <button class="calNav" type="button" data-cal="prev">&#8594;</button>
        <div class="calTitle"><b id="calTitle"></b><small id="calSub"></small></div>
        <button class="calNav" type="button" data-cal="next">&#8592;</button>
      </div>
      <div class="calHint hidden" id="calHint"></div>
      <div id="calBody"></div>
      <div class="calFoot">
        <button class="ghost small" data-cal="today" id="calTodayBtn" style="margin:0"></button>
        <button class="small" data-cal="close" id="calCloseBtn" style="margin:0"></button>
      </div>
    </div>
  </div>

  <div class="topbar">
    <div class="wrap">
      <div class="tbrand"><div class="mark"><svg class="ic" viewBox="0 0 24 24" style="width:22px;height:22px"><path d="M3 17h18v-4l-2-6H5l-2 6z"/><circle cx="7.5" cy="17" r="1.5"/><circle cx="16.5" cy="17" r="1.5"/></svg></div><span>Car<b>Reviews</b></span></div>
      <button id="calBtn" type="button"></button>
      <div id="userbar">
        <select id="langSel">
          <option value="en">English</option>
          <option value="yi">ייִדיש</option>
          <option value="ru">Русский</option>
          <option value="es">Español</option>
        </select>
        <span id="userinfo"></span>
      </div>
    </div>
  </div>

  <div class="wrap">
  <div class="hero"><div class="logoCard"><div class="logoBox"><img src="logo.png" alt="CarReviews"></div></div></div>

  <div id="authView">
    <div class="card welcome" id="welcome"></div>
    <div class="box card">
      <h2 id="authTitle"></h2>
      <div id="msg" class="msg"></div>
      <div id="nameWrap" class="hidden"><input id="fullName" type="text"></div>
      <input id="email" type="email">
      <div id="phoneWrap" class="hidden">
        <input id="signPhone" type="tel" inputmode="tel">
        <div class="hintline" id="phoneHint"></div>
      </div>
      <div class="pwwrap">
        <input id="password" type="password">
        <button id="showPw" type="button"></button>
      </div>
      <button id="authBtn" style="width:100%;justify-content:center;margin-top:8px;padding:13px"></button>
      <p style="text-align:center"><button id="toggleBtn" class="link"></button></p>
    </div>
  </div>

  <div id="mainView" class="hidden">
    <div id="bannedBanner" class="banner hidden"></div>
    <div class="row toolbar">
      <h2 id="tCompanies"></h2>
      <div class="btns">
        <button id="msgToggle" class="ghost hidden"></button>
        <button id="usersToggle" class="ghost hidden"></button>
        <button id="addToggle" class="gold"></button>
      </div>
    </div>

    <div id="reqPanel" class="card hidden" style="background:#fef3c7;border:1.5px dashed var(--gold)"></div>
    <div id="usersPanel" class="card hidden"></div>

    <div id="msgForm" class="card hidden">
      <div class="row" style="margin-bottom:6px">
        <h3 id="msgTitle" style="margin:0"></h3>
        <button class="ghost small" id="msgClose" type="button" style="margin:0"></button>
      </div>
      <div id="msgNote" class="msg"></div>
      <textarea id="msgBody" rows="4" maxlength="2000"></textarea>
      <button id="msgSend" type="button"></button>
    </div>

    <div id="addForm" class="card hidden">
      <div class="row" style="margin-bottom:6px">
        <h3 id="tAddTitle" style="margin:0"></h3>
        <button class="ghost small" id="addClose" type="button" style="margin:0"></button>
      </div>
      <div id="tApprNote" class="note hidden"></div>
      <div id="addMsg" class="msg"></div>
      <input id="cName" type="text">
      <div id="cCityBox"></div>
      <textarea id="cDesc" rows="3"></textarea>
      <input id="cPhone" type="text">
      <input id="cEmail" type="email">
      <div class="fileline" id="tLogoOpt"></div>
      <input id="cLogoFile" type="file" accept="image/*">
      <button id="saveCompany"></button>
    </div>

    <div class="filters">
      <div class="sw"><span id="searchIc"></span><input id="search" type="text"></div>
      <select id="sort">
        <option value="code"></option>
        <option value="rating"></option>
        <option value="count"></option>
        <option value="new"></option>
        <option value="name"></option>
      </select>
      <button type="button" id="mineBtn" class="ghost mineBtn"></button>
    </div>

    <div id="companies"></div>
  </div>

  <div id="ver">CarReviews v13</div>
  </div>

  <script src="lang.js?v=13"></script>
  <script src="app.js?v=13"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CarReviews</title>
  <link rel="icon" id="favicon" href="data:,">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root { --navy:#1a3c6e; --navy2:#12294d; --gold:#e8a317; --green:#1e8e3e; --red:#c0392b; --amber:#e8a317; --line:#e3e8ef; --soft:#f1f4f9;
            --top:linear-gradient(90deg,#1d4ed8,#0891b2); }
    * { box-sizing:border-box; }
    html { scroll-padding-top:76px; }
    body {
      font-family: -apple-system, "Segoe UI", Arial, sans-serif; max-width: 940px; margin: 0 auto; padding: 0 16px 60px; color:#1f2a37;
      background:
        radial-gradient(circle at 0% 0%, #cfe0fb 0, transparent 42%),
        radial-gradient(circle at 100% 18%, #ffe6b8 0, transparent 38%),
        radial-gradient(circle at 50% 100%, #d9f0e3 0, transparent 40%),
        linear-gradient(#f4f7fc, #eaf0f9);
      background-attachment: fixed; min-height:100vh;
    }
    svg.ic { width:1em; height:1em; vertical-align:-0.15em; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; flex:none; }
    button svg, .chip svg { pointer-events:none; }

    /* emails and phone numbers always read left-to-right, even inside a Yiddish (RTL) page */
    .ltr, .contact span.em, #userbar .em, input[type=email], input[type=tel] { direction:ltr; unicode-bidi:plaintext; }
    input[type=email]::placeholder, input[type=tel]::placeholder { direction:rtl; }
    .em { unicode-bidi:isolate; direction:ltr; display:inline-block; }
    a.tel { color:var(--navy); font-weight:700; text-decoration:none; border-bottom:1px dotted var(--navy); }

    /* top bar: bright color, always visible (sticky) */
    .topbar { position:sticky; top:0; z-index:60; display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; background:var(--top); color:#fff; padding:8px 14px; border-radius:0 0 14px 14px; box-shadow:0 4px 14px rgba(8,80,140,.3); }
    .topbar select { background:#fff; }
    #userbar { display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-size:14px; }
    #langSel { width:auto; margin:0; padding:6px 8px; }
    #calBtn { background:rgba(255,255,255,.18); border:1px solid rgba(255,255,255,.5); font-size:15px; padding:7px 14px; }

    .hero { display:flex; justify-content:center; margin:18px 0 6px; }
    .logoCard { background:#fff; border-radius:20px; padding:10px 18px; box-shadow:0 10px 30px rgba(18,41,77,.15); border-top:5px solid var(--gold); width:100%; }
    .logoBox img { display:block; width:100%; height:auto; mix-blend-mode:multiply; }

    .card { background:#fff; border:1px solid var(--line); border-radius:14px; padding:16px; margin:12px 0; box-shadow:0 2px 8px rgba(16,24,40,.06); }
    .card.co { border-inline-start:5px solid var(--navy); padding:18px; margin:16px 0; box-shadow:0 4px 14px rgba(16,24,40,.08); }
    .box { max-width:400px; margin:10px auto 30px; }
    input, textarea, select { width:100%; padding:10px 12px; margin:6px 0; border:1px solid #cdd5df; border-radius:8px; font-family:inherit; font-size:14px; background:#fff; }
    input:focus, textarea:focus, select:focus { outline:2px solid #c7d6ee; border-color:var(--navy); }
    textarea { resize:vertical; max-width:100%; min-height:70px; }
    select:required:invalid { color:#8896a8; }
    select:required:invalid option { color:#1f2a37; }
    ::placeholder { color:#9aa7b8; opacity:1; }
    .plabel { display:block; font-weight:700; font-size:13px; color:var(--navy); margin:0 0 2px; }
    .pwwrap { position:relative; }
    .pwwrap input { padding-inline-end:84px; }
    .pwwrap button { position:absolute; inset-inline-end:6px; top:11px; padding:4px 10px; font-size:12px; background:#e6ebf3; color:var(--navy); }

    .pricewrap { direction:ltr; display:flex; align-items:center; border:1px solid #cdd5df; border-radius:8px; background:#fff; margin:6px 0; padding-left:12px; }
    .pricewrap:focus-within { outline:2px solid #c7d6ee; border-color:var(--navy); }
    .pricewrap .dol { font-weight:800; color:var(--navy); font-size:18px; }
    .pricewrap input { border:0; margin:0; outline:none !important; background:transparent; }

    button { padding:9px 16px; border:0; border-radius:8px; background:var(--navy); color:#fff; cursor:pointer; font-size:14px; font-weight:600; display:inline-flex; align-items:center; gap:6px; font-family:inherit; }
    button:hover { filter:brightness(1.1); }
    button:disabled { opacity:.6; cursor:default; }
    button.link { background:none; color:var(--navy); text-decoration:underline; padding:4px; font-weight:500; }
    button.gold { background:var(--gold); }
    button.green { background:var(--green); }
    button.danger { background:var(--red); }
    button.ghost { background:#fff; color:var(--navy); border:1px solid #cdd5df; }
    button.small { padding:4px 10px; font-size:12px; margin-top:6px; }

    .msg { padding:8px 12px; border-radius:8px; margin:8px 0; display:none; }
    .err { background:#fde8e8; color:#a00; }
    .ok  { background:#e6f7e9; color:#0a6a22; }
    .banner { background:#fde8e8; color:#a00; border:1px solid #f3b9b9; border-radius:10px; padding:10px 14px; margin:10px 0; font-weight:600; }
    .note { background:#eef6ff; border:1px solid #cfe2fb; color:#1a3c6e; border-radius:8px; padding:8px 12px; margin:8px 0; font-size:13px; }
    .note.warn { background:#fff7e0; border-color:#f0d98a; color:#7a5a00; }
    .hidden { display:none !important; }
    .row { display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; }
    .toolbar { margin:10px 0 4px; }
    .toolbar .btns { display:flex; gap:8px; flex-wrap:wrap; }
    h2 { margin:10px 0; color:var(--navy); }
    h4 { margin:0 0 8px; color:var(--navy); font-size:15px; display:flex; align-items:center; gap:8px; }
    .fileline { font-size:13px; color:#555; margin:6px 0 2px; }
    #ver { text-align:center; color:#9aa7b8; font-size:12px; margin-top:28px; }

    .filters { display:flex; gap:10px; margin:6px 0; flex-wrap:wrap; }
    .filters .sw { position:relative; flex:2 1 220px; }
    .filters .sw svg { position:absolute; inset-inline-start:12px; top:19px; color:#8896a8; }
    .filters .sw input { padding-inline-start:36px; margin:6px 0; }
    .filters select { flex:1 1 150px; }

    /* ----- company card ----- */
    .chead { display:flex; justify-content:space-between; gap:14px; align-items:flex-start; }
    .cinfo { display:flex; align-items:center; gap:14px; min-width:0; }
    .clogo { width:60px; height:60px; object-fit:contain; border-radius:10px; border:1px solid #eee; background:#fff; flex:none; }
    .cname { font-weight:800; color:var(--navy); font-size:20px; line-height:1.2; }
    .meta { color:#5b6776; font-size:14px; margin-top:4px; }
    .contact { display:flex; flex-wrap:wrap; gap:8px 18px; color:#5b6776; font-size:14px; margin-top:10px; align-items:center; }
    .contact span { display:inline-flex; align-items:center; gap:6px; }
    .score { text-align:center; min-width:92px; background:rgba(255,255,255,.8); border-radius:12px; padding:8px 10px; }
    .score .big { font-size:30px; font-weight:800; line-height:1; }
    .score .cnt { font-size:12px; color:#5b6776; margin-top:2px; }
    .good { color:var(--green); } .mid { color:#c98a00; } .bad { color:var(--red); }
    .bg-good { background:var(--green); } .bg-mid { background:var(--amber); } .bg-bad { background:var(--red); }
    .stars { color:var(--gold); letter-spacing:1px; font-size:15px; }
    .pill { display:inline-flex; align-items:center; gap:6px; padding:4px 10px; border-radius:999px; font-size:13px; font-weight:600; background:#e6f4ea; color:var(--green); margin-top:8px; }
    .pill.low { background:#fde8e8; color:var(--red); }

    /* call button + user activity */
    .callbtn { display:inline-flex; align-items:center; gap:6px; background:var(--green); color:#fff !important; text-decoration:none; font-weight:700; padding:7px 14px; border-radius:999px; direction:ltr; box-shadow:0 2px 6px rgba(30,142,62,.35); }
    .callbtn:hover { filter:brightness(1.1); }
    .callbtn.sm { padding:3px 10px; font-size:12px; margin-inline-start:6px; }
    .urow.idle { background:#fff0d9; border-radius:8px; padding-inline:8px; }
    .ustat { display:inline-flex; align-items:center; gap:4px; font-size:12px; font-weight:700; background:#eef2f8; color:var(--navy); border-radius:999px; padding:1px 9px; margin-inline-end:4px; }
    .ustat.warn { background:#ffd9a3; color:#7a4300; }

    .tabs { display:flex; gap:8px; flex-wrap:wrap; margin-top:16px; }
    .tabs button { background:#fff; color:var(--c); border:1.5px solid var(--c); padding:8px 14px; }
    .tabs button.on { background:var(--c); color:#fff; }
    .tabs button .n { background:rgba(0,0,0,.08); border-radius:10px; padding:0 7px; font-size:12px; font-weight:700; }
    .tabs button.on .n { background:rgba(255,255,255,.28); }
    .tabs button[data-open] { --c:#1a3c6e; }
    .tabs button[data-prices] { --c:#0e8a9a; }
    .tabs button[data-comments] { --c:#7b3fa0; }
    .tabs button[data-write] { --c:#1e8e3e; }
    .more { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
    .more button { font-size:12px; padding:5px 12px; background:#fff; color:var(--c); border:1px solid var(--c); }
    .more button[data-sendlogo] { --c:#b83280; }
    .more button[data-edco] { --c:#e8660a; }
    .more button.gold { background:var(--gold); color:#fff; border:0; }
    .more button.danger { background:var(--red); color:#fff; border:0; }

    /* ----- opened panel ----- */
    .detail { margin-top:16px; border-top:1px solid rgba(0,0,0,.08); padding-top:14px; }
    .dhead { display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:12px; }
    .dhead h4 { margin:0; font-size:17px; }
    .dhead button { margin:0; }
    .sect { background:var(--soft); border-radius:12px; padding:14px; margin:12px 0; }
    .sect.white { background:#fff; border:1px solid var(--line); }
    .sect.ride { background:#eef6ff; border:1px solid #cfe2fb; }
    .sect.sug { background:#fff7e0; border:1px dashed var(--gold); }
    .cols { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
    @media (max-width:640px) { .cols { grid-template-columns:1fr; } .chead { flex-direction:column; } }
    .grp { font-weight:700; color:var(--navy); font-size:13px; text-transform:uppercase; letter-spacing:.5px; margin:0 0 8px; display:flex; align-items:center; gap:8px; }
    .bar { display:grid; grid-template-columns:22px 1fr 110px 34px; align-items:center; gap:8px; padding:5px 0; font-size:14px; }
    .bar .track { height:8px; background:#dfe5ee; border-radius:6px; overflow:hidden; }
    .bar .fill { height:100%; border-radius:6px; }
    .bar .val { font-weight:700; text-align:end; }
    @media (max-width:640px) { .bar { grid-template-columns:22px 1fr 80px 30px; } }

    .field { border:2px solid #d3dcea; background:#fbfcff; border-radius:12px; padding:10px 12px; margin:10px 0; }
    .optbox { border:2px dashed #d3dcea; border-radius:12px; padding:10px 12px; margin:12px 0; background:#fcfdff; }

    .catrow { display:flex; justify-content:space-between; align-items:flex-end; padding:2px 0; gap:8px; font-size:14px; }
    .catrow .lbl { display:flex; align-items:center; gap:8px; font-weight:600; padding-bottom:4px; }
    .pick { direction:ltr; display:flex; }
    .pick .st { cursor:pointer; display:inline-flex; flex-direction:column; align-items:center; padding:0 3px; user-select:none; }
    .pick .st .sn { font-style:normal; font-size:13px; font-weight:800; color:#5b6776; line-height:1; margin-bottom:2px; }
    .pick .st .sg { font-size:28px; line-height:1; color:#cfd6df; }
    .pick .st.on .sg { color:var(--gold); }
    .pick .st.on .sn { color:var(--navy); }
    .opt { font-size:12px; color:#7a8798; font-weight:400; }
    .hintline { font-size:12px; color:#7a8798; margin:4px 0 0; }

    .ptq { font-weight:700; font-size:14px; color:var(--navy); margin:2px 0 8px; display:flex; align-items:center; gap:8px; }
    .ptopts { display:grid; gap:8px; }
    .optcard { display:flex; align-items:center; justify-content:flex-start; gap:10px; width:100%; background:#fff; color:#1f2a37; border:2px solid #aebbd0; border-radius:12px; padding:11px 14px; font-weight:600; text-align:start; box-shadow:0 1px 2px rgba(16,24,40,.06); }
    .optcard::before { content:''; flex:none; width:18px; height:18px; border-radius:50%; border:2px solid #8fa0bb; background:#fff; }
    .optcard:hover { border-color:var(--navy); background:#f3f7ff; filter:none; }
    .optcard.on { background:var(--navy); border-color:var(--navy); color:#fff; }
    .optcard.on::before { border-color:#fff; background:radial-gradient(circle,#fff 0 4px,var(--navy) 5px); }
    .optcard.yes.on { background:var(--green); border-color:var(--green); }
    .optcard.yes.on::before { background:radial-gradient(circle,#fff 0 4px,var(--green) 5px); }
    .optcard.no.on { background:var(--red); border-color:var(--red); }
    .optcard.no.on::before { background:radial-gradient(circle,#fff 0 4px,var(--red) 5px); }
    .recbtns { display:grid; grid-template-columns:1fr 1fr; gap:8px; }

    .chips { display:flex; flex-wrap:wrap; gap:8px; margin:6px 0; }
    .chip { padding:8px 14px; border-radius:14px; font-size:13px; background:#fff; border:2px solid #aebbd0; color:#444; cursor:pointer; font-weight:600; display:inline-flex; align-items:center; gap:5px; }
    .chip.pos { border-color:var(--green); color:var(--green); }
    .chip.neg { border-color:var(--red); color:var(--red); }
    .chip.pos.on { background:var(--green); color:#fff; }
    .chip.neg.on { background:var(--red); color:#fff; }
    .chip.static { cursor:default; padding:3px 10px; border-width:1.5px; }
    .two { display:flex; gap:10px; flex-wrap:wrap; }
    .two > * { flex:1 1 150px; }
    .placebox { flex:1 1 150px; }
    .placebox select, .placebox input { margin-bottom:0; }
    .placebox input { margin-top:6px; }

    .datebtn { width:100%; justify-content:flex-start; background:#fff; color:#8896a8; border:1px solid #cdd5df; padding:10px 12px; margin:6px 0 0; font-weight:500; font-size:14px; text-align:start; }
    .datebtn.has { color:#1f2a37; font-weight:700; }

    .rev { background:#fff; border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin:8px 0; }
    .rev .rh { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
    .badge { color:#fff; font-weight:800; border-radius:8px; padding:4px 10px; font-size:15px; }
    .rev .mini { display:flex; flex-wrap:wrap; gap:4px 14px; font-size:13px; color:#5b6776; margin-top:8px; }
    .rev .mini b { color:#1f2a37; }
    .rev .mini span { display:inline-flex; align-items:center; gap:5px; }
    .rev details { margin-top:8px; }
    .rev summary { cursor:pointer; font-size:13px; color:#5b6776; }
    .cmt { background:#fffdf5; border-inline-start:3px solid var(--gold); padding:8px 10px; border-radius:6px; margin-top:8px; white-space:pre-wrap; word-break:break-word; }
    .yn { font-weight:700; font-size:13px; display:inline-flex; align-items:center; gap:4px; }
    .ridebox { background:#eef6ff; border:1px solid #cfe2fb; border-radius:8px; padding:8px 10px; margin-top:8px; font-size:14px; display:flex; flex-wrap:wrap; gap:6px 14px; align-items:center; }
    .ridebox span { display:inline-flex; align-items:center; gap:6px; }
    .price { background:var(--navy); color:#fff; border-radius:6px; padding:2px 10px; font-weight:800; direction:ltr; white-space:nowrap; }
    .showmore { text-align:center; margin-top:10px; }
    .flag { background:#fff3cd; color:#7a5a00; border:1px solid #f0d98a; border-radius:6px; padding:1px 8px; font-size:12px; font-weight:700; display:inline-block; margin:2px 0; }

    .rtgrid { display:grid; grid-template-columns:repeat(auto-fill, minmax(210px, 1fr)); gap:10px; margin-bottom:6px; }
    .rt { background:#eef6ff; border:1px solid #cfe2fb; border-radius:12px; padding:12px; }
    .rt-route { font-weight:700; color:var(--navy); font-size:14px; display:flex; align-items:center; gap:6px; }
    .rt-price { font-size:26px; font-weight:800; color:#0e8a9a; margin-top:4px; direction:ltr; }
    .rt-sub { font-size:12px; color:#5b6776; margin-top:2px; }
    .prow { display:flex; justify-content:space-between; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid #e3e8ef; font-size:14px; }
    .prow:last-child { border-bottom:0; }
    .pr-route { font-weight:600; color:#1f2a37; }
    .pr-meta { font-size:12px; color:#7a8798; margin-top:2px; }

    .author { background:#fff7e0; border:1px dashed var(--gold); border-radius:8px; padding:6px 10px; margin-top:8px; font-size:13px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
    .tagban { background:var(--red); color:#fff; border-radius:6px; padding:1px 8px; font-size:12px; font-weight:700; }
    .sugrow { display:flex; align-items:center; gap:12px; padding:8px 0; border-bottom:1px solid #f0e2b8; flex-wrap:wrap; }
    .sugrow:last-child { border-bottom:0; }
    .sugrow img { width:90px; height:56px; object-fit:contain; background:#fff; border:1px solid #eee; border-radius:8px; }
    .sugrow .sbtns { display:flex; gap:6px; margin-inline-start:auto; }

    .reqitem { padding:10px 0; border-bottom:1px solid #f0e2b8; }
    .reqitem:last-child { border-bottom:0; }
    .reqitem .kv { display:flex; flex-wrap:wrap; gap:4px 14px; font-size:14px; margin:6px 0; }
    .reqitem .old { color:#999; text-decoration:line-through; }
    .tagkind { background:var(--navy); color:#fff; border-radius:6px; padding:1px 8px; font-size:12px; font-weight:700; }
    .prof { display:flex; flex-wrap:wrap; gap:4px 16px; font-size:14px; margin:6px 0; align-items:center; }
    .prof span { display:inline-flex; align-items:center; gap:6px; }

    .urow { display:flex; justify-content:space-between; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--line); flex-wrap:wrap; }
    .urow:last-child { border-bottom:0; }

    #toast { position:fixed; top:76px; left:50%; transform:translateX(-50%); width:max-content; max-width:92vw; text-align:center; background:var(--green); color:#fff; padding:10px 18px; border-radius:10px; font-weight:600; box-shadow:0 6px 18px rgba(0,0,0,.25); display:none; z-index:80; align-items:center; gap:8px; }
    #toast.err { background:var(--red); }

    #calModal { position:fixed; inset:0; background:rgba(10,20,40,.55); display:none; align-items:center; justify-content:center; z-index:70; padding:12px; }
    .calBox { direction:rtl; background:#fff; border-radius:18px; width:min(480px,100%); max-height:96vh; overflow:auto; box-shadow:0 20px 50px rgba(0,0,0,.35); }
    .calHead { display:flex; align-items:center; gap:8px; padding:14px; background:var(--top); color:#fff; }
    .calNav { margin:0; width:40px; height:40px; padding:0; justify-content:center; font-size:20px; border-radius:50%; background:rgba(255,255,255,.2); border:1px solid rgba(255,255,255,.5); color:#fff; flex:none; }
    .calTitle { text-align:center; flex:1; }
    .calTitle b { display:block; font-size:24px; letter-spacing:.3px; }
    .calTitle small { display:block; color:#e0f2fe; direction:ltr; unicode-bidi:isolate; font-size:12px; margin-top:2px; }
    .calHint { background:#fff7e0; color:#7a5a00; font-size:13px; font-weight:700; text-align:center; padding:7px 10px; }
    #calBody { padding:12px 12px 6px; }
    .calGrid { display:grid; grid-template-columns:repeat(7,1fr); gap:5px; }
    .cw { text-align:center; font-weight:700; color:var(--navy); font-size:11px; line-height:1.15; padding:5px 0; border-bottom:2px solid var(--line); }
    .cw.sat { color:#5b3a8c; border-bottom-color:#d9ccef; }
    @media (max-width:480px) { .cw { font-size:9px; } }
    .cd { text-align:center; border-radius:10px; padding:6px 0 5px; background:#f8faff; border:1.5px solid #c9d3e3; min-height:58px; }
    .cd b { display:block; font-size:20px; color:#1f2a37; line-height:1.15; }
    .cd small { display:block; color:#8896a8; font-size:11px; direction:ltr; unicode-bidi:isolate; }
    .cd .hl { display:block; font-style:normal; font-size:9.5px; font-weight:800; color:#c25400; line-height:1.15; margin-top:1px; }
    .cd.sat { background:#f3eefc; border-color:#c9b8ea; }
    .cd.sat b { color:#5b3a8c; }
    .cd.today { border:2px solid var(--gold); background:#fff7e0; }
    .cd.sel { background:var(--navy); border-color:var(--navy); }
    .cd.sel b, .cd.sel small { color:#fff; }
    .cd.sel .hl { color:#ffd9a8; }
    .cd.blank { background:none; border:0; }
    .cd[data-day] { cursor:pointer; }
    .cd[data-day]:hover { background:#dbe6fb; border-color:#7aa2e8; }
    .cd.sel[data-day]:hover { background:var(--navy); }
    .cd.fut { opacity:.35; }
